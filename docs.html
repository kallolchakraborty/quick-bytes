  <script>
    (function() {
      var sidebar = document.getElementById('left-sidebar');
      var backdrop = document.getElementById('sidebar-backdrop');
      var toggle = document.getElementById('sidebar-toggle');
      if (!sidebar || !backdrop || !toggle) return;
      function openSidebar() { sidebar.classList.remove('-translate-x-full'); backdrop.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
      function closeSidebar() { sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden'); document.body.style.overflow = ''; }
      toggle.addEventListener('click', function() { sidebar.classList.contains('-translate-x-full') ? openSidebar() : closeSidebar(); });
      backdrop.addEventListener('click', closeSidebar);
      sidebar.querySelectorAll('.sidebar-link').forEach(function(link) {
        link.addEventListener('click', function() { if (window.innerWidth < 1024) closeSidebar(); });
      });
      window.addEventListener('resize', function() { if (window.innerWidth >= 1024) { backdrop.classList.add('hidden'); document.body.style.overflow = ''; } });
    })();
  </script>
  <script>
    (function() {
      var phasesContainer = document.getElementById('sidebar-phases');
      if (!phasesContainer || typeof QUICK_BYTES === 'undefined') return;
      var phases = QUICK_BYTES.phases || [];
      var html = '';
      phases.forEach(function(phase, idx) {
        html += '<div class="px-2 py-3' + (idx > 0 ? ' border-t theme-border mt-2' : '') + '">';
        html += '<div class="text-[10px] font-bold text-brand-500 uppercase tracking-wider mb-2">Phase ' + (idx + 1) + ': ' + phase.title + '</div>';
        html += '<div class="text-[9px] theme-text-muted uppercase tracking-wider mb-2 pl-0.5">' + phase.level + '</div>';
        html += '</div>';
        (phase.guides || []).forEach(function(guide) {
          html += '<div class="sidebar-section">';
          html += '<a href="#' + guide.id + '" class="sidebar-link">' + guide.title + '</a>';
          html += '</div>';
        });
      });
      phasesContainer.innerHTML = html;
      if (typeof initDocs === 'function') {
        initDocs();
        if (typeof updateBookmarksSidebar === 'function') updateBookmarksSidebar();
      }
    })();
  </script>
