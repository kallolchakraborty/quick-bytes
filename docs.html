  <script>
    (function() {
      var phasesContainer = document.getElementById('sidebar-phases');
      if (!phasesContainer) return;

      function renderSidebar() {
        if (typeof QUICK_BYTES === 'undefined' || !QUICK_BYTES.phases) return;
        var phases = QUICK_BYTES.phases || [];
        var html = '';
        phases.forEach(function(phase, idx) {
          if (idx > 0) html += '<div class="sidebar-divider"></div>';
          html += '<div class="sidebar-section-header">' + phase.title + '</div>';
          html += '<div class="sidebar-level">' + phase.level + '</div>';
         (phase.guides || []).forEach(function(guide) {
           html += '<a href="#' + guide.id + '" class="sidebar-link"><span class="material-symbols-outlined sidebar-link-icon" aria-hidden="true">' + (guide.icon || 'menu_book') + '</span>' + guide.title + '</a>';
         });
        });
        phasesContainer.innerHTML = html;
        if (typeof initDocs === 'function') initDocs();
        if (typeof updateBookmarksSidebar === 'function') updateBookmarksSidebar();
      }

      window.addEventListener('okf-ready', renderSidebar);
      window.addEventListener('okf-reload', renderSidebar);

      if (typeof QUICK_BYTES !== 'undefined' && QUICK_BYTES.phases) {
        renderSidebar();
      }
    })();
  </script>
