<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#059669"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="900" height="550" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Function Calling Flow</text>
    <line x1="320" y1="34" x2="580" y2="34" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="50" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Structured JSON interface between LLMs and external tools/APIs</text>
  </g>

  <!-- ==================== STEP 1: DEFINE TOOLS ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.5s" fill="freeze"/>
    <rect x="30" y="68" width="840" height="30" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="450" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-default, #e95420)">STEP 1: Provide tool definitions to the LLM</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
    <rect x="30" y="108" width="840" height="80" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="30" y="108" width="840" height="26" rx="8" fill="#64748b"/>
    <rect x="30" y="126" width="840" height="8" fill="#64748b"/>
    <text x="450" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">TOOL SCHEMA (JSON)</text>
    <text x="45" y="148" font-size="8" fill="var(--text-muted, #64748b)" font-family="monospace">{</text>
    <text x="55" y="162" font-size="8" fill="var(--text-muted, #64748b)" font-family="monospace">"name": "search_documents",</text>
    <text x="55" y="176" font-size="8" fill="var(--text-muted, #64748b)" font-family="monospace">"description": "Search knowledge base",</text>
    <text x="55" y="190" font-size="8" fill="var(--text-muted, #64748b)" font-family="monospace">"parameters": { "query": "string", "top_k": "integer" }</text>
  </g>

  <!-- ==================== STEP 2: USER QUERY ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.7s" fill="freeze"/>
    <line x1="30" y1="205" x2="870" y2="205" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <rect x="30" y="215" width="840" height="30" rx="6" fill="rgba(37,99,235,0.06)"/>
    <text x="450" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">STEP 2: User sends query → LLM decides to call a tool</text>
  </g>

  <!-- ==================== FLOW DIAGRAM ==================== -->
  <!-- User -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    <rect x="50" y="260" width="140" height="55" rx="10" fill="var(--bg-default, #ffffff)" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="120" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-default, #0f172a)">User</text>
    <text x="120" y="300" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">"Search for docs"</text>

    <!-- Arrow -->
    <line x1="190" y1="288" x2="225" y2="288" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="210" y="280" font-size="7" fill="#2563eb" font-weight="600">Query</text>
  </g>

  <!-- LLM decides -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
    <rect x="230" y="253" width="180" height="70" rx="12" fill="var(--brand-default, #e95420)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <text x="320" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">LLM</text>
    <text x="320" y="298" text-anchor="middle" font-size="8" fill="#fde8dc">Analyzes query + tool</text>
    <text x="320" y="312" text-anchor="middle" font-size="8" fill="#fde8dc">decides to call tool</text>

    <!-- Arrow -->
    <line x1="410" y1="288" x2="445" y2="288" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="430" y="280" font-size="7" fill="var(--brand-default, #e95420)" font-weight="600">JSON</text>
  </g>

  <!-- Tool Call JSON -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.0s" fill="freeze"/>
    <rect x="450" y="258" width="200" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="2;3;2" dur="1.5s" begin="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="450" y="258" width="200" height="24" rx="8" fill="#2563eb"/>
    <rect x="450" y="274" width="200" height="8" fill="#2563eb"/>
    <text x="550" y="276" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">TOOL CALL</text>
    <text x="460" y="294" font-size="8" fill="var(--text-default, #0f172a)" font-family="monospace">{ "name": "search",</text>
    <text x="460" y="308" font-size="8" fill="var(--text-default, #0f172a)" font-family="monospace">  "params": { "q": "docs" } }</text>

    <!-- Arrow -->
    <line x1="650" y1="288" x2="685" y2="288" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Execute function -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <rect x="690" y="253" width="180" height="70" rx="10" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect x="690" y="253" width="180" height="28" rx="10" fill="#059669"/>
    <rect x="690" y="273" width="180" height="8" fill="#059669"/>
    <text x="780" y="274" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">EXECUTE</text>
    <text x="700" y="296" font-size="8" fill="var(--text-default, #0f172a)">Run function</text>
    <text x="700" y="310" font-size="8" fill="var(--text-muted, #64748b)">search("docs")</text>

    <!-- Arrow back -->
    <line x1="780" y1="323" x2="780" y2="365" stroke="#059669" stroke-width="2"/>
    <line x1="780" y1="365" x2="320" y2="365" stroke="#059669" stroke-width="2"/>
    <line x1="320" y1="365" x2="320" y2="323" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="550" y="358" font-size="7" fill="#059669" font-weight="600">Result returned to LLM</text>
  </g>

  <!-- ==================== STEP 3: LLM GENERATES RESPONSE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.3s" fill="freeze"/>
    <line x1="30" y1="390" x2="870" y2="390" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <rect x="30" y="400" width="840" height="30" rx="6" fill="rgba(5,150,105,0.08)"/>
    <text x="450" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">STEP 3: LLM uses tool result to generate final answer</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
    <!-- LLM again -->
    <rect x="180" y="442" width="160" height="55" rx="10" fill="var(--brand-default, #e95420)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <text x="260" y="465" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">LLM</text>
    <text x="260" y="483" text-anchor="middle" font-size="8" fill="#fde8dc">Generates with context</text>

    <!-- Arrow -->
    <line x1="340" y1="470" x2="380" y2="470" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Response -->
    <rect x="385" y="440" width="340" height="57" rx="8" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="385" y="440" width="340" height="24" rx="8" fill="#059669"/>
    <rect x="385" y="456" width="340" height="8" fill="#059669"/>
    <text x="555" y="457" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">FINAL ANSWER</text>
    <text x="395" y="478" font-size="9" fill="var(--text-default, #0f172a)">"I found 3 relevant documents about..."</text>
    <text x="395" y="492" font-size="8" fill="var(--text-muted, #64748b)">Grounded in function output</text>
  </g>

  <!-- Bottom: Staff+ Rules -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
    <rect x="50" y="510" width="800" height="30" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="450" y="530" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Staff+ Rules: Always validate tool calls  |  Set timeouts (5-10s)  |  Handle errors gracefully  |  Log every tool call</text>
  </g>
</svg>
