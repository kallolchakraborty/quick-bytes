<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Ubuntu, sans-serif">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E95420"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>
    <linearGradient id="barGradWarn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="420" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.1s" fill="freeze"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#C34113">KV Cache Memory Growth with Sequence Length</text>
    <text x="450" y="46" text-anchor="middle" font-size="11" fill="#64748b">LLaMA 3 70B — KV cache memory in FP16</text>
    <line x1="210" y1="54" x2="690" y2="54" stroke="#E95420" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- ==================== Y-AXIS ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/>
    <!-- Y-axis line -->
    <line x1="100" y1="70" x2="100" y2="360" stroke="#94a3b8" stroke-width="1"/>
    <!-- Y-axis labels: 0, 50, 100, 150, 200, 250, 300, 350 -->
    <!-- Scale: 0GB at y=360, 350GB at y=70. Range=350, pixels=290. So 1GB = 0.8286px -->
    <text x="90" y="364" text-anchor="end" font-size="9" fill="#64748b">0</text>
    <line x1="96" y1="360" x2="100" y2="360" stroke="#94a3b8" stroke-width="1"/>
    <text x="90" y="322" text-anchor="end" font-size="9" fill="#64748b">50</text>
    <line x1="96" y1="318" x2="100" y2="318" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="90" y="281" text-anchor="end" font-size="9" fill="#64748b">100</text>
    <line x1="96" y1="277" x2="100" y2="277" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="90" y="239" text-anchor="end" font-size="9" fill="#64748b">150</text>
    <line x1="96" y1="235" x2="100" y2="235" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="90" y="197" text-anchor="end" font-size="9" fill="#64748b">200</text>
    <line x1="96" y1="194" x2="100" y2="194" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="90" y="156" text-anchor="end" font-size="9" fill="#64748b">250</text>
    <line x1="96" y1="152" x2="100" y2="152" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="90" y="114" text-anchor="end" font-size="9" fill="#64748b">300</text>
    <line x1="96" y1="110" x2="100" y2="110" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="90" y="73" text-anchor="end" font-size="9" fill="#64748b">350</text>
    <line x1="96" y1="70" x2="100" y2="70" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <!-- Y-axis title -->
    <text x="20" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b" transform="rotate(-90,20,215)">Memory (GB)</text>
  </g>

  <!-- ==================== X-AXIS ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/>
    <line x1="100" y1="360" x2="860" y2="360" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- ==================== BARS ==================== -->
  <!-- Scale: 0GB = y360, 350GB = y70. pixel_per_gb = 290/350 = 0.82857 -->
  <!-- Bar width = 70, spacing = ~100, centered in 760px range starting at x=120 -->

  <!-- 1K: 2.6GB → height = 2.6*0.8286 = 2.15px → y = 358 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.4s" fill="freeze"/>
    <rect x="120" y="358" width="70" height="0" rx="4" fill="url(#barGrad)" filter="url(#shadow)">
      <animate attributeName="height" values="0;2.15" dur="0.6s" begin="0.4s" fill="freeze"/>
      <animate attributeName="y" values="358;358" dur="0.6s" begin="0.4s" fill="freeze"/>
    </rect>
    <text x="155" y="375" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">1K</text>
    <text x="155" y="355" text-anchor="middle" font-size="8" fill="#E95420" font-weight="600">2.6</text>
  </g>

  <!-- 2K: 5.2GB → height = 4.31px → y = 356 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.7s" fill="freeze"/>
    <rect x="220" y="356" width="70" height="0" rx="4" fill="url(#barGrad)" filter="url(#shadow)">
      <animate attributeName="height" values="0;4.3" dur="0.6s" begin="0.7s" fill="freeze"/>
      <animate attributeName="y" values="356;356" dur="0.6s" begin="0.7s" fill="freeze"/>
    </rect>
    <text x="255" y="375" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">2K</text>
    <text x="255" y="352" text-anchor="middle" font-size="8" fill="#E95420" font-weight="600">5.2</text>
  </g>

  <!-- 4K: 10.4GB → height = 8.62px → y = 351 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.0s" fill="freeze"/>
    <rect x="320" y="351" width="70" height="0" rx="4" fill="url(#barGrad)" filter="url(#shadow)">
      <animate attributeName="height" values="0;8.6" dur="0.6s" begin="1.0s" fill="freeze"/>
      <animate attributeName="y" values="351;351" dur="0.6s" begin="1.0s" fill="freeze"/>
    </rect>
    <text x="355" y="375" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">4K</text>
    <text x="355" y="347" text-anchor="middle" font-size="8" fill="#E95420" font-weight="600">10.4</text>
  </g>

  <!-- 8K: 20.8GB → height = 17.24px → y = 343 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>
    <rect x="420" y="343" width="70" height="0" rx="4" fill="url(#barGrad)" filter="url(#shadow)">
      <animate attributeName="height" values="0;17.2" dur="0.6s" begin="1.3s" fill="freeze"/>
      <animate attributeName="y" values="343;343" dur="0.6s" begin="1.3s" fill="freeze"/>
    </rect>
    <text x="455" y="375" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">8K</text>
    <text x="455" y="339" text-anchor="middle" font-size="8" fill="#E95420" font-weight="600">20.8</text>
  </g>

  <!-- 16K: 41.6GB → height = 34.48px → y = 326 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.6s" fill="freeze"/>
    <rect x="520" y="326" width="70" height="0" rx="4" fill="url(#barGrad)" filter="url(#shadow)">
      <animate attributeName="height" values="0;34.5" dur="0.6s" begin="1.6s" fill="freeze"/>
      <animate attributeName="y" values="326;326" dur="0.6s" begin="1.6s" fill="freeze"/>
    </rect>
    <text x="555" y="375" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">16K</text>
    <text x="555" y="322" text-anchor="middle" font-size="8" fill="#E95420" font-weight="600">41.6</text>
  </g>

  <!-- 32K: 83.2GB → height = 68.94px → y = 291 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.9s" fill="freeze"/>
    <rect x="620" y="291" width="70" height="0" rx="4" fill="url(#barGradWarn)" filter="url(#shadow)">
      <animate attributeName="height" values="0;68.9" dur="0.6s" begin="1.9s" fill="freeze"/>
      <animate attributeName="y" values="291;291" dur="0.6s" begin="1.9s" fill="freeze"/>
    </rect>
    <text x="655" y="375" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">32K</text>
    <text x="655" y="287" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="600">83.2</text>
  </g>

  <!-- 64K: 166GB → height = 137.5px → y = 222 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.2s" fill="freeze"/>
    <rect x="720" y="222" width="70" height="0" rx="4" fill="url(#barGradWarn)" filter="url(#shadow)">
      <animate attributeName="height" values="0;137.5" dur="0.6s" begin="2.2s" fill="freeze"/>
      <animate attributeName="y" values="222;222" dur="0.6s" begin="2.2s" fill="freeze"/>
    </rect>
    <text x="755" y="375" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">64K</text>
    <text x="755" y="218" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="600">166</text>
  </g>

  <!-- 128K: 333GB → height = 275.9px → y = 84 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.5s" fill="freeze"/>
    <rect x="820" y="84" width="70" height="0" rx="4" fill="url(#barGradWarn)" filter="url(#shadow)">
      <animate attributeName="height" values="0;276" dur="0.8s" begin="2.5s" fill="freeze"/>
      <animate attributeName="y" values="84;84" dur="0.8s" begin="2.5s" fill="freeze"/>
    </rect>
    <text x="855" y="375" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">128K</text>
    <text x="855" y="80" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="600">333</text>
  </g>

  <!-- ==================== A100 80GB LIMIT LINE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze"/>
    <!-- 80GB → y = 360 - (80*0.8286) = 360 - 66.3 = 293.7 ≈ 294 -->
    <line x1="100" y1="294" x2="860" y2="294" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,4">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </line>
    <!-- Label box -->
    <rect x="105" y="275" width="120" height="18" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="165" y="288" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">A100 80GB Limit</text>
  </g>

  <!-- ==================== MEMORY FORMULA ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.0s" fill="freeze"/>
    <rect x="560" y="60" width="280" height="42" rx="8" fill="#fff5eb" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="700" y="77" text-anchor="middle" font-size="10" font-weight="600" fill="#C34113">KV Cache Memory Formula:</text>
    <text x="700" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">2 × L × H × d × S × B</text>
  </g>

  <!-- ==================== LEGEND ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.1s" fill="freeze"/>
    <rect x="120" y="62" width="12" height="12" rx="2" fill="url(#barGrad)"/>
    <text x="138" y="72" font-size="9" fill="#64748b">Fits on GPU</text>
    <rect x="210" y="62" width="12" height="12" rx="2" fill="url(#barGradWarn)"/>
    <text x="228" y="72" font-size="9" fill="#64748b">Exceeds A100 80GB</text>
  </g>

  <!-- ==================== X-AXIS LABEL ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/>
    <text x="480" y="400" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Sequence Length (tokens)</text>
  </g>
</svg>
