<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.12);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--text-muted, #64748b)"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
  </defs>

  <rect width="900" height="550" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Context Optimization Workflow</text>
    <text x="450" y="46" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">End-to-end pipeline for preparing and optimizing context for LLM inference</text>
    <line x1="170" y1="55" x2="730" y2="55" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Row 1: Document → Chunk → Embed → Index -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>

    <!-- Document -->
    <rect x="50" y="75" width="120" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="110" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">📄 Document</text>
    <text x="110" y="118" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Raw input text</text>

    <!-- Arrow -->
    <line x1="170" y1="105" x2="200" y2="105" stroke="var(--text-muted, #64748b)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Chunk -->
    <rect x="205" y="75" width="120" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="265" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">✂️ Chunk</text>
    <text x="265" y="118" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">512–2048 tokens</text>

    <!-- Arrow -->
    <line x1="325" y1="105" x2="355" y2="105" stroke="var(--text-muted, #64748b)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Embed -->
    <rect x="360" y="75" width="120" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="420" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">🔢 Embed</text>
    <text x="420" y="118" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">768–4096 dims</text>

    <!-- Arrow -->
    <line x1="480" y1="105" x2="510" y2="105" stroke="var(--text-muted, #64748b)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Index -->
    <rect x="515" y="75" width="120" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="575" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">📇 Index</text>
    <text x="575" y="118" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Vector store</text>
  </g>

  <!-- Row 2: Retrieve → Rerank → Compress → Prompt + LLM -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>

    <!-- Retrieve -->
    <rect x="50" y="180" width="130" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="115" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">🔍 Retrieve</text>
    <text x="115" y="223" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Top-K similarity</text>

    <!-- Arrow -->
    <line x1="180" y1="210" x2="210" y2="210" stroke="var(--text-muted, #64748b)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Rerank -->
    <rect x="215" y="180" width="120" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="275" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">📊 Rerank</text>
    <text x="275" y="223" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Cross-encoder</text>

    <!-- Arrow -->
    <line x1="335" y1="210" x2="365" y2="210" stroke="var(--text-muted, #64748b)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Compress -->
    <rect x="370" y="180" width="120" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="430" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">🗜️ Compress</text>
    <text x="430" y="223" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">LLMLingua / ICAE</text>

    <!-- Arrow -->
    <line x1="490" y1="210" x2="520" y2="210" stroke="var(--text-muted, #64748b)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Prompt Assembly + LLM -->
    <rect x="525" y="180" width="140" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="595" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">🎯 Assemble + LLM</text>
    <text x="595" y="223" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Context → Prompt → Infer</text>
  </g>

  <!-- Down arrow from Row 1 to Row 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.7s" fill="freeze"/>
    <line x1="110" y1="135" x2="110" y2="180" stroke="var(--text-muted, #64748b)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="120" y="162" font-size="8" fill="var(--text-muted, #64748b)">Query</text>
  </g>

  <!-- Token Budget Bar at bottom -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
    <rect x="50" y="270" width="740" height="80" rx="8" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="70" y="292" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">Token Budget Management</text>

    <!-- Visual bar showing token allocation -->
    <rect x="70" y="305" width="700" height="14" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <rect x="72" y="307" width="300" height="10" rx="2" fill="#2563eb" opacity="0.7"/>
    <rect x="374" y="307" width="100" height="10" rx="2" fill="var(--brand-default, #e95420)" opacity="0.7"/>
    <rect x="476" y="307" width="80" height="10" rx="2" fill="#7c3aed" opacity="0.7"/>
    <rect x="558" y="307" width="80" height="10" rx="2" fill="#059669" opacity="0.7"/>
    <rect x="640" y="307" width="128" height="10" rx="2" fill="var(--text-muted, #64748b)" opacity="0.5"/>

    <text x="222" y="334" text-anchor="middle" font-size="8" fill="#2563eb">Retrieved chunks</text>
    <text x="424" y="334" text-anchor="middle" font-size="8" fill="var(--brand-default, #e95420)">System + User</text>
    <text x="516" y="334" text-anchor="middle" font-size="8" fill="#7c3aed">Instructions</text>
    <text x="598" y="334" text-anchor="middle" font-size="8" fill="#059669">Examples</text>
    <text x="704" y="334" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Reserve (10%)</text>
  </g>

  <!-- Right side: Compression Techniques Panel -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
    <rect x="50" y="370" width="740" height="160" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <text x="70" y="394" font-size="12" font-weight="700" fill="var(--brand-default, #e95420)">Context Compression Techniques</text>

    <!-- Technique 1 -->
    <rect x="70" y="408" width="225" height="48" rx="6" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="80" y="426" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">LLMLingua</text>
    <text x="80" y="442" font-size="9" fill="var(--text-muted, #64748b)">Token-level perplexity pruning</text>
    <text x="80" y="454" font-size="9" fill="var(--text-muted, #64748b)">2–5× compression, minimal loss</text>

    <!-- Technique 2 -->
    <rect x="305" y="408" width="225" height="48" rx="6" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="315" y="426" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Selective Context</text>
    <text x="315" y="442" font-size="9" fill="var(--text-muted, #64748b)">Removes irrelevant tokens via</text>
    <text x="315" y="454" font-size="9" fill="var(--text-muted, #64748b)">information-theoretic scoring</text>

    <!-- Technique 3 -->
    <rect x="540" y="408" width="230" height="48" rx="6" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="550" y="426" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">ICAE / AutoCompressor</text>
    <text x="550" y="442" font-size="9" fill="var(--text-muted, #64748b)">Learned soft prompts via</text>
    <text x="550" y="454" font-size="9" fill="var(--text-muted, #64748b)">encoder-decoder compression</text>

    <!-- Bottom note -->
    <text x="70" y="480" font-size="10" fill="var(--text-muted, #64748b)">Rule of thumb: compress before retrieval when documents are long (10K+); compress after retrieval when the prompt exceeds 50% of the context window.</text>
    <text x="70" y="496" font-size="10" fill="#059669" font-weight="600">Goal: fit maximum relevant information within the model's context window without exceeding token limits or budget.</text>
  </g>

  <!-- Chunk Strategy Callout -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/>
    <rect x="680" y="75" width="200" height="95" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <text x="700" y="97" font-size="10" font-weight="600" fill="var(--brand-default, #e95420)">Chunk Strategy</text>
    <text x="700" y="117" font-size="9" fill="var(--text-muted, #64748b)">Semantic: paragraph/section</text>
    <text x="700" y="133" font-size="9" fill="var(--text-muted, #64748b)">  boundaries (preferred)</text>
    <text x="700" y="153" font-size="9" fill="var(--text-muted, #64748b)">Fixed: N tokens with overlap</text>
    <text x="700" y="169" font-size="9" fill="var(--text-muted, #64748b)">  (fallback, may split meaning)</text>
    <line x1="640" y1="120" x2="684" y2="120" stroke="var(--border-default, #e2e8f0)" stroke-width="1" stroke-dasharray="3,2"/>
  </g>
</svg>
