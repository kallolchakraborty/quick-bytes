<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Ubuntu', sans-serif; }
  </style>
  <defs>
    <linearGradient id="decGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e95420"/>
      <stop offset="100%" stop-color="#c34113"/>
    </linearGradient>
    <linearGradient id="genGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="maskClip">
      <rect x="55" y="245" width="790" height="175" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" rx="8" fill="var(--bg-subtle, #f8fafc)" opacity="0.5"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Decoder-Only Architecture (GPT-style)</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="var(--text-muted, #64748b)">Causal Self-Attention — Next-Token Prediction (Autoregressive)</text>

  <!-- Section labels -->
  <rect x="30" y="80" width="180" height="22" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="50" y="95" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">INPUT / PROMPT TOKENS</text>

  <rect x="30" y="245" width="200" height="22" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="50" y="260" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">DECODER STACK (×N Layers)</text>

  <rect x="30" y="475" width="200" height="22" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="50" y="490" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">AUTOREGRESSIVE OUTPUT</text>

  <!-- ==================== INPUT / PROMPT TOKENS ==================== -->
  <g>
    <!-- The -->
    <rect x="95" y="110" width="80" height="62" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="135" y="140" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">The</text>
    <text x="135" y="158" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Prompt</text>

    <!-- cat -->
    <rect x="190" y="110" width="80" height="62" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="230" y="140" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">cat</text>
    <text x="230" y="158" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Prompt</text>

    <!-- sat -->
    <rect x="285" y="110" width="80" height="62" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="325" y="140" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">sat</text>
    <text x="325" y="158" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Prompt</text>

    <!-- on -->  
    <rect x="380" y="110" width="80" height="62" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="420" y="140" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">on</text>
    <text x="420" y="158" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Prompt</text>

    <!-- the -->
    <rect x="475" y="110" width="80" height="62" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="515" y="140" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">the</text>
    <text x="515" y="158" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Prompt</text>

    <!-- mat (current generating) -->
    <rect x="570" y="108" width="80" height="64" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow1)">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#f3e8ff;#e9d5ff;#f3e8ff" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="610" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">mat</text>
    <text x="610" y="158" text-anchor="middle" font-size="9" fill="#7c3aed">Generating...</text>

    <!-- ? (next token) -->
    <rect x="665" y="110" width="80" height="62" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#shadow1)"/>
    <text x="705" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-muted, #64748b)">?</text>
    <text x="705" y="158" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Next</text>
  </g>

  <!-- Down arrows from tokens to decoder stack -->
  <g stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" stroke-linecap="round">
    <line x1="135" y1="172" x2="135" y2="240"/>
    <line x1="230" y1="172" x2="230" y2="240"/>
    <line x1="325" y1="172" x2="325" y2="240"/>
    <line x1="420" y1="172" x2="420" y2="240"/>
    <line x1="515" y1="172" x2="515" y2="240"/>
    <line x1="610" y1="172" x2="610" y2="240"/>
    <line x1="705" y1="172" x2="705" y2="240"/>
  </g>
  <g fill="var(--border-default, #e2e8f0)">
    <polygon points="135,240 131,232 139,232"/>
    <polygon points="230,240 226,232 234,232"/>
    <polygon points="325,240 321,232 329,232"/>
    <polygon points="420,240 416,232 424,232"/>
    <polygon points="515,240 511,232 519,232"/>
    <polygon points="610,240 606,232 614,232"/>
    <polygon points="705,240 701,232 709,232"/>
  </g>

  <!-- ==================== DECODER STACK ==================== -->
  <rect x="55" y="250" width="790" height="170" rx="10" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow1)"/>

  <text x="450" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="var(--brand-default, #e95420)">×N Decoder Layers (e.g. 32, 80, 120)</text>

  <!-- Causal attention mask visualization -->
  <g transform="translate(65, 285)">
    <!-- Grid representing causal mask -->
    <g font-size="8" text-anchor="middle" fill="var(--text-muted, #64748b)">
      <text x="22" y="-5">t₁</text> <text x="52" y="-5">t₂</text> <text x="82" y="-5">t₃</text>
      <text x="112" y="-5">t₄</text> <text x="142" y="-5">t₅</text> <text x="172" y="-5">t₆</text>
      <text x="-8" y="18">t₁</text> <text x="-8" y="48">t₂</text> <text x="-8" y="78">t₃</text>
      <text x="-8" y="108">t₄</text> <text x="-8" y="138">t₅</text>
    </g>
    <!-- Active cells (lower triangular) -->
    <g>
      <rect x="10" y="10" width="20" height="20" rx="3" fill="rgba(233,84,32,0.08)"/><rect x="10" y="40" width="20" height="20" rx="3" fill="rgba(233,84,32,0.08)"/><rect x="40" y="40" width="20" height="20" rx="3" fill="rgba(233,84,32,0.08)"/>
      <rect x="10" y="70" width="20" height="20" rx="3" fill="rgba(233,84,32,0.08)"/><rect x="40" y="70" width="20" height="20" rx="3" fill="rgba(233,84,32,0.08)"/><rect x="70" y="70" width="20" height="20" rx="3" fill="rgba(233,84,32,0.08)"/>
      <rect x="10" y="100" width="20" height="20" rx="3" fill="rgba(233,84,32,0.08)"/><rect x="40" y="100" width="20" height="20" rx="3" fill="rgba(233,84,32,0.08)"/><rect x="70" y="100" width="20" height="20" rx="3" fill="rgba(233,84,32,0.08)"/><rect x="100" y="100" width="20" height="20" rx="3" fill="rgba(233,84,32,0.08)"/>
      <!-- Animated expanding row -->
    </g>
    <!-- Causal diagonal highlight -->
    <rect x="10" y="10" width="20" height="20" rx="3" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1">
      <animate attributeName="y" values="10;40;70;100;10" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- Inactive cells (upper triangular, crossed out) -->
    <g stroke="#ccc" stroke-width="0.8">
      <line x1="42" y1="12" x2="58" y2="28"/><line x1="72" y1="12" x2="88" y2="28"/><line x1="102" y1="12" x2="118" y2="28"/><line x1="132" y1="12" x2="148" y2="28"/>
      <line x1="72" y1="42" x2="88" y2="58"/><line x1="102" y1="42" x2="118" y2="58"/><line x1="132" y1="42" x2="148" y2="58"/>
      <line x1="102" y1="72" x2="118" y2="88"/><line x1="132" y1="72" x2="148" y2="88"/>
      <line x1="132" y1="102" x2="148" y2="118"/>
    </g>
  </g>

  <!-- Causal attention label -->
  <rect x="330" y="345" width="240" height="20" rx="10" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="450" y="359" text-anchor="middle" font-size="10" font-weight="500" fill="var(--brand-default, #e95420)">Causal (Masked) Self-Attention</text>

  <!-- Explanation arrows from mask labels -->
  <text x="280" y="370" font-size="8" fill="var(--text-muted, #64748b)">Each token attends only to itself and previous tokens (lower triangle)</text>

  <!-- KV-cache & generation description -->
  <rect x="560" y="290" width="270" height="46" rx="6" fill="rgba(124,58,237,0.04)" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="575" y="306" font-size="10" font-weight="500" fill="#6d28d9">KV-Cache</text>
  <text x="575" y="320" font-size="9" fill="#7c3aed">Cached key/value tensors from previous tokens</text>
  <text x="575" y="332" font-size="9" fill="#7c3aed">Only compute attention for the newest token</text>

  <!-- Down arrows from decoder to output -->
  <g stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" stroke-linecap="round">
    <line x1="230" y1="420" x2="230" y2="470"/>
    <line x1="420" y1="420" x2="420" y2="470"/>
    <line x1="515" y1="420" x2="515" y2="470"/>
    <line x1="610" y1="420" x2="610" y2="470"/>
  </g>
  <g fill="var(--border-default, #e2e8f0)">
    <polygon points="230,470 226,462 234,462"/>
    <polygon points="420,470 416,462 424,462"/>
    <polygon points="515,470 511,462 519,462"/>
    <polygon points="610,470 606,462 614,462"/>
  </g>

  <!-- ==================== AUTOREGRESSIVE OUTPUT ==================== -->
  <!-- Generated token sequence appearing one by one -->
  <g>
    <rect x="95" y="480" width="80" height="62" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)">
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze"/>
    </rect>
    <text x="135" y="510" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">The</text>
    <text x="135" y="528" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">t=0</text>

    <rect x="190" y="480" width="80" height="62" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8s" fill="freeze"/>
    </rect>
    <text x="230" y="510" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">cat</text>
    <text x="230" y="528" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">t=1</text>

    <rect x="285" y="480" width="80" height="62" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.6s" fill="freeze"/>
    </rect>
    <text x="325" y="510" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">sat</text>
    <text x="325" y="528" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">t=2</text>

    <rect x="380" y="480" width="80" height="62" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.4s" fill="freeze"/>
    </rect>
    <text x="420" y="510" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">on</text>
    <text x="420" y="528" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">t=3</text>

    <rect x="475" y="480" width="80" height="62" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.2s" fill="freeze"/>
    </rect>
    <text x="515" y="510" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">the</text>
    <text x="515" y="528" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">t=4</text>

    <!-- Current prediction -->
    <rect x="570" y="478" width="80" height="64" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow1)">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="4s" fill="freeze"/>
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="1.5s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <text x="610" y="508" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">mat</text>
    <text x="610" y="526" text-anchor="middle" font-size="9" fill="#7c3aed">t=5 (now)</text>

    <!-- End token -->
    <rect x="665" y="480" width="80" height="62" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#shadow1)"/>
    <text x="705" y="510" text-anchor="middle" font-size="10" font-weight="500" fill="var(--text-muted, #64748b)">&lt;EOS&gt;</text>
    <text x="705" y="528" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">t=6</text>
  </g>

  <!-- Feedback arrow: output back to input -->
  <g>
    <path d="M610 544 L610 570 L705 570 L705 172 L705 140" stroke="var(--brand-default, #e95420)" stroke-width="1.5" stroke-dasharray="5 3" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="705,140 699,148 711,148" fill="var(--brand-default, #e95420)"/>
    <text x="660" y="562" font-size="9" fill="var(--brand-default, #e95420)">Feed output as next input</text>
  </g>

  <!-- Training objective -->
  <rect x="250" y="90" width="160" height="20" rx="10" fill="#f3e8ff"/>
  <text x="330" y="104" text-anchor="middle" font-size="10" font-weight="500" fill="#6d28d9">NTP: Predict next token</text>

  <!-- Arrow for loss signal -->
  <g>
    <path d="M610 480 L610 220" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity="0">
      <animate attributeName="opacity" values="0;0;0.5" dur="5s" begin="4s" fill="freeze"/>
    </path>
    <polygon points="610,220 606,228 614,228" fill="#7c3aed" opacity="0">
      <animate attributeName="opacity" values="0;0;0.5" dur="5s" begin="4s" fill="freeze"/>
    </polygon>
  </g>
</svg>