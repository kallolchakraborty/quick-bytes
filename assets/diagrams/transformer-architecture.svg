<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="200">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d9488" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#0D9488"/>
    </marker>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#14B8A6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="1100" fill="none"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0D9488">Transformer Architecture — Data Flow</text>
  <line x1="250" y1="50" x2="650" y2="50" stroke="#14B8A6" stroke-width="1" opacity="0.3"/>

  <!-- ==================== INPUT ==================== -->
  <rect x="325" y="70" width="250" height="44" rx="10" fill="url(#boxGrad)" stroke="#14B8A6" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#0D9488">Input Text</text>

  <!-- Arrow 1 -->
  <line x1="450" y1="114" x2="450" y2="148" stroke="#0D9488" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ==================== TOKENIZATION ==================== -->
  <rect x="325" y="150" width="250" height="44" rx="10" fill="url(#boxGrad)" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Tokenization (BPE)</text>

  <!-- Animated dots flowing through tokenization -->
  <circle r="4" fill="#14B8A6" opacity="0.8">
    <animate attributeName="cx" values="340;560" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="172;172" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#0D9488" opacity="0.6">
    <animate attributeName="cx" values="340;560" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="172;172" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#0D9488" opacity="0.6">
    <animate attributeName="cx" values="340;560" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="172;172" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Sub-label -->
  <text x="450" y="210" text-anchor="middle" font-size="11" fill="#94a3b8">[Token] [izer] [ation] → [Token] [ization] → tokens</text>

  <!-- Arrow 2 -->
  <line x1="450" y1="216" x2="450" y2="248" stroke="#0D9488" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ==================== EMBEDDING ==================== -->
  <rect x="325" y="250" width="250" height="44" rx="10" fill="url(#boxGrad)" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Embedding + Position Encoding</text>

  <!-- Animated tokens becoming vectors -->
  <g opacity="0.5">
    <rect x="330" y="300" width="8" height="20" rx="2" fill="#14B8A6" opacity="0.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="342" y="300" width="8" height="20" rx="2" fill="#14B8A6" opacity="0.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="354" y="300" width="8" height="20" rx="2" fill="#0D9488" opacity="0.4"/>
    <rect x="366" y="300" width="8" height="20" rx="2" fill="#0D9488" opacity="0.3"/>
    <rect x="378" y="300" width="8" height="15" rx="2" fill="#14B8A6" opacity="0.4"/>
  </g>

  <!-- Arrow 3 -->
  <line x1="450" y1="320" x2="450" y2="360" stroke="#0D9488" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ==================== TRANSFORMER BLOCK ==================== -->
  <rect x="200" y="365" width="500" height="490" rx="16" fill="#f0fdfa" stroke="#14B8A6" stroke-width="2" stroke-dasharray="8,4" filter="url(#shadow)"/>
  <text x="450" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#0D9488">Transformer Block × N Layers</text>

  <!-- Layer Norm 1 -->
  <rect x="275" y="405" width="350" height="36" rx="8" fill="url(#boxGrad)" stroke="#94a3b8" stroke-width="1"/>
  <text x="450" y="427" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">RMSNorm</text>

  <!-- Arrow -->
  <line x1="450" y1="441" x2="450" y2="462" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Self-Attention -->
  <rect x="275" y="465" width="350" height="80" rx="10" fill="url(#boxGrad)" stroke="#14B8A6" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="490" text-anchor="middle" font-size="14" font-weight="700" fill="#0D9488">Self-Attention (GQA)</text>

  <!-- Animated attention lines -->
  <g opacity="0.6">
    <line x1="290" y1="510" x2="610" y2="510" stroke="#14B8A6" stroke-width="0.8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="290" y1="520" x2="610" y2="520" stroke="#14B8A6" stroke-width="0.8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="290" y1="530" x2="610" y2="530" stroke="#0D9488" stroke-width="0.8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </line>
  </g>
  <text x="450" y="535" text-anchor="middle" font-size="10" fill="#94a3b8">Q × K^T → Softmax → × V</text>

  <!-- Arrow -->
  <line x1="450" y1="545" x2="450" y2="560" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Residual + -->
  <rect x="275" y="563" width="350" height="26" rx="6" fill="#ccfbf1" stroke="#14B8A6" stroke-width="1"/>
  <text x="450" y="580" text-anchor="middle" font-size="11" font-weight="600" fill="#0D9488">+ Residual Connection</text>

  <!-- Arrow -->
  <line x1="450" y1="589" x2="450" y2="608" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Layer Norm 2 -->
  <rect x="275" y="612" width="350" height="36" rx="8" fill="url(#boxGrad)" stroke="#94a3b8" stroke-width="1"/>
  <text x="450" y="634" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">RMSNorm</text>

  <!-- Arrow -->
  <line x1="450" y1="648" x2="450" y2="668" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- FFN -->
  <rect x="275" y="672" width="350" height="80" rx="10" fill="url(#boxGrad)" stroke="#14B8A6" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="697" text-anchor="middle" font-size="14" font-weight="700" fill="#0D9488">FFN (SwiGLU)</text>

  <!-- Animated FFN activation -->
  <rect x="300" y="710" width="60" height="18" rx="4" fill="#14B8A6" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="370" y="710" width="60" height="18" rx="4" fill="#0D9488" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="440" y="710" width="60" height="18" rx="4" fill="#14B8A6" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="510" y="710" width="60" height="18" rx="4" fill="#0D9488" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="742" text-anchor="middle" font-size="10" fill="#94a3b8">W_2 · SwiGLU(W_1 · x) — inner dim = 4× hidden dim</text>

  <!-- Arrow -->
  <line x1="450" y1="752" x2="450" y2="770" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Residual + -->
  <rect x="275" y="774" width="350" height="26" rx="6" fill="#ccfbf1" stroke="#14B8A6" stroke-width="1"/>
  <text x="450" y="791" text-anchor="middle" font-size="11" font-weight="600" fill="#0D9488">+ Residual Connection</text>

  <!-- Animated looping residual arrow -->
  <path d="M270,550 L160,550 L160,787 L270,787" fill="none" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="145" y="670" text-anchor="middle" font-size="9" fill="#94a3b8" transform="rotate(-90,145,670)">Residual Stream</text>

  <!-- N layers indicator -->
  <text x="715" y="600" text-anchor="middle" font-size="12" fill="#94a3b8">× 32–80+ layers</text>
  <path d="M710,500 L750,500 L750,700 L710,700" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>

  <!-- Arrow from block -->
  <line x1="450" y1="855" x2="450" y2="900" stroke="#0D9488" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ==================== OUTPUT ==================== -->
  <rect x="325" y="905" width="250" height="44" rx="10" fill="url(#boxGrad)" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="931" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Output Projection</text>

  <!-- Arrow -->
  <line x1="450" y1="949" x2="450" y2="978" stroke="#0D9488" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- Softmax -->
  <rect x="325" y="982" width="250" height="44" rx="10" fill="url(#boxGrad)" stroke="#14B8A6" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="1008" text-anchor="middle" font-size="14" font-weight="700" fill="#0D9488">Softmax → Next Token</text>

  <!-- Animated token output -->
  <text x="450" y="1048" text-anchor="middle" font-size="13" fill="#0D9488" font-weight="600">
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
    "Transformer" | "attention" | "model" | "neural"
  </text>

  <!-- Legend -->
  <g transform="translate(50, 960)">
    <rect x="0" y="0" width="800" height="70" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="20" font-size="10" font-weight="600" fill="#94a3b8">LEGEND</text>
    <rect x="20" y="30" width="14" height="14" rx="3" fill="#14B8A6" opacity="0.3"/>
    <text x="40" y="42" font-size="11" fill="#64748b">Animated data flow</text>
    <circle cx="160" cy="37" r="4" fill="#14B8A6"/>
    <text x="170" y="42" font-size="11" fill="#64748b">Token particles</text>
    <rect x="300" y="30" width="14" height="14" rx="3" fill="#ccfbf1" stroke="#14B8A6" stroke-width="1"/>
    <text x="320" y="42" font-size="11" fill="#64748b">Residual connection</text>
    <line x1="460" y1="37" x2="490" y2="37" stroke="#0D9488" stroke-width="2" marker-end="url(#arrowDown)"/>
    <text x="500" y="42" font-size="11" fill="#64748b">Data flow direction</text>
  </g>
</svg>
