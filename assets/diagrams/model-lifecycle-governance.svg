<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Model Lifecycle Governance Pipeline</text>
    <line x1="250" y1="36" x2="650" y2="36" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="54" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Staging promotion with compliance gates at every transition</text>
  </g>

  <!-- Stage 1: Development -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.5s" fill="freeze"/>
    <rect x="20" y="120" width="150" height="120" rx="10" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="20" y="120" width="150" height="32" rx="10" fill="#94a3b8"/>
    <rect x="20" y="144" width="150" height="8" fill="#94a3b8"/>
    <text x="95" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">DEVELOPMENT</text>
    <text x="35" y="173" font-size="9" fill="var(--text-default, #0f172a)">• Train / fine-tune</text>
    <text x="35" y="188" font-size="9" fill="var(--text-default, #0f172a)">• Offline evaluation</text>
    <text x="35" y="203" font-size="9" fill="var(--text-default, #0f172a)">• Internal testing</text>
    <text x="35" y="218" font-size="8" fill="var(--text-muted, #64748b)">Team: ML engineers</text>
  </g>

  <!-- Gate 1: Compliance check -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
    <rect x="180" y="160" width="40" height="40" rx="8" fill="var(--bg-default, #ffffff)" stroke="#e95420" stroke-width="2"/>
    <text x="200" y="185" text-anchor="middle" font-size="18" font-weight="700" fill="#e95420">G1</text>
  </g>

  <!-- Arrow: Dev → Gate 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.7s" fill="freeze"/>
    <line x1="170" y1="180" x2="180" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  </g>

  <!-- Gate 1: Checks -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    <rect x="180" y="210" width="200" height="50" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="280" y="230" text-anchor="middle" font-size="8" font-weight="600" fill="var(--text-default, #0f172a)">G1 Compliance Checks</text>
    <text x="280" y="244" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Bias test  Safety eval  License check</text>
    <text x="280" y="255" text-anchor="middle" font-size="8" fill="#059669" font-weight="600">✓ All passed</text>
  </g>

  <!-- Arrow: Gate 1 → Stage 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
    <line x1="220" y1="180" x2="260" y2="180" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 2: Staging -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.0s" fill="freeze"/>
    <rect x="265" y="120" width="150" height="120" rx="10" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <rect x="265" y="120" width="150" height="32" rx="10" fill="#2563eb"/>
    <rect x="265" y="144" width="150" height="8" fill="#2563eb"/>
    <text x="340" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">STAGING</text>
    <text x="280" y="173" font-size="9" fill="var(--text-default, #0f172a)">• Shadow deployment</text>
    <text x="280" y="188" font-size="9" fill="var(--text-default, #0f172a)">• Offline vs online comp</text>
    <text x="280" y="203" font-size="9" fill="var(--text-default, #0f172a)">• Regression testing</text>
    <text x="280" y="218" font-size="8" fill="var(--text-muted, #64748b)">Team: ML + QA</text>
  </g>

  <!-- Gate 2: Performance gate -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <rect x="425" y="160" width="40" height="40" rx="8" fill="var(--bg-default, #ffffff)" stroke="#e95420" stroke-width="2"/>
    <text x="445" y="185" text-anchor="middle" font-size="18" font-weight="700" fill="#e95420">G2</text>
  </g>

  <!-- Arrow: Stage 2 → Gate 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.15s" fill="freeze"/>
    <line x1="415" y1="180" x2="425" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  </g>

  <!-- Gate 2: Checks -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
    <rect x="425" y="210" width="200" height="50" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="525" y="230" text-anchor="middle" font-size="8" font-weight="600" fill="var(--text-default, #0f172a)">G2 Performance Gate</text>
    <text x="525" y="244" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Latency &lt; 200ms  Accuracy ≥ baseline</text>
    <text x="525" y="255" text-anchor="middle" font-size="8" fill="#059669" font-weight="600">✓ All passed</text>
  </g>

  <!-- Arrow: Gate 2 → Stage 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.25s" fill="freeze"/>
    <line x1="465" y1="180" x2="505" y2="180" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 3: Canary -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.3s" fill="freeze"/>
    <rect x="510" y="120" width="160" height="120" rx="10" fill="var(--bg-default, #ffffff)" stroke="#e95420" stroke-width="2" filter="url(#shadow)"/>
    <rect x="510" y="120" width="160" height="32" rx="10" fill="#e95420"/>
    <rect x="510" y="144" width="160" height="8" fill="#e95420"/>
    <text x="590" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">CANARY</text>
    <text x="525" y="173" font-size="9" fill="var(--text-default, #0f172a)">• 1% → 5% → 20% traffic</text>
    <text x="525" y="188" font-size="9" fill="var(--text-default, #0f172a)">• Statistical comparison</text>
    <text x="525" y="203" font-size="9" fill="var(--text-default, #0f172a)">• Auto-rollback on regression</text>
    <text x="525" y="218" font-size="8" fill="var(--text-muted, #64748b)">Duration: 24–72 hours</text>
  </g>

  <!-- Gate 3: Sign-off -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
    <rect x="680" y="160" width="40" height="40" rx="8" fill="var(--bg-default, #ffffff)" stroke="#e95420" stroke-width="2"/>
    <text x="700" y="185" text-anchor="middle" font-size="18" font-weight="700" fill="#e95420">G3</text>
  </g>

  <!-- Arrow: Stage 3 → Gate 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.45s" fill="freeze"/>
    <line x1="670" y1="180" x2="680" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  </g>

  <!-- Gate 3: Checks -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    <rect x="680" y="210" width="200" height="50" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="780" y="230" text-anchor="middle" font-size="8" font-weight="600" fill="var(--text-default, #0f172a)">G3 Sign-off Gate</text>
    <text x="780" y="244" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Metrics OK  No regressions  Approver</text>
    <text x="780" y="255" text-anchor="middle" font-size="8" fill="#059669" font-weight="600">✓ Approved</text>
  </g>

  <!-- Arrow: Gate 3 → Stage 4 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.55s" fill="freeze"/>
    <line x1="720" y1="180" x2="750" y2="180" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 4: Production -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.6s" fill="freeze"/>
    <rect x="755" y="120" width="130" height="120" rx="10" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="3" filter="url(#shadow)"/>
    <rect x="755" y="120" width="130" height="32" rx="10" fill="#059669"/>
    <rect x="755" y="144" width="130" height="8" fill="#059669"/>
    <text x="820" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">PRODUCTION</text>
    <text x="770" y="173" font-size="9" fill="var(--text-default, #0f172a)">• 100% traffic</text>
    <text x="770" y="188" font-size="9" fill="var(--text-default, #0f172a)">• Real-time monitoring</text>
    <text x="770" y="203" font-size="9" fill="var(--text-default, #0f172a)">• Continuous eval</text>
    <text x="770" y="218" font-size="8" fill="var(--text-muted, #64748b)">SLA: 99.9% uptime</text>
  </g>

  <!-- Rollback arrow -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.7s" fill="freeze"/>
    <path d="M 750 290 L 590 290 L 590 240" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.6s" repeatCount="indefinite"/>
    </path>
    <rect x="610" y="280" width="100" height="18" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="0.5"/>
    <text x="660" y="293" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="600">auto-rollback</text>
  </g>

  <!-- Model Registry (bottom bar) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    <line x1="20" y1="340" x2="880" y2="340" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <rect x="20" y="355" width="860" height="30" rx="8" fill="var(--brand-light, rgba(233,84,32,0.06))" stroke="var(--brand-medium, rgba(233,84,32,0.15))" stroke-width="1"/>
    <text x="450" y="375" text-anchor="middle" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">MODEL REGISTRY — Source of Truth</text>
  </g>

  <!-- Registry fields -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.9s" fill="freeze"/>
    <rect x="20" y="395" width="200" height="24" rx="4" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="120" y="411" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Version: v2.3.1-rc4</text>
    <rect x="235" y="395" width="200" height="24" rx="4" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="335" y="411" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Status: Canary</text>
    <rect x="450" y="395" width="200" height="24" rx="4" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="550" y="411" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Accuracy: 94.2%</text>
    <rect x="665" y="395" width="200" height="24" rx="4" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="765" y="411" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Approver: staff-ml</text>
  </g>

  <!-- Audit trail -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.0s" fill="freeze"/>
    <rect x="20" y="430" width="860" height="40" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="30" y="448" font-size="9" font-weight="600" fill="var(--text-default, #0f172a)">Audit Trail:</text>
    <text x="30" y="462" font-size="8" fill="var(--text-muted, #64748b)">2026-07-08 14:32 — v2.3.1-rc4 promoted to Canary by agent-orch-system  |  2026-07-07 09:15 — Compliance G1 passed  |  2026-07-06 16:00 — Model uploaded to registry</text>
  </g>

  <!-- Legend -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.1s" fill="freeze"/>
    <line x1="20" y1="495" x2="880" y2="495" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="515" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text-default, #0f172a)">Key Principles</text>

    <rect x="100" y="530" width="200" height="24" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="200" y="546" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">No manual promotion to production</text>
    <rect x="350" y="530" width="200" height="24" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="450" y="546" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Every transition is logged</text>
    <rect x="600" y="530" width="200" height="24" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="700" y="546" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Rollback is faster than fix-forward</text>
  </g>
</svg>