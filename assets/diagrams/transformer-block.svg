<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowDn" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#E95420"/>
    </marker>
  </defs>

  <rect width="900" height="650" fill="none"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#C34113">Full Transformer Decoder Block</text>
  <line x1="240" y1="40" x2="660" y2="40" stroke="#E95420" stroke-width="1" opacity="0.3"/>

  <!-- ==================== FLOW ANNOTATION (RIGHT SIDE) ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <text x="680" y="68" font-size="11" font-weight="600" fill="#475569">Flow (per token)</text>
    <rect x="680" y="78" width="170" height="26" rx="4" fill="#fde8dc"/>
    <text x="765" y="95" text-anchor="middle" font-size="9" fill="#c34113">1 decoder layer</text>
  </g>

  <!-- ==================== COMPUTATION BLOCKS (CENTER) ==================== -->

  <!-- Input -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    <rect x="330" y="70" width="200" height="36" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="430" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#C34113">Input (d)</text>
  </g>

  <line x1="430" y1="106" x2="430" y2="126" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowDn)">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1s" fill="freeze"/>
  </line>

  <!-- RMSNorm 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
    <rect x="360" y="130" width="140" height="36" rx="18" fill="#fff" stroke="#f0883e" stroke-width="1.5" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="2s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="430" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#c34113">RMSNorm</text>
  </g>

  <line x1="430" y1="166" x2="430" y2="186" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowDn)">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.6s" fill="freeze"/>
  </line>

  <!-- Self-Attention (GQA) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    <rect x="310" y="190" width="240" height="60" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="2;3;2" dur="2s" begin="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="430" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#C34113">Self-Attention (GQA)</text>
    <text x="430" y="235" text-anchor="middle" font-size="9" fill="#94a3b8">Grouped-Query Attention</text>
  </g>

  <!-- Residual + arrow -->
  <line x1="430" y1="250" x2="430" y2="270" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowDn)">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.2s" fill="freeze"/>
  </line>

  <!-- Residual Add 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.4s" fill="freeze"/>
    <rect x="370" y="274" width="120" height="30" rx="15" fill="#fff5eb" stroke="#E95420" stroke-width="1.5"/>
    <text x="430" y="293" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">+ Residual</text>
  </g>

  <line x1="430" y1="304" x2="430" y2="324" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowDn)">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.8s" fill="freeze"/>
  </line>

  <!-- RMSNorm 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3s" fill="freeze"/>
    <rect x="360" y="328" width="140" height="36" rx="18" fill="#fff" stroke="#f0883e" stroke-width="1.5" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="2s" begin="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="430" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#c34113">RMSNorm</text>
  </g>

  <line x1="430" y1="364" x2="430" y2="384" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowDn)">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.4s" fill="freeze"/>
  </line>

  <!-- FFN (SwiGLU) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.6s" fill="freeze"/>
    <rect x="310" y="388" width="240" height="60" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="2;3;2" dur="2s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <text x="430" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#C34113">FFN (SwiGLU)</text>
    <text x="430" y="433" text-anchor="middle" font-size="9" fill="#94a3b8">d → 4d → d</text>
  </g>

  <line x1="430" y1="448" x2="430" y2="468" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowDn)">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4s" fill="freeze"/>
  </line>

  <!-- Residual Add 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.2s" fill="freeze"/>
    <rect x="370" y="472" width="120" height="30" rx="15" fill="#fff5eb" stroke="#E95420" stroke-width="1.5"/>
    <text x="430" y="491" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">+ Residual</text>
  </g>

  <line x1="430" y1="502" x2="430" y2="522" stroke="#C34113" stroke-width="2" marker-end="url(#arrowDn)">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.6s" fill="freeze"/>
  </line>

  <!-- Output -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.8s" fill="freeze"/>
    <rect x="330" y="526" width="200" height="36" rx="8" fill="#E95420" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" begin="5.2s" repeatCount="indefinite"/>
    </rect>
    <text x="430" y="548" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Output (d)</text>
  </g>

  <!-- ==================== RESIDUAL SKIP PATHS ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2s" fill="freeze"/>
    <!-- Skip from Input to first Residual Add -->
    <line x1="300" y1="88" x2="265" y2="88" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="265" y1="88" x2="265" y2="289" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="265" y1="289" x2="370" y2="289" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrowDn)" stroke-dasharray="4,3"/>
    <text x="253" y="195" text-anchor="end" font-size="8" fill="#f0883e" transform="rotate(-90,253,195)">skip 1</text>

    <!-- Skip from first Residual Add to second -->
    <line x1="300" y1="289" x2="285" y2="289" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="285" y1="289" x2="285" y2="487" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="285" y1="487" x2="370" y2="487" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrowDn)" stroke-dasharray="4,3"/>
    <text x="273" y="395" text-anchor="end" font-size="8" fill="#f0883e" transform="rotate(-90,273,395)">skip 2</text>
  </g>

  <!-- ==================== FLOW PARTICLE ==================== -->
  <circle r="3" fill="#E95420" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0;0;0;0;0;0" dur="6s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="88;88;148;148;220;220;289;289;346;346;418;418;487;487;544;544" dur="6s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="430;430;430;430;430;430;430;430;430;430;430;430;430;430;430;430" dur="6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ==================== RIGHT ANNOTATIONS ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="5s" fill="freeze"/>

    <rect x="610" y="128" width="240" height="40" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="730" y="145" text-anchor="middle" font-size="9" fill="#475569">Pre-LN: Normalize before each sublayer</text>
    <text x="730" y="160" text-anchor="middle" font-size="8" fill="#94a3b8">More stable training dynamics</text>

    <rect x="610" y="200" width="240" height="55" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="730" y="218" text-anchor="middle" font-size="9" fill="#475569">Causal Masking</text>
    <text x="730" y="233" text-anchor="middle" font-size="8" fill="#94a3b8">Each token attends only to</text>
    <text x="730" y="248" text-anchor="middle" font-size="8" fill="#94a3b8">itself + previous tokens</text>

    <rect x="610" y="390" width="240" height="40" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="730" y="407" text-anchor="middle" font-size="9" fill="#475569">N layers stacked (32–128+)</text>
    <text x="730" y="422" text-anchor="middle" font-size="8" fill="#94a3b8">Output of layer N = input of layer N+1</text>

    <!-- Depth indicator -->
    <rect x="610" y="480" width="240" height="40" rx="6" fill="#fde8dc"/>
    <text x="730" y="497" text-anchor="middle" font-size="9" font-weight="600" fill="#c34113">x → RMSNorm → Attn → + → RMSNorm → FFN → +</text>
    <text x="730" y="512" text-anchor="middle" font-size="8" fill="#c34113">Repeated for every decoder layer</text>
  </g>
</svg>
