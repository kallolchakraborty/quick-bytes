<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E95420"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#E95420"/>
    </marker>
  </defs>

  <rect width="900" height="700" fill="none"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#C34113">Feed-Forward Network (FFN)</text>
  <line x1="280" y1="40" x2="620" y2="40" stroke="#E95420" stroke-width="1" opacity="0.3"/>

  <!-- ==================== SECTION 1: FFN COMPUTATION FLOW ==================== -->
  <rect x="50" y="58" width="800" height="26" rx="4" fill="#fde8dc">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="60" y="75" font-size="12" font-weight="700" fill="#C34113">FFN Block: d → 4d → d</text>
  <text x="750" y="75" font-size="10" fill="#64748b">inner dim = 4 × model dim</text>

  <!-- Input -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    <rect x="60" y="115" width="100" height="44" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)"/>
    <text x="110" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#C34113">x</text>
    <text x="110" y="150" text-anchor="middle" font-size="9" fill="#94a3b8">dim = d</text>
    <!-- Dim bar -->
    <rect x="60" y="167" width="80" height="6" rx="3" fill="url(#barGrad)" opacity="0.6"/>
    <text x="110" y="184" text-anchor="middle" font-size="8" fill="#94a3b8">d</text>
  </g>

  <!-- Arrow input → W1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1s" fill="freeze"/>
    <line x1="160" y1="137" x2="205" y2="137" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- W1: up-projection -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
    <rect x="210" y="100" width="120" height="74" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="2;3;2" dur="1.5s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="270" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#C34113">W₁</text>
    <text x="270" y="141" text-anchor="middle" font-size="10" fill="#475569">Up-Project</text>
    <text x="270" y="155" text-anchor="middle" font-size="9" fill="#94a3b8">d → 4d</text>
    <!-- Dim bar wider -->
    <rect x="210" y="182" width="120" height="8" rx="4" fill="url(#barGrad)" opacity="0.8"/>
    <text x="270" y="201" text-anchor="middle" font-size="8" fill="#c34113" font-weight="600">4d</text>
  </g>

  <!-- Arrow W1 → Activation -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>
    <line x1="330" y1="137" x2="375" y2="137" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Activation -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2s" fill="freeze"/>
    <rect x="380" y="108" width="100" height="54" rx="20" fill="url(#boxGrad)" stroke="#C34113" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="430" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#C34113">σ</text>
    <text x="430" y="150" text-anchor="middle" font-size="9" fill="#475569">Non-linearity</text>
  </g>

  <!-- Arrow Activation → W2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.6s" fill="freeze"/>
    <line x1="480" y1="137" x2="525" y2="137" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- W2: down-projection -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze"/>
    <rect x="530" y="100" width="120" height="74" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="2;3;2" dur="1.5s" begin="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="590" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#C34113">W₂</text>
    <text x="590" y="141" text-anchor="middle" font-size="10" fill="#475569">Down-Project</text>
    <text x="590" y="155" text-anchor="middle" font-size="9" fill="#94a3b8">4d → d</text>
    <!-- Dim bar narrow -->
    <rect x="570" y="182" width="40" height="6" rx="3" fill="url(#barGrad)" opacity="0.6"/>
    <text x="590" y="201" text-anchor="middle" font-size="8" fill="#94a3b8">d</text>
  </g>

  <!-- Arrow W2 → Output -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.4s" fill="freeze"/>
    <line x1="650" y1="137" x2="695" y2="137" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Output -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.6s" fill="freeze"/>
    <rect x="700" y="115" width="100" height="44" rx="8" fill="#E95420" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <text x="750" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">FFN(x)</text>
    <text x="750" y="150" text-anchor="middle" font-size="9" fill="#fde8dc">output</text>
  </g>

  <!-- Flow particle -->
  <circle r="3" fill="#E95420" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0;0;0;0" dur="4.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="110;110;270;270;430;430;590;590;750;750" dur="4.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="137;137;137;137;137;137;137;137;137;137" dur="4.5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Formula -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="4.5s" fill="freeze"/>
    <rect x="200" y="220" width="500" height="28" rx="6" fill="#fff5eb" stroke="#E95420" stroke-width="1"/>
    <text x="450" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#C34113">FFN(x) = W₂ · σ(W₁ · x + b₁) + b₂</text>
  </g>

  <!-- ==================== SECTION DIVIDER ==================== -->
  <line x1="50" y1="275" x2="850" y2="275" stroke="#E95420" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0;0.15" dur="0.3s" begin="5s" fill="freeze"/>
  </line>

  <!-- ==================== SECTION 2: ACTIVATION FUNCTIONS ==================== -->
  <rect x="50" y="290" width="280" height="26" rx="4" fill="#fde8dc">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="5.2s" fill="freeze"/>
  </rect>
  <text x="60" y="307" font-size="12" font-weight="700" fill="#C34113">Activation Functions</text>

  <!-- ==================== ReLU CARD ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="5.5s" fill="freeze"/>
    <rect x="50" y="330" width="250" height="330" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>

    <text x="175" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#C34113">ReLU</text>
    <text x="175" y="370" text-anchor="middle" font-size="9" fill="#64748b">Rectified Linear Unit</text>

    <!-- ReLU Graph -->
    <rect x="75" y="385" width="200" height="120" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Axes -->
    <line x1="75" y1="445" x2="275" y2="445" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="175" y1="385" x2="175" y2="505" stroke="#94a3b8" stroke-width="0.5"/>
    <!-- Axis labels -->
    <text x="168" y="498" text-anchor="middle" font-size="8" fill="#94a3b8">0</text>
    <text x="265" y="453" font-size="8" fill="#94a3b8">x</text>
    <text x="179" y="390" font-size="8" fill="#94a3b8">y</text>

    <!-- ReLU curve -->
    <path d="M 175,445 L 245,385" fill="none" stroke="#E95420" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="0.6s" begin="5.7s" fill="freeze"/>
    </path>
    <!-- Flat part -->
    <line x1="105" y1="445" x2="175" y2="445" stroke="#E95420" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Origin dot -->
    <circle cx="175" cy="445" r="3" fill="#E95420" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="6.3s" fill="freeze"/>
    </circle>

    <!-- Details -->
    <rect x="75" y="520" width="200" height="55" rx="6" fill="#fde8dc" opacity="0.5"/>
    <text x="175" y="537" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Formula</text>
    <text x="175" y="553" text-anchor="middle" font-size="10" fill="#C34113">ReLU(x) = max(0, x)</text>
    <text x="175" y="568" text-anchor="middle" font-size="9" fill="#64748b">Used by: GPT-1, GPT-2</text>

    <!-- Property badges -->
    <rect x="85" y="590" width="60" height="20" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="115" y="604" text-anchor="middle" font-size="8" fill="#c34113">Simple</text>
    <rect x="155" y="590" width="60" height="20" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="185" y="604" text-anchor="middle" font-size="8" fill="#c34113">Fast</text>
    <rect x="225" y="590" width="60" height="20" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="255" y="604" text-anchor="middle" font-size="8" fill="#c34113">Sparse</text>
  </g>

  <!-- ==================== GELU CARD ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="5.8s" fill="freeze"/>
    <rect x="325" y="330" width="250" height="330" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>

    <text x="450" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#C34113">GELU</text>
    <text x="450" y="370" text-anchor="middle" font-size="9" fill="#64748b">Gaussian Error Linear Unit</text>

    <!-- GELU Graph -->
    <rect x="350" y="385" width="200" height="120" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="350" y1="445" x2="550" y2="445" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="450" y1="385" x2="450" y2="505" stroke="#94a3b8" stroke-width="0.5"/>
    <text x="443" y="498" text-anchor="middle" font-size="8" fill="#94a3b8">0</text>
    <text x="540" y="453" font-size="8" fill="#94a3b8">x</text>
    <text x="454" y="390" font-size="8" fill="#94a3b8">y</text>

    <!-- GELU curve (smooth S-curve through origin) -->
    <path d="M 370,443 Q 440,445 450,445 Q 460,445 530,385" fill="none" stroke="#E95420" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="180" stroke-dashoffset="180">
      <animate attributeName="stroke-dashoffset" values="180;0" dur="0.8s" begin="6s" fill="freeze"/>
    </path>

    <circle cx="450" cy="445" r="3" fill="#E95420" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="6.8s" fill="freeze"/>
    </circle>

    <rect x="350" y="520" width="200" height="55" rx="6" fill="#fde8dc" opacity="0.5"/>
    <text x="450" y="537" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Formula</text>
    <text x="450" y="553" text-anchor="middle" font-size="10" fill="#C34113">GELU(x) = x · Φ(x)</text>
    <text x="450" y="568" text-anchor="middle" font-size="9" fill="#64748b">Used by: BERT, GPT-3</text>

    <rect x="360" y="590" width="60" height="20" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="390" y="604" text-anchor="middle" font-size="8" fill="#c34113">Smooth</text>
    <rect x="430" y="590" width="60" height="20" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="460" y="604" text-anchor="middle" font-size="8" fill="#c34113">Zero-Centered</text>
    <rect x="500" y="590" width="60" height="20" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="530" y="604" text-anchor="middle" font-size="8" fill="#c34113">SOTA</text>
  </g>

  <!-- ==================== SwiGLU CARD ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="6.1s" fill="freeze"/>
    <rect x="600" y="330" width="250" height="330" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>

    <text x="725" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#C34113">SwiGLU</text>
    <text x="725" y="370" text-anchor="middle" font-size="9" fill="#64748b">Swish-Gated Linear Unit</text>

    <!-- SwiGLU Schematic -->
    <rect x="640" y="385" width="170" height="120" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Gate structure -->
    <text x="660" y="405" font-size="9" fill="#475569">x</text>
    <line x1="675" y1="400" x2="720" y2="415" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="675" y1="400" x2="720" y2="445" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="720" y="405" width="55" height="22" rx="4" fill="#E95420" opacity="0.15"/>
    <text x="747" y="420" text-anchor="middle" font-size="9" font-weight="600" fill="#c34113">W₁</text>

    <rect x="720" y="435" width="55" height="22" rx="4" fill="#f0883e" opacity="0.15"/>
    <text x="747" y="450" text-anchor="middle" font-size="9" font-weight="600" fill="#c34113">W₃</text>

    <rect x="785" y="420" width="22" height="22" rx="4" fill="#E95420" opacity="0.2"/>
    <text x="796" y="435" text-anchor="middle" font-size="10" font-weight="700" fill="#c34113">⊙</text>

    <line x1="807" y1="431" x2="795" y2="455" stroke="#E95420" stroke-width="1.5"/>
    <rect x="640" y="455" width="30" height="16" rx="3" fill="#f0883e" opacity="0.2"/>
    <text x="655" y="467" text-anchor="middle" font-size="8" font-weight="600" fill="#c34113">SiLU</text>
    <line x1="660" y1="463" x2="720" y2="447" stroke="#f0883e" stroke-width="1"/>

    <!-- Output arrow -->
    <line x1="807" y1="431" x2="795" y2="480" stroke="#E95420" stroke-width="1.5"/>
    <rect x="720" y="480" width="55" height="22" rx="4" fill="#E95420" opacity="0.15"/>
    <text x="747" y="495" text-anchor="middle" font-size="9" font-weight="600" fill="#c34113">W₂</text>

    <text x="660" y="515" font-size="9" fill="#475569">FFN(x)</text>

    <!-- Animated activation path -->
    <circle r="2.5" fill="#E95420" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="6.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="675;675;747;747;796;796;747;747;660" dur="3s" begin="6.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="400;400;416;416;431;431;491;491;520" dur="3s" begin="6.5s" repeatCount="indefinite"/>
    </circle>

    <rect x="625" y="520" width="200" height="55" rx="6" fill="#fde8dc" opacity="0.5"/>
    <text x="725" y="537" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Formula</text>
    <text x="725" y="553" text-anchor="middle" font-size="9" fill="#C34113">(x·W₁) ⊙ SiLU(x·W₃) · W₂</text>
    <text x="725" y="568" text-anchor="middle" font-size="9" fill="#64748b">Used by: LLaMA, Mistral, PaLM</text>

    <rect x="635" y="590" width="70" height="20" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="670" y="604" text-anchor="middle" font-size="8" fill="#c34113">Gated</text>
    <rect x="715" y="590" width="70" height="20" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="750" y="604" text-anchor="middle" font-size="8" fill="#c34113">3 Matrices</text>
    <rect x="795" y="590" width="42" height="20" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="816" y="604" text-anchor="middle" font-size="8" fill="#c34113">Best</text>
  </g>
</svg>
