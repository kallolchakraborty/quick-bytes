<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#059669"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#2563eb"/>
    </marker>
    <linearGradient id="embedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e95420"/>
      <stop offset="100%" stop-color="#c34113"/>
    </linearGradient>
  </defs>

  <rect width="900" height="550" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Semantic Search Pipeline</text>
    <line x1="290" y1="34" x2="610" y2="34" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="50" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Find documents by meaning — not keyword overlap</text>
  </g>

  <!-- ==================== INDEXING SIDE (top-left) ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.5s" fill="freeze"/>
    <rect x="15" y="65" width="240" height="28" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="135" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-default, #e95420)">INDEXING PIPELINE (Offline)</text>
  </g>

  <!-- Document Chunks -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
    <rect x="15" y="100" width="240" height="80" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="15" y="100" width="240" height="26" rx="8" fill="#94a3b8"/>
    <rect x="15" y="118" width="240" height="8" fill="#94a3b8"/>
    <text x="135" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Document Chunks</text>
    <text x="25" y="142" font-size="9" fill="var(--text-muted, #64748b)">Chunk 1: "Attention is all you need..."</text>
    <text x="25" y="158" font-size="9" fill="var(--text-muted, #64748b)">Chunk 2: "The model uses multi-head..."</text>
    <text x="25" y="174" font-size="9" fill="var(--text-muted, #64748b)">Chunk N: "[more text...]"</text>

    <!-- Arrow -->
    <line x1="255" y1="140" x2="285" y2="140" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Embedding Model -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.7s" fill="freeze"/>
    <rect x="290" y="100" width="160" height="80" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="370" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-default, #e95420)">Embedding Model</text>
    <text x="370" y="143" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">text-embedding-3-small</text>
    <text x="370" y="159" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">BGE-large, E5-mistral</text>
    <text x="370" y="175" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">768-4096 dimensions</text>

    <!-- Arrow -->
    <line x1="450" y1="140" x2="480" y2="140" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Vector Store -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    <rect x="485" y="95" width="200" height="90" rx="10" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="485" y="95" width="200" height="28" rx="10" fill="#2563eb"/>
    <rect x="485" y="115" width="200" height="8" fill="#2563eb"/>
    <text x="585" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Vector Database</text>

    <!-- Vector list -->
    <text x="495" y="138" font-size="9" fill="var(--text-default, #0f172a)">[0.23, 0.89, 0.12, ...] → doc_1</text>
    <text x="495" y="154" font-size="9" fill="var(--text-default, #0f172a)">[0.91, 0.34, 0.67, ...] → doc_2</text>
    <text x="495" y="170" font-size="9" fill="var(--text-default, #0f172a)">[0.45, 0.02, 0.78, ...] → doc_N</text>

    <!-- Index type label -->
    <rect x="495" y="178" width="100" height="14" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="545" y="188" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">ANN Index (HNSW)</text>
  </g>

  <!-- ==================== QUERY SIDE (bottom) ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.0s" fill="freeze"/>
    <line x1="15" y1="200" x2="885" y2="200" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <rect x="15" y="212" width="200" height="28" rx="6" fill="rgba(5,150,105,0.08)"/>
    <text x="115" y="231" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">QUERY PIPELINE (Online)</text>
  </g>

  <!-- User Query -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <rect x="15" y="248" width="180" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <text x="105" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-default, #0f172a)">User Query</text>
    <text x="105" y="290" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">"Explain attention"</text>

    <!-- Arrow -->
    <line x1="195" y1="278" x2="225" y2="278" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Query Embed -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
    <rect x="230" y="248" width="140" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="1.5" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="300" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">Embed Query</text>
    <text x="300" y="290" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Same model as indexing</text>

    <!-- Arrow -->
    <line x1="370" y1="278" x2="400" y2="278" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Similarity Search -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>
    <rect x="405" y="248" width="170" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="490" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">ANN Search</text>
    <text x="490" y="286" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Cosine similarity</text>
    <text x="490" y="301" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Search ANN index</text>

    <!-- Arrow -->
    <line x1="575" y1="278" x2="605" y2="278" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Top-K Results -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
    <rect x="610" y="248" width="140" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <text x="680" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-default, #0f172a)">Top-K Results</text>
    <text x="680" y="290" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">3-20 nearest chunks</text>

    <!-- Arrow -->
    <line x1="750" y1="278" x2="780" y2="278" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Re-ranker -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    <rect x="785" y="240" width="100" height="76" rx="8" fill="var(--brand-light, rgba(233,84,32,0.06))" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="835" y="260" text-anchor="middle" font-size="9" font-weight="700" fill="var(--brand-default, #e95420)">Re-ranker</text>
    <text x="835" y="278" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Cross-encoder</text>
    <text x="835" y="294" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">(optional)</text>
    <text x="835" y="310" text-anchor="middle" font-size="8" fill="#059669" font-weight="600">Higher precision</text>
  </g>

  <!-- ==================== CONTEXT ASSEMBLY ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
    <line x1="15" y1="328" x2="885" y2="328" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <!-- Retrieved context -->
    <rect x="100" y="342" width="300" height="65" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="100" y="342" width="300" height="24" rx="8" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <rect x="100" y="358" width="300" height="8" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="250" y="359" text-anchor="middle" font-size="10" font-weight="600" fill="var(--brand-default, #e95420)">Assembled Context + Prompt</text>
    <text x="110" y="380" font-size="9" fill="var(--text-muted, #64748b)">System: You are a helpful assistant.</text>
    <text x="110" y="396" font-size="9" fill="var(--text-muted, #64748b)">Context: [retrieved chunks] — Query: Explain attention</text>

    <!-- Arrow -->
    <line x1="400" y1="375" x2="440" y2="375" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- LLM -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
    <rect x="445" y="345" width="150" height="55" rx="12" fill="url(#embedGrad)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.5s" begin="1.7s" repeatCount="indefinite"/>
    </rect>
    <text x="520" y="369" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">LLM</text>
    <text x="520" y="387" text-anchor="middle" font-size="8" fill="#fde8dc">Generates answer with context</text>

    <!-- Arrow -->
    <line x1="595" y1="373" x2="635" y2="373" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Final Answer -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    <rect x="640" y="342" width="240" height="65" rx="8" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <text x="760" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">Grounded Answer</text>
    <text x="650" y="384" font-size="9" fill="var(--text-muted, #64748b)">"Attention is a mechanism that weighs the</text>
    <text x="650" y="400" font-size="9" fill="var(--text-muted, #64748b)">importance of different parts of input..."</text>
  </g>

  <!-- Key metrics bar -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.0s" fill="freeze"/>
    <rect x="15" y="430" width="870" height="50" rx="8" fill="var(--brand-light, rgba(233,84,32,0.06))" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>

    <text x="100" y="450" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Recall@k</text>
    <text x="100" y="468" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">95%+</text>

    <line x1="180" y1="438" x2="180" y2="472" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>

    <text x="275" y="450" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Precision@k</text>
    <text x="275" y="468" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">90%+</text>

    <line x1="360" y1="438" x2="360" y2="472" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>

    <text x="450" y="450" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Latency</text>
    <text x="450" y="468" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">&lt;50ms</text>

    <line x1="540" y1="438" x2="540" y2="472" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>

    <text x="650" y="450" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Embedding Dimensions</text>
    <text x="650" y="468" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">768-4096</text>

    <line x1="735" y1="438" x2="735" y2="472" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>

    <text x="820" y="450" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">ANN Index</text>
    <text x="820" y="468" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">HNSW</text>
  </g>

  <!-- FAANG rule -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.2s" fill="freeze"/>
    <text x="450" y="518" text-anchor="middle" font-size="10" fill="var(--text-default, #0f172a)">Staff+ rule: The embedding model determines the ceiling of your retrieval quality. Evaluate end-to-end (recall@k, precision@k).</text>
    <text x="450" y="536" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Hybrid search (dense + sparse BM25) is the standard approach in production.</text>
  </g>
</svg>
