<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#059669"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="900" height="650" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">The Agentic Loop — ReAct Pattern</text>
    <line x1="270" y1="36" x2="630" y2="36" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="54" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Reasoning + Acting — the fundamental agent architecture</text>
  </g>

  <!-- ==================== CENTER: LLM ENGINE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <rect x="320" y="275" width="260" height="100" rx="16" fill="var(--brand-default, #e95420)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">LLM</text>
    <text x="450" y="330" text-anchor="middle" font-size="11" fill="#fde8dc">Large Language Model</text>
    <text x="450" y="348" text-anchor="middle" font-size="10" fill="#fde8dc">Reasoning Engine</text>
    <text x="450" y="364" text-anchor="middle" font-size="9" fill="#fde8dc">Context + Instructions + Tools</text>
  </g>

  <!-- ==================== TOP: THOUGHT ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.7s" fill="freeze"/>
    <rect x="270" y="75" width="360" height="70" rx="10" fill="var(--bg-default, #ffffff)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect x="270" y="75" width="360" height="28" rx="10" fill="#7c3aed"/>
    <rect x="270" y="95" width="360" height="8" fill="#7c3aed"/>
    <text x="450" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">THOUGHT</text>
    <text x="285" y="118" font-size="10" fill="var(--text-default, #0f172a)">"I need to find the current weather in Paris."</text>
    <text x="285" y="134" font-size="9" fill="var(--text-muted, #64748b)">LLM reasons about what to do next based on context</text>

    <!-- Arrow down: Thought → Action -->
    <path d="M 450 145 L 450 175" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <circle cx="450" cy="160" r="3" fill="#7c3aed" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;165" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== TOP-RIGHT: ACTION ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.9s" fill="freeze"/>
    <rect x="270" y="180" width="360" height="70" rx="10" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <rect x="270" y="180" width="360" height="28" rx="10" fill="#2563eb"/>
    <rect x="270" y="200" width="360" height="8" fill="#2563eb"/>
    <text x="450" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">ACTION</text>
    <text x="285" y="224" font-size="10" fill="var(--text-default, #0f172a)">search("weather in Paris")</text>
    <text x="285" y="240" font-size="9" fill="var(--text-muted, #64748b)">LLM calls a tool/API via function calling</text>

    <!-- Arrow down: Action → Observation -->
    <line x1="450" y1="250" x2="450" y2="275" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Arrow: LLM → Action (tool call) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.0s" fill="freeze"/>
    <path d="M 450 375 L 450 250" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" stroke-dasharray="4,3" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.6s" repeatCount="indefinite"/>
    </path>
    <text x="465" y="320" font-size="8" fill="#2563eb" font-weight="600">Tool call JSON</text>
  </g>

  <!-- ==================== BOTTOM-RIGHT: OBSERVATION ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.1s" fill="freeze"/>
    <rect x="270" y="400" width="360" height="70" rx="10" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect x="270" y="400" width="360" height="28" rx="10" fill="#059669"/>
    <rect x="270" y="420" width="360" height="8" fill="#059669"/>
    <text x="450" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">OBSERVATION</text>
    <text x="285" y="444" font-size="10" fill="var(--text-default, #0f172a)">Result: 22°C, sunny</text>
    <text x="285" y="460" font-size="9" fill="var(--text-muted, #64748b)">Tool output is fed back to the LLM</text>

    <!-- Arrow: Observation → LLM -->
    <path d="M 450 470 L 450 375" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>
    <circle cx="450" cy="425" r="3" fill="#059669" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="465;400" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== BOTTOM: FINAL ANSWER ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.3s" fill="freeze"/>
    <rect x="270" y="500" width="360" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect x="270" y="500" width="360" height="28" rx="10" fill="#7c3aed"/>
    <rect x="270" y="520" width="360" height="8" fill="#7c3aed"/>
    <text x="450" y="520" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">FINAL ANSWER</text>
    <text x="285" y="544" font-size="10" fill="var(--text-default, #0f172a)">"Pack for warm weather — light clothing and sunscreen."</text>

    <!-- Arrow: LLM → Final Answer -->
    <path d="M 585 325 L 680 325 L 680 530 L 630 530" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.6s" repeatCount="indefinite"/>
    </path>
    <text x="690" y="420" font-size="8" fill="#7c3aed" font-weight="600">Generate</text>
  </g>

  <!-- ==================== RIGHT: TOOL DEFINITIONS ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
    <line x1="50" y1="580" x2="850" y2="580" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <text x="450" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text-default, #0f172a)">Agent Capabilities</text>

    <rect x="30" y="612" width="160" height="26" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="110" y="629" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Planning</text>

    <rect x="200" y="612" width="160" height="26" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="280" y="629" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Tool Use</text>

    <rect x="370" y="612" width="160" height="26" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="450" y="629" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Memory</text>

    <rect x="540" y="612" width="160" height="26" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="620" y="629" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Self-correction</text>

    <rect x="710" y="612" width="160" height="26" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="790" y="629" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Observation</text>
  </g>
</svg>
