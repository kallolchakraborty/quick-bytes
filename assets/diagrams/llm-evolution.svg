<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" font-family="Ubuntu, sans-serif">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    .bg-card { fill: #ffffff; }
    .bg-subtle { fill: #f8fafc; }
    .text-default { fill: #0f172a; }
    .text-muted { fill: #64748b; }
    .border-default { stroke: #e2e8f0; }
    .brand { fill: #14b8a6; }
    .brand-border { stroke: #14b8a6; }
    .brand-hover { fill: #0d9488; }
    .brand-light { fill: #ccfbf1; }
    .brand-dark { fill: #0d9488; }

    @media (prefers-color-scheme: dark) {
      .bg-card { fill: #1e293b; }
      .bg-subtle { fill: #0f172a; }
      .text-default { fill: #f1f5f9; }
      .text-muted { fill: #94a3b8; }
      .border-default { stroke: #334155; }
      .brand { fill: #2dd4bf; }
      .brand-border { stroke: #2dd4bf; }
      .brand-hover { fill: #5eead4; }
      .brand-light { fill: #134e4a; }
      .brand-dark { fill: #14b8a6; }
    }
    .fade-slide { opacity: 0; transform: translateY(-8px); }
  </style>

  <rect width="520" height="640" fill="none"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0d9488" class="brand-dark">LLM Evolution Timeline</text>

  <!-- Vertical line -->
  <line x1="60" y1="56" x2="60" y2="590" stroke="#e2e8f0" stroke-width="2" class="border-default"/>

  <!-- Animated pulse -->
  <circle cx="60" r="5" fill="#14b8a6" opacity="0.4" class="brand">
    <animate attributeName="cy" values="56;590" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0.6;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;6;3" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- ERA 1: Statistical LMs -->
  <g>
    <circle cx="60" cy="85" r="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" class="bg-card border-default">
      <animate attributeName="r" values="0;10" dur="0.35s" begin="0.3s" fill="freeze"/>
    </circle>
    <circle cx="60" cy="85" r="3" fill="#94a3b8" class="text-muted" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.65s" fill="freeze"/>
    </circle>
    <g class="fade-slide">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,-8;0,0" dur="0.4s" begin="0.8s" fill="freeze"/>
      <rect x="90" y="58" width="400" height="54" rx="8" class="bg-card border-default" stroke-width="1"/>
      <rect x="90" y="58" width="4" height="54" rx="2" class="brand-light brand"/>
      <text x="108" y="78" font-size="12" font-weight="700" class="text-default">Statistical LMs</text>
      <text x="108" y="96" font-size="10" class="text-muted">n-gram models, Markov chains — sparse, no generalization</text>
      <rect x="430" y="62" width="46" height="18" rx="4" class="bg-subtle border-default" stroke-width="0.5"/>
      <text x="453" y="75" text-anchor="middle" font-size="9" font-weight="600" class="text-muted">pre-2013</text>
    </g>
  </g>

  <!-- ERA 2: Neural LMs -->
  <g>
    <circle cx="60" cy="185" r="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" class="bg-card border-default">
      <animate attributeName="r" values="0;10" dur="0.35s" begin="1.2s" fill="freeze"/>
    </circle>
    <circle cx="60" cy="185" r="3" fill="#94a3b8" class="text-muted" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.55s" fill="freeze"/>
    </circle>
    <g class="fade-slide">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,-8;0,0" dur="0.4s" begin="1.7s" fill="freeze"/>
      <rect x="90" y="158" width="400" height="54" rx="8" class="bg-card border-default" stroke-width="1" filter="url(#shadow)"/>
      <rect x="90" y="158" width="4" height="54" rx="2" class="brand-light brand"/>
      <text x="108" y="178" font-size="12" font-weight="700" class="text-default">Neural LMs</text>
      <text x="108" y="196" font-size="10" class="text-muted">Word2Vec, LSTMs, GRUs — dense reps, sequential, limited context</text>
      <rect x="430" y="162" width="46" height="18" rx="4" class="bg-subtle border-default" stroke-width="0.5"/>
      <text x="453" y="175" text-anchor="middle" font-size="9" font-weight="600" class="text-muted">2013–2017</text>
    </g>
  </g>

  <!-- ERA 3: Transformers -->
  <g>
    <circle cx="60" cy="285" r="11" fill="#ffffff" class="bg-card brand-border" stroke-width="2.5">
      <animate attributeName="r" values="0;11" dur="0.35s" begin="2.1s" fill="freeze"/>
    </circle>
    <circle cx="60" cy="285" r="4" class="brand" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.45s" fill="freeze"/>
    </circle>
    <circle cx="60" cy="285" r="16" fill="none" class="brand-border" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="11;20" dur="2s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <g class="fade-slide">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,-8;0,0" dur="0.4s" begin="2.6s" fill="freeze"/>
      <rect x="90" y="258" width="400" height="62" rx="8" class="bg-card brand-border" stroke-width="1"/>
      <rect x="90" y="258" width="4" height="62" rx="2" class="brand"/>
      <text x="108" y="278" font-size="12" font-weight="700" class="brand" fill="#0d9488">Transformers</text>
      <text x="108" y="296" font-size="10" class="text-muted">"Attention Is All You Need" — parallelizable, attends to all positions</text>
      <text x="108" y="311" font-size="10" class="text-muted">Foundation of every modern LLM</text>
      <rect x="430" y="262" width="46" height="18" rx="4" class="bg-subtle border-default" stroke-width="0.5"/>
      <text x="453" y="275" text-anchor="middle" font-size="9" font-weight="600" class="text-muted">2017</text>
    </g>
  </g>

  <!-- ERA 4: Scaling Era -->
  <g>
    <circle cx="60" cy="395" r="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" class="bg-card border-default">
      <animate attributeName="r" values="0;10" dur="0.35s" begin="3s" fill="freeze"/>
    </circle>
    <circle cx="60" cy="395" r="3" fill="#94a3b8" class="text-muted" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.35s" fill="freeze"/>
    </circle>
    <g class="fade-slide">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,-8;0,0" dur="0.4s" begin="3.5s" fill="freeze"/>
      <rect x="90" y="368" width="400" height="54" rx="8" class="bg-card border-default" stroke-width="1"/>
      <rect x="90" y="368" width="4" height="54" rx="2" class="brand-light brand"/>
      <text x="108" y="388" font-size="12" font-weight="700" class="text-default">Scaling Era</text>
      <text x="108" y="406" font-size="10" class="text-muted">GPT-3 (175B), PaLM (540B) — scaling laws, CoT, few-shot, emergence</text>
      <rect x="430" y="372" width="46" height="18" rx="4" class="bg-subtle border-default" stroke-width="0.5"/>
      <text x="453" y="385" text-anchor="middle" font-size="9" font-weight="600" class="text-muted">2020+</text>
    </g>
  </g>

  <!-- ERA 5: Post-Training Era -->
  <g>
    <circle cx="60" cy="500" r="11" fill="#ffffff" class="bg-card brand-border" stroke-width="2.5">
      <animate attributeName="r" values="0;11" dur="0.35s" begin="3.9s" fill="freeze"/>
    </circle>
    <circle cx="60" cy="500" r="4" class="brand" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.25s" fill="freeze"/>
    </circle>
    <circle cx="60" cy="500" r="16" fill="none" class="brand-border" stroke-width="1" opacity="0">
      <animate attributeName="r" values="11;19;11" dur="2.5s" begin="4.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" begin="4.3s" repeatCount="indefinite"/>
    </circle>
    <g class="fade-slide">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,-8;0,0" dur="0.4s" begin="4.4s" fill="freeze"/>
      <rect x="90" y="472" width="400" height="66" rx="8" class="bg-card brand-border" stroke-width="1"/>
      <rect x="90" y="472" width="4" height="66" rx="2" class="brand"/>
      <text x="108" y="492" font-size="12" font-weight="700" class="text-default">Post-Training Era</text>
      <text x="108" y="510" font-size="10" class="text-muted">SFT, RLHF, DPO, Constitutional AI — aligned assistants</text>
      <text x="108" y="526" font-size="10" class="text-muted">MoE (Mixtral, GPT-4), Multimodal (GPT-4V, Gemini, Claude 3)</text>
      <rect x="430" y="476" width="46" height="18" rx="4" class="bg-subtle border-default" stroke-width="0.5"/>
      <text x="453" y="489" text-anchor="middle" font-size="9" font-weight="600" class="text-muted">2023+</text>
    </g>
  </g>

  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0d9488" flood-opacity="0.08"/>
    </filter>
  </defs>
</svg>
