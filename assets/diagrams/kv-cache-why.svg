<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Ubuntu, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <linearGradient id="boxGradGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowGreen">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowDn" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#E95420"/>
    </marker>
    <marker id="arrowDnGray" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#059669"/>
    </marker>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#E95420"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.1s" fill="freeze"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#C34113">KV Cache: Naive Recompute vs Cached</text>
    <line x1="220" y1="38" x2="680" y2="38" stroke="#E95420" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Divider line -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/>
    <line x1="450" y1="50" x2="450" y2="490" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,4"/>
  </g>

  <!-- ==================== LEFT: WITHOUT KV CACHE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <rect x="30" y="55" width="380" height="24" rx="4" fill="#fde8dc"/>
    <text x="220" y="71" text-anchor="middle" font-size="12" font-weight="700" fill="#C34113">WITHOUT KV CACHE</text>
    <text x="220" y="88" text-anchor="middle" font-size="9" fill="#64748b">Recompute all K,V every step</text>
  </g>

  <!-- Left Step 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    <text x="45" y="122" font-size="9" font-weight="600" fill="#64748b">Step 1</text>
    <rect x="95" y="108" width="70" height="24" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1.5"/>
    <text x="130" y="124" text-anchor="middle" font-size="9" font-weight="700" fill="#C34113">K₁</text>
    <rect x="180" y="108" width="70" height="24" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1.5"/>
    <text x="215" y="124" text-anchor="middle" font-size="9" font-weight="700" fill="#C34113">V₁</text>
    <text x="280" y="124" font-size="8" fill="#94a3b8">1 token computed</text>
  </g>

  <!-- Left Step 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    <text x="45" y="170" font-size="9" font-weight="600" fill="#64748b">Step 2</text>
    <rect x="95" y="152" width="55" height="24" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <text x="122" y="168" text-anchor="middle" font-size="8" fill="#C34113">K₁</text>
    <rect x="155" y="152" width="55" height="24" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <text x="182" y="168" text-anchor="middle" font-size="8" fill="#C34113">K₂</text>
    <rect x="215" y="152" width="55" height="24" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <text x="242" y="168" text-anchor="middle" font-size="8" fill="#C34113">V₁</text>
    <rect x="275" y="152" width="55" height="24" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <text x="302" y="168" text-anchor="middle" font-size="8" fill="#C34113">V₂</text>
    <text x="410" y="168" font-size="8" fill="#94a3b8">2 tokens</text>
    <text x="410" y="180" font-size="8" fill="#94a3b8">computed</text>
  </g>

  <!-- Left Step 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <text x="45" y="218" font-size="9" font-weight="600" fill="#64748b">Step 3</text>
    <rect x="95" y="200" width="40" height="24" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <text x="115" y="216" text-anchor="middle" font-size="7" fill="#C34113">K₁</text>
    <rect x="138" y="200" width="40" height="24" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <text x="158" y="216" text-anchor="middle" font-size="7" fill="#C34113">K₂</text>
    <rect x="181" y="200" width="40" height="24" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <text x="201" y="216" text-anchor="middle" font-size="7" fill="#C34113">K₃</text>
    <rect x="224" y="200" width="40" height="24" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <text x="244" y="216" text-anchor="middle" font-size="7" fill="#C34113">V₁</text>
    <rect x="267" y="200" width="40" height="24" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <text x="287" y="216" text-anchor="middle" font-size="7" fill="#C34113">V₂</text>
    <rect x="310" y="200" width="40" height="24" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <text x="330" y="216" text-anchor="middle" font-size="7" fill="#C34113">V₃</text>
    <text x="410" y="216" font-size="8" fill="#94a3b8">3 tokens</text>
    <text x="410" y="228" font-size="8" fill="#94a3b8">computed</text>
  </g>

  <!-- Left O(n²) label -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
    <rect x="130" y="245" width="180" height="36" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="220" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">O(n²) compute</text>
    <text x="220" y="275" text-anchor="middle" font-size="8" fill="#991b1b">Grows quadratically</text>
  </g>

  <!-- Left: growing bars visualization -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    <text x="45" y="310" font-size="9" font-weight="600" fill="#64748b">Work per step:</text>
    <rect x="130" y="298" width="40" height="16" rx="3" fill="#E95420" opacity="0.7"/>
    <rect x="130" y="318" width="80" height="16" rx="3" fill="#E95420" opacity="0.8"/>
    <rect x="130" y="338" width="160" height="16" rx="3" fill="#E95420" opacity="0.9"/>
    <text x="130" y="365" font-size="8" fill="#94a3b8">Each step re-does ALL previous work</text>
  </g>

  <!-- ==================== RIGHT: WITH KV CACHE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    <rect x="490" y="55" width="380" height="24" rx="4" fill="#ecfdf5"/>
    <text x="680" y="71" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">WITH KV CACHE</text>
    <text x="680" y="88" text-anchor="middle" font-size="9" fill="#64748b">Compute K,V once, store in cache</text>
  </g>

  <!-- Right Step 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.0s" fill="freeze"/>
    <text x="505" y="122" font-size="9" font-weight="600" fill="#64748b">Step 1</text>
    <rect x="555" y="108" width="70" height="24" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="590" y="124" text-anchor="middle" font-size="9" font-weight="700" fill="#059669">K₁</text>
    <rect x="640" y="108" width="70" height="24" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="675" y="124" text-anchor="middle" font-size="9" font-weight="700" fill="#059669">V₁</text>
    <!-- Cache box -->
    <rect x="730" y="105" width="72" height="30" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="766" y="124" text-anchor="middle" font-size="8" font-weight="600" fill="#059669">Cache</text>
  </g>

  <!-- Right Step 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.3s" fill="freeze"/>
    <text x="505" y="170" font-size="9" font-weight="600" fill="#64748b">Step 2</text>
    <rect x="555" y="152" width="70" height="24" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="590" y="168" text-anchor="middle" font-size="9" font-weight="700" fill="#059669">K₂</text>
    <rect x="640" y="152" width="70" height="24" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="675" y="168" text-anchor="middle" font-size="9" font-weight="700" fill="#059669">V₂</text>
    <!-- Cache box wider -->
    <rect x="730" y="148" width="110" height="30" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="748" y="162" font-size="7" fill="#059669">K₁V₁</text>
    <line x1="780" y1="150" x2="780" y2="176" stroke="#059669" stroke-width="0.5" stroke-dasharray="2,2"/>
    <text x="796" y="168" font-size="7" fill="#059669">K₂V₂</text>
  </g>

  <!-- Right Step 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.6s" fill="freeze"/>
    <text x="505" y="218" font-size="9" font-weight="600" fill="#64748b">Step 3</text>
    <rect x="555" y="200" width="70" height="24" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="590" y="216" text-anchor="middle" font-size="9" font-weight="700" fill="#059669">K₃</text>
    <rect x="640" y="200" width="70" height="24" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="675" y="216" text-anchor="middle" font-size="9" font-weight="700" fill="#059669">V₃</text>
    <!-- Cache box widest -->
    <rect x="730" y="196" width="148" height="30" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="752" y="210" font-size="7" fill="#059669">K₁V₁</text>
    <line x1="782" y1="198" x2="782" y2="224" stroke="#059669" stroke-width="0.5" stroke-dasharray="2,2"/>
    <text x="800" y="210" font-size="7" fill="#059669">K₂V₂</text>
    <line x1="828" y1="198" x2="828" y2="224" stroke="#059669" stroke-width="0.5" stroke-dasharray="2,2"/>
    <text x="846" y="210" font-size="7" fill="#059669">K₃V₃</text>
  </g>

  <!-- Right O(n) label -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.9s" fill="freeze"/>
    <rect x="575" y="245" width="180" height="36" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadowGreen)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="665" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">O(n) compute</text>
    <text x="665" y="275" text-anchor="middle" font-size="8" fill="#065f46">Linear — one new token</text>
  </g>

  <!-- Right: flat bars visualization -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.0s" fill="freeze"/>
    <text x="505" y="310" font-size="9" font-weight="600" fill="#64748b">Work per step:</text>
    <rect x="595" y="298" width="40" height="16" rx="3" fill="#059669" opacity="0.7"/>
    <rect x="595" y="318" width="40" height="16" rx="3" fill="#059669" opacity="0.7"/>
    <rect x="595" y="338" width="40" height="16" rx="3" fill="#059669" opacity="0.7"/>
    <text x="595" y="365" font-size="8" fill="#94a3b8">Each step does only ONE new computation</text>
  </g>

  <!-- ==================== COMPARISON ARROW ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.2s" fill="freeze"/>
    <!-- Savings highlight -->
    <rect x="300" y="385" width="300" height="48" rx="10" fill="#fff5eb" stroke="#E95420" stroke-width="2" filter="url(#shadow)"/>
    <text x="450" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#C34113">Cache saves recomputation</text>
    <text x="450" y="420" text-anchor="middle" font-size="10" fill="#64748b">For S tokens: saves S-1 K,V pairs per generation step</text>
  </g>

  <!-- Left bracket showing growing work -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.4s" fill="freeze"/>
    <path d="M420,105 L435,105 L435,225 L420,225" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <text x="445" y="170" font-size="9" font-weight="600" fill="#dc2626">Total:</text>
    <text x="445" y="183" font-size="9" fill="#dc2626">1+2+3 = 6</text>
  </g>

  <!-- Right bracket showing constant work -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.4s" fill="freeze"/>
    <path d="M890,105 L900,105 L900,225 L890,225" fill="none" stroke="#059669" stroke-width="1.5"/>
  </g>

  <!-- ==================== BOTTOM SUMMARY ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.6s" fill="freeze"/>
    <!-- Without -->
    <rect x="30" y="445" width="380" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="220" y="464" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Token 1000 → recompute 999 K,V pairs</text>
    <!-- With -->
    <rect x="490" y="445" width="380" height="30" rx="6" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
    <text x="680" y="464" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">Token 1000 → compute 1 K,V pair + lookup</text>
  </g>

  <!-- ==================== FLOW PARTICLES (right side) ==================== -->
  <circle r="3" fill="#059669" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3s" begin="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="590;590;590;766;766" dur="3s" begin="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;120;120;120;120" dur="3s" begin="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#059669" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3s" begin="3.8s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="590;590;590;790;790" dur="3s" begin="3.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="168;168;168;168;168" dur="3s" begin="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#059669" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3s" begin="4.1s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="590;590;590;815;815" dur="3s" begin="4.1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="216;216;216;216;216" dur="3s" begin="4.1s" repeatCount="indefinite"/>
  </circle>

  <!-- ==================== SAVINGS ARROW ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.8s" fill="freeze"/>
    <path d="M350,290 C400,280 500,280 550,290" fill="none" stroke="#E95420" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="548,285 558,290 548,295" fill="#E95420"/>
    <text x="450" y="278" text-anchor="middle" font-size="9" font-weight="600" fill="#E95420">Saved!</text>
  </g>

</svg>
