<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Vector Database Architecture</text>
    <line x1="280" y1="34" x2="620" y2="34" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="50" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Store and index embeddings for fast approximate nearest neighbor search</text>
  </g>

  <!-- ==================== TOP: STORAGE LAYER ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.5s" fill="freeze"/>
    <rect x="20" y="65" width="860" height="32" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="450" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="var(--brand-default, #e95420)">STORAGE LAYER</text>
  </g>

  <!-- Documents section -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
    <rect x="20" y="108" width="170" height="140" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="20" y="108" width="170" height="28" rx="8" fill="#94a3b8"/>
    <rect x="20" y="128" width="170" height="8" fill="#94a3b8"/>
    <text x="105" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Documents</text>

    <rect x="30" y="144" width="150" height="16" rx="3" fill="var(--bg-subtle, #f8fafc)"/>
    <text x="36" y="155" font-size="8" fill="var(--text-muted, #64748b)">Doc 1: "Attention is all..."</text>
    <rect x="30" y="164" width="150" height="16" rx="3" fill="var(--bg-subtle, #f8fafc)"/>
    <text x="36" y="175" font-size="8" fill="var(--text-muted, #64748b)">Doc 2: "Deep learning..."</text>
    <rect x="30" y="184" width="150" height="16" rx="3" fill="var(--bg-subtle, #f8fafc)"/>
    <text x="36" y="195" font-size="8" fill="var(--text-muted, #64748b)">Doc 3: "Transformer..."</text>
    <rect x="30" y="204" width="150" height="16" rx="3" fill="var(--bg-subtle, #f8fafc)"/>
    <text x="36" y="215" font-size="8" fill="var(--text-muted, #64748b)">Doc N: "..."</text>

    <!-- Arrow -->
    <line x1="190" y1="178" x2="220" y2="178" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Embedding process -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.7s" fill="freeze"/>
    <rect x="225" y="108" width="150" height="140" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="225" y="108" width="150" height="28" rx="8" fill="var(--brand-default, #e95420)"/>
    <rect x="225" y="128" width="150" height="8" fill="var(--brand-default, #e95420)"/>
    <text x="300" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Chunk + Embed</text>

    <text x="235" y="150" font-size="9" fill="var(--text-default, #0f172a)">Chunk documents</text>
    <text x="235" y="166" font-size="9" fill="var(--text-muted, #64748b)">256-1024 tokens</text>
    <text x="235" y="186" font-size="9" fill="var(--text-default, #0f172a)">Embed each chunk</text>
    <text x="235" y="202" font-size="9" fill="var(--text-muted, #64748b)">768-4096 dimensions</text>
    <text x="235" y="222" font-size="9" fill="var(--text-default, #0f172a)">Normalize vectors</text>

    <!-- Arrow -->
    <line x1="375" y1="178" x2="405" y2="178" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Vector Storage -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    <rect x="410" y="108" width="200" height="140" rx="10" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="410" y="108" width="200" height="28" rx="10" fill="#2563eb"/>
    <rect x="410" y="128" width="200" height="8" fill="#2563eb"/>
    <text x="510" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Vector Store + Metadata</text>

    <!-- Vectors -->
    <rect x="420" y="144" width="87" height="16" rx="3" fill="var(--bg-subtle, #f8fafc)"/>
    <text x="426" y="155" font-size="8" fill="var(--text-muted, #64748b)">vec[0.23, 0.89, ...]</text>
    <rect x="513" y="144" width="87" height="16" rx="3" fill="var(--bg-subtle, #f8fafc)"/>
    <text x="519" y="155" font-size="8" fill="var(--text-muted, #64748b)">meta: {date, author}</text>

    <rect x="420" y="164" width="87" height="16" rx="3" fill="var(--bg-subtle, #f8fafc)"/>
    <text x="426" y="175" font-size="8" fill="var(--text-muted, #64748b)">vec[0.91, 0.34, ...]</text>
    <rect x="513" y="164" width="87" height="16" rx="3" fill="var(--bg-subtle, #f8fafc)"/>
    <text x="519" y="175" font-size="8" fill="var(--text-muted, #64748b)">meta: {category, ...}</text>

    <rect x="420" y="184" width="87" height="16" rx="3" fill="var(--bg-subtle, #f8fafc)"/>
    <text x="426" y="195" font-size="8" fill="var(--text-muted, #64748b)">vec[0.45, 0.02, ...]</text>
    <rect x="513" y="184" width="87" height="16" rx="3" fill="var(--bg-subtle, #f8fafc)"/>
    <text x="519" y="195" font-size="8" fill="var(--text-muted, #64748b)">meta: {...}</text>

    <rect x="420" y="204" width="180" height="16" rx="3" fill="var(--bg-subtle, #f8fafc)"/>
    <text x="426" y="215" font-size="8" fill="var(--text-muted, #64748b)">vec[...] ...  millions of vectors</text>
  </g>

  <!-- ==================== MIDDLE: INDEX LAYER ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.0s" fill="freeze"/>
    <line x1="20" y1="268" x2="880" y2="268" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <rect x="20" y="278" width="860" height="32" rx="6" fill="rgba(37,99,235,0.06)"/>
    <text x="450" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">INDEX LAYER — ANN Index Types</text>
  </g>

  <!-- HNSW -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <rect x="20" y="318" width="275" height="110" rx="8" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="318" width="275" height="28" rx="8" fill="#2563eb"/>
    <rect x="20" y="338" width="275" height="8" fill="#2563eb"/>
    <text x="157" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">HNSW (Hierarchical Navigable Small World)</text>

    <!-- HNSW layers visualization -->
    <circle cx="50" cy="368" r="4" fill="#2563eb" opacity="0.3"/>
    <circle cx="90" cy="368" r="4" fill="#2563eb" opacity="0.5"/>
    <circle cx="130" cy="368" r="4" fill="#2563eb" opacity="0.3"/>
    <circle cx="170" cy="368" r="4" fill="#2563eb" opacity="0.5"/>
    <circle cx="210" cy="368" r="4" fill="#2563eb" opacity="0.3"/>
    <line x1="50" y1="368" x2="90" y2="368" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="90" y1="368" x2="130" y2="368" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="130" y1="368" x2="170" y2="368" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="170" y1="368" x2="210" y2="368" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>

    <circle cx="55" cy="390" r="3" fill="#2563eb" opacity="0.4"/>
    <circle cx="85" cy="390" r="3" fill="#2563eb" opacity="0.4"/>
    <circle cx="120" cy="390" r="3" fill="#2563eb" opacity="0.4"/>
    <circle cx="155" cy="390" r="3" fill="#2563eb" opacity="0.4"/>
    <circle cx="190" cy="390" r="3" fill="#2563eb" opacity="0.4"/>
    <circle cx="230" cy="390" r="3" fill="#2563eb" opacity="0.4"/>
    <line x1="55" y1="390" x2="85" y2="390" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="85" y1="390" x2="120" y2="390" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="120" y1="390" x2="155" y2="390" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="155" y1="390" x2="190" y2="390" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="190" y1="390" x2="230" y2="390" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>

    <circle cx="40" cy="410" r="2" fill="#2563eb" opacity="0.5"/>
    <circle cx="65" cy="410" r="2" fill="#2563eb" opacity="0.5"/>
    <circle cx="95" cy="410" r="2" fill="#2563eb" opacity="0.5"/>
    <circle cx="130" cy="410" r="2" fill="#2563eb" opacity="0.5"/>
    <circle cx="170" cy="410" r="2" fill="#2563eb" opacity="0.5"/>
    <circle cx="205" cy="410" r="2" fill="#2563eb" opacity="0.5"/>
    <circle cx="245" cy="410" r="2" fill="#2563eb" opacity="0.5"/>
    <line x1="40" y1="410" x2="65" y2="410" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="65" y1="410" x2="95" y2="410" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="95" y1="410" x2="130" y2="410" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="130" y1="410" x2="170" y2="410" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="170" y1="410" x2="205" y2="410" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
    <line x1="205" y1="410" x2="245" y2="410" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>

    <text x="157" y="424" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Layer 0 (coarse) → Layer N (fine)</text>
  </g>

  <!-- IVF -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
    <rect x="310" y="318" width="275" height="110" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="310" y="318" width="275" height="28" rx="8" fill="#64748b"/>
    <rect x="310" y="338" width="275" height="8" fill="#64748b"/>
    <text x="447" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">IVF (Inverted File Index)</text>

    <!-- Clusters -->
    <rect x="325" y="358" width="50" height="30" rx="4" fill="var(--bg-subtle, #f8fafc)" stroke="#64748b" stroke-width="0.5"/>
    <text x="350" y="377" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Cluster 1</text>
    <rect x="385" y="358" width="50" height="30" rx="4" fill="var(--bg-subtle, #f8fafc)" stroke="#64748b" stroke-width="0.5"/>
    <text x="410" y="377" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Cluster 2</text>
    <rect x="445" y="358" width="50" height="30" rx="4" fill="var(--bg-subtle, #f8fafc)" stroke="#64748b" stroke-width="0.5"/>
    <text x="470" y="377" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Cluster 3</text>
    <rect x="505" y="358" width="50" height="30" rx="4" fill="var(--bg-subtle, #f8fafc)" stroke="#64748b" stroke-width="0.5"/>
    <text x="530" y="377" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Cluster K</text>

    <text x="447" y="420" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">K-means centroids → search nearest centroids</text>
  </g>

  <!-- DiskANN -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>
    <rect x="600" y="318" width="280" height="110" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="600" y="318" width="280" height="28" rx="8" fill="#64748b"/>
    <rect x="600" y="338" width="280" height="8" fill="#64748b"/>
    <text x="740" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DiskANN / ScaNN</text>

    <text x="615" y="362" font-size="9" fill="var(--text-default, #0f172a)">DiskANN: SSD-based, large-scale</text>
    <text x="615" y="378" font-size="9" fill="var(--text-muted, #64748b)">10B+ vectors, compressed storage</text>
    <text x="615" y="398" font-size="9" fill="var(--text-default, #0f172a)">ScaNN: Google's quantization-based</text>
    <text x="615" y="414" font-size="9" fill="var(--text-muted, #64748b)">Anisotropic quantization, fast search</text>
  </g>

  <!-- ==================== BOTTOM: QUERY LAYER ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.4s" fill="freeze"/>
    <line x1="20" y1="448" x2="880" y2="448" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <rect x="20" y="458" width="860" height="32" rx="6" fill="rgba(5,150,105,0.08)"/>
    <text x="450" y="479" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">QUERY LAYER</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    <!-- Query -->
    <rect x="20" y="500" width="160" height="45" rx="6" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <text x="100" y="518" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Query Vector</text>
    <text x="100" y="534" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Embedded user query</text>

    <line x1="180" y1="523" x2="210" y2="523" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- ANN Search -->
    <rect x="215" y="500" width="160" height="45" rx="6" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="1.5" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="295" y="516" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">ANN Traversal</text>
    <text x="295" y="534" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Index graph walk</text>

    <line x1="375" y1="523" x2="405" y2="523" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Filter -->
    <rect x="410" y="500" width="140" height="45" rx="6" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <text x="480" y="516" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Metadata Filter</text>
    <text x="480" y="534" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Pre/post-filter</text>

    <line x1="550" y1="523" x2="580" y2="523" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Results -->
    <rect x="585" y="500" width="160" height="45" rx="6" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="665" y="516" text-anchor="middle" font-size="10" font-weight="600" fill="var(--brand-default, #e95420)">Top-K Results</text>
    <text x="665" y="534" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Nearest neighbors</text>

    <line x1="745" y1="523" x2="775" y2="523" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Rerank -->
    <rect x="780" y="496" width="100" height="54" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))" stroke="var(--brand-default, #e95420)" stroke-width="1"/>
    <text x="830" y="514" text-anchor="middle" font-size="9" font-weight="600" fill="var(--brand-default, #e95420)">Re-rank</text>
    <text x="830" y="530" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Cross-encoder</text>
    <text x="830" y="544" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">(optional)</text>
  </g>

  <!-- Bottom stats -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
    <rect x="150" y="562" width="600" height="28" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="450" y="580" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Popular: Pinecone, Weaviate, Qdrant, Milvus, Chroma, FAISS —  </text>
    <text x="450" y="580" text-anchor="middle" font-size="10" font-weight="600" fill="var(--brand-default, #e95420)">Choose based on: latency vs recall vs cost</text>
  </g>
</svg>
