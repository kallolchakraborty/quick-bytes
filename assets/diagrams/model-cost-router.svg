<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#059669"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="650" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Model &amp; Cost Router</text>
    <line x1="300" y1="36" x2="600" y2="36" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="54" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Cost-quality-latency aware routing with cascading fallback</text>
  </g>

  <!-- Entry: Incoming Query -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.5s" fill="freeze"/>
    <rect x="340" y="70" width="220" height="50" rx="25" fill="var(--brand-default, #e95420)" filter="url(#shadow)"/>
    <text x="450" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Incoming Query</text>
    <!-- Arrow down to classifier -->
    <line x1="450" y1="120" x2="450" y2="145" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Classifier -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.65s" fill="freeze"/>
    <rect x="320" y="150" width="260" height="70" rx="10" fill="var(--bg-default, #ffffff)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect x="320" y="150" width="260" height="28" rx="10" fill="#7c3aed"/>
    <rect x="320" y="170" width="260" height="8" fill="#7c3aed"/>
    <text x="450" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">QUERY CLASSIFIER</text>
    <text x="335" y="196" font-size="9" fill="var(--text-default, #0f172a)">Semantic + Cost + Latency analysis</text>
    <text x="335" y="210" font-size="8" fill="var(--text-muted, #64748b)">Classifies into complexity tier</text>
  </g>

  <!-- Branch arrows from classifier -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
    <!-- Simple branch -->
    <path d="M 320 185 L 140 185 L 140 240" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>
    <rect x="155" y="179" width="55" height="14" rx="4" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="182" y="190" text-anchor="middle" font-size="7" fill="#059669" font-weight="600">simple</text>
    <!-- Medium branch -->
    <path d="M 450 220 L 450 240" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" fill="none"/>
    <rect x="465" y="224" width="55" height="14" rx="4" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="492" y="235" text-anchor="middle" font-size="7" fill="#2563eb" font-weight="600">medium</text>
    <!-- Complex branch -->
    <path d="M 580 185 L 760 185 L 760 240" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>
    <rect x="685" y="179" width="55" height="14" rx="4" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="712" y="190" text-anchor="middle" font-size="7" fill="#dc2626" font-weight="600">complex</text>
  </g>

  <!-- Model Tier: Small (7B) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
    <rect x="50" y="245" width="180" height="65" rx="10" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect x="50" y="245" width="180" height="28" rx="10" fill="#059669"/>
    <rect x="50" y="265" width="180" height="8" fill="#059669"/>
    <text x="140" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">TIER 1: SMALL</text>
    <text x="65" y="292" font-size="9" fill="var(--text-default, #0f172a)">7B model</text>
    <text x="65" y="304" font-size="8" fill="var(--text-muted, #64748b)">$0.0001/query | 50ms latency</text>
  </g>

  <!-- Model Tier: Medium (70B) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.0s" fill="freeze"/>
    <rect x="360" y="245" width="180" height="65" rx="10" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <rect x="360" y="245" width="180" height="28" rx="10" fill="#2563eb"/>
    <rect x="360" y="265" width="180" height="8" fill="#2563eb"/>
    <text x="450" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">TIER 2: MEDIUM</text>
    <text x="375" y="292" font-size="9" fill="var(--text-default, #0f172a)">70B model</text>
    <text x="375" y="304" font-size="8" fill="var(--text-muted, #64748b)">$0.001/query | 200ms latency</text>
  </g>

  <!-- Model Tier: Large (405B/MoE) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <rect x="670" y="245" width="180" height="65" rx="10" fill="var(--bg-default, #ffffff)" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <rect x="670" y="245" width="180" height="28" rx="10" fill="#dc2626"/>
    <rect x="670" y="265" width="180" height="8" fill="#dc2626"/>
    <text x="760" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">TIER 3: LARGE</text>
    <text x="685" y="292" font-size="9" fill="var(--text-default, #0f172a)">405B/MoE model</text>
    <text x="685" y="304" font-size="8" fill="var(--text-muted, #64748b)">$0.01/query | 1s latency</text>
  </g>

  <!-- Confidence check after model response -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.2s" fill="freeze"/>
    <rect x="320" y="340" width="260" height="50" rx="10" fill="var(--bg-default, #ffffff)" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,2" filter="url(#shadow)"/>
    <text x="450" y="358" text-anchor="middle" font-size="10" font-weight="600" fill="#7c3aed">Confidence Check</text>
    <text x="450" y="374" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Confidence ≥ threshold? → Deliver. Else → escalate</text>
  </g>

  <!-- Confidence check incoming arrows -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
    <!-- Tier 1 → Confidence -->
    <path d="M 140 310 L 140 365 L 320 365" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)" fill="none"/>
    <!-- Tier 2 → Confidence -->
    <line x1="450" y1="310" x2="450" y2="340" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <!-- Tier 3 → Confidence -->
    <path d="M 760 310 L 760 365 L 580 365" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)" fill="none"/>
  </g>

  <!-- Cascading Fallback Chain -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.4s" fill="freeze"/>
    <!-- Fallback arrows (T1 fail → T2, T2 fail → T3) -->
    <path d="M 230 278 L 300 278 L 300 310 L 360 310" stroke="#e95420" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.6s" repeatCount="indefinite"/>
    </path>
    <text x="275" y="295" font-size="8" fill="#e95420" font-weight="600">fail → escalate</text>
    <path d="M 540 278 L 610 278 L 610 310 L 670 310" stroke="#e95420" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Final Deliver / Fallback -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.5s" fill="freeze"/>
    <path d="M 450 390 L 450 430" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <!-- Deliver to user -->
    <rect x="360" y="435" width="180" height="45" rx="10" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect x="360" y="435" width="180" height="28" rx="10" fill="#059669"/>
    <rect x="360" y="455" width="180" height="8" fill="#059669"/>
    <text x="450" y="455" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DELIVER TO USER</text>
    <text x="375" y="474" font-size="8" fill="var(--text-muted, #64748b)">Response + cost + model metadata</text>
  </g>

  <!-- Fallback Static Response -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.6s" fill="freeze"/>
    <path d="M 760 310 L 800 310 L 800 475 L 540 475" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)" fill="none"/>
    <rect x="340" y="495" width="220" height="40" rx="10" fill="var(--bg-default, #ffffff)" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2" filter="url(#shadow)"/>
    <text x="450" y="510" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">Static Fallback Response</text>
    <text x="450" y="524" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">All tiers exhausted or all fail</text>
    <!-- Retry/Tier reset arrow -->
    <path d="M 340 515 L 140 515 L 140 310" stroke="#e95420" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow)" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-5" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <text x="225" y="490" font-size="7" fill="#e95420">retry with new context</text>
  </g>

  <!-- Legend -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
    <line x1="50" y1="560" x2="850" y2="560" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <rect x="50" y="575" width="240" height="24" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <circle cx="65" cy="587" r="4" fill="#059669"/>
    <text x="75" y="591" font-size="9" fill="var(--text-muted, #64748b)">T1: Simple — no router overhead</text>

    <rect x="330" y="575" width="240" height="24" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <circle cx="345" cy="587" r="4" fill="#2563eb"/>
    <text x="355" y="591" font-size="9" fill="var(--text-muted, #64748b)">T2: Balanced — quality + cost</text>

    <rect x="610" y="575" width="240" height="24" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <circle cx="625" cy="587" r="4" fill="#dc2626"/>
    <text x="635" y="591" font-size="9" fill="var(--text-muted, #64748b)">T3: Maximum quality — highest cost</text>
  </g>
</svg>