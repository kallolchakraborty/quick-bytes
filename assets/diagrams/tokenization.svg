<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="620" fill="none"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#C34113">Tokenization — Byte-Pair Encoding (BPE)</text>
  <line x1="270" y1="40" x2="630" y2="40" stroke="#E95420" stroke-width="1" opacity="0.3"/>

  <!-- ==================== INPUT TEXT ==================== -->
  <text x="450" y="65" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Input Text</text>
  <rect x="320" y="75" width="260" height="34" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)">
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
  </rect>
  <text x="450" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#C34113">unhappiness</text>

  <!-- Arrow from input to char split -->
  <line x1="450" y1="109" x2="450" y2="130" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
  </line>

  <!-- ==================== CHARACTER SPLIT ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1s" fill="freeze"/>
    <text x="450" y="145" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Character Split</text>

    <!-- Character boxes: positions calculated for 11 chars centered -->
    <!-- Each char box: 28w x 28h, 3px gap. Total: 11*28 + 10*3 = 338, start x = (900-338)/2 = 281 -->
    <!-- Group 1 "un" (blue): positions 0-1 -->
    <!-- Group 2 "happi" (green): positions 2-6 -->
    <!-- Group 3 "ness" (purple): positions 7-10 -->

    <!-- u (pos 0) -->
    <rect x="281" y="160" width="28" height="28" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="295" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">u</text>
    <!-- n (pos 1) -->
    <rect x="312" y="160" width="28" height="28" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="326" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">n</text>

    <!-- h (pos 2) -->
    <rect x="343" y="160" width="28" height="28" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="357" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">h</text>
    <!-- a (pos 3) -->
    <rect x="374" y="160" width="28" height="28" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="388" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">a</text>
    <!-- p (pos 4) -->
    <rect x="405" y="160" width="28" height="28" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="419" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">p</text>
    <!-- p (pos 5) -->
    <rect x="436" y="160" width="28" height="28" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="450" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">p</text>
    <!-- i (pos 6) -->
    <rect x="467" y="160" width="28" height="28" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="481" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">i</text>

    <!-- n (pos 7) -->
    <rect x="498" y="160" width="28" height="28" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="512" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">n</text>
    <!-- e (pos 8) -->
    <rect x="529" y="160" width="28" height="28" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="543" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">e</text>
    <!-- s (pos 9) -->
    <rect x="560" y="160" width="28" height="28" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="574" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">s</text>
    <!-- s (pos 10) -->
    <rect x="591" y="160" width="28" height="28" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="605" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">s</text>
  </g>

  <!-- ==================== BPE MERGE ARCS (ABOVE CHARS) ==================== -->

  <!-- Group 1 arc: u,n → "un" -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    <path d="M 278,155 Q 296.5,125 315,155" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="60" stroke-dashoffset="60">
      <animate attributeName="stroke-dashoffset" values="60;0" dur="0.5s" begin="1.8s" fill="freeze"/>
    </path>
    <text x="296.5" y="120" text-anchor="middle" font-size="10" font-weight="600" fill="#3b82f6">Merge 1: u + n</text>
    <text x="296.5" y="133" text-anchor="middle" font-size="9" fill="#94a3b8">freq: 2</text>
  </g>

  <!-- Group 2 arc: h,a,p,p,i → "happi" -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.4s" fill="freeze"/>
    <path d="M 340,155 Q 405,110 470,155" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="140" stroke-dashoffset="140">
      <animate attributeName="stroke-dashoffset" values="140;0" dur="0.7s" begin="2.4s" fill="freeze"/>
    </path>
    <text x="405" y="105" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">Merge 2–5: h+a→ha, ha+p→hap, hap+p→happ, happ+i→happi</text>
    <text x="405" y="118" text-anchor="middle" font-size="9" fill="#94a3b8">4 merge steps</text>
  </g>

  <!-- Group 3 arc: n,e,s,s → "ness" -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.2s" fill="freeze"/>
    <path d="M 495,155 Q 544.5,120 595,155" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="110" stroke-dashoffset="110">
      <animate attributeName="stroke-dashoffset" values="110;0" dur="0.6s" begin="3.2s" fill="freeze"/>
    </path>
    <text x="544.5" y="115" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">Merge 6–8: n+e→ne, ne+s→nes, nes+s→ness</text>
    <text x="544.5" y="128" text-anchor="middle" font-size="9" fill="#94a3b8">3 merge steps</text>
  </g>

  <!-- ==================== DOWNWARD CONNECTORS ==================== -->

  <!-- Group 1 downward arrows -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.4s" fill="freeze"/>
    <line x1="296.5" y1="188" x2="296.5" y2="365" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="293,362 296.5,372 300,362" fill="#3b82f6"/>
  </g>

  <!-- Group 2 downward arrows -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3s" fill="freeze"/>
    <line x1="405" y1="188" x2="405" y2="365" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="401.5,362 405,372 408.5,362" fill="#10b981"/>
  </g>

  <!-- Group 3 downward arrows -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.8s" fill="freeze"/>
    <line x1="544.5" y1="188" x2="544.5" y2="365" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="541,362 544.5,372 548,362" fill="#8b5cf6"/>
  </g>

  <!-- ==================== FINAL TOKENS ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.8s" fill="freeze"/>
    <text x="450" y="350" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">BPE Tokens</text>

    <!-- "un" token -->
    <rect x="246" y="370" width="100" height="36" rx="8" fill="#3b82f6" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
    <text x="296" y="393" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">un</text>

    <!-- "happi" token -->
    <rect x="358" y="370" width="96" height="36" rx="8" fill="#10b981" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="406" y="393" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">happi</text>

    <!-- "ness" token -->
    <rect x="470" y="370" width="84" height="36" rx="8" fill="#8b5cf6" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
    <text x="512" y="393" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ness</text>
  </g>

  <!-- ==================== TOKEN IDS ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.5s" fill="freeze"/>
    <text x="450" y="430" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Token IDs</text>

    <rect x="255" y="445" width="82" height="30" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="296" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">456</text>

    <rect x="365" y="445" width="82" height="30" rx="6" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
    <text x="406" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">18923</text>

    <rect x="478" y="445" width="68" height="30" rx="6" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="512" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">7234</text>
  </g>

  <!-- ==================== OUTPUT TEXT ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="4.2s" fill="freeze"/>
    <text x="450" y="500" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Tokenized Output</text>
    <rect x="200" y="515" width="500" height="34" rx="8" fill="#fff5eb" stroke="#E95420" stroke-width="1.5"/>
    <text x="450" y="536" text-anchor="middle" font-size="13" font-weight="600" fill="#C34113">unhappiness → ["un", "happi", "ness"]</text>
  </g>

  <!-- ==================== BOTTOM NOTE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="5s" fill="freeze"/>
    <line x1="100" y1="570" x2="800" y2="570" stroke="#E95420" stroke-width="1" opacity="0.15"/>
    <text x="450" y="590" text-anchor="middle" font-size="10" fill="#94a3b8">BPE iteratively merges the most frequent character pairs, building a vocabulary of reusable subword units</text>
    <text x="450" y="606" text-anchor="middle" font-size="10" fill="#94a3b8">Balance between character-level (too fine) and word-level (too sparse) tokenization</text>
  </g>
</svg>
