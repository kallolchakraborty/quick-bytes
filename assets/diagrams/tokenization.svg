<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#E95420"/>
    </marker>
  </defs>

  <rect width="900" height="700" fill="none"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#C34113">Tokenization — Byte-Pair Encoding (BPE)</text>
  <line x1="270" y1="40" x2="630" y2="40" stroke="#E95420" stroke-width="1" opacity="0.3"/>

  <!-- ==================== INPUT TEXT ==================== -->
  <text x="450" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Input Text</text>
  <rect x="320" y="82" width="260" height="34" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)">
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
  </rect>
  <text x="450" y="103" text-anchor="middle" font-size="15" font-weight="600" fill="#C34113">unhappiness</text>

  <!-- Arrow from input to char split -->
  <line x1="450" y1="116" x2="450" y2="145" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
  </line>

  <!-- ==================== CHARACTER SPLIT ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1s" fill="freeze"/>
    <text x="450" y="162" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Character Split</text>

    <!-- Each char box: 28w x 28h, 3px gap. Total: 11*28 + 10*3 = 338, start x = (900-338)/2 = 281 -->
    <!-- Group 1 "un" (blue): positions 0-1 -->
    <!-- Group 2 "happi" (green): positions 2-6 -->
    <!-- Group 3 "ness" (purple): positions 7-10 -->

    <!-- Row background -->
    <rect x="277" y="174" width="348" height="32" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

    <rect x="281" y="176" width="28" height="28" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="295" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">u</text>

    <rect x="312" y="176" width="28" height="28" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="326" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">n</text>

    <rect x="343" y="176" width="28" height="28" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="357" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">h</text>

    <rect x="374" y="176" width="28" height="28" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="388" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">a</text>

    <rect x="405" y="176" width="28" height="28" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="419" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">p</text>

    <rect x="436" y="176" width="28" height="28" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="450" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">p</text>

    <rect x="467" y="176" width="28" height="28" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="481" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">i</text>

    <rect x="498" y="176" width="28" height="28" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="512" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">n</text>

    <rect x="529" y="176" width="28" height="28" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="543" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">e</text>

    <rect x="560" y="176" width="28" height="28" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="574" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">s</text>

    <rect x="591" y="176" width="28" height="28" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="605" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">s</text>
  </g>

  <!-- ==================== BPE MERGE ARCS (BELOW CHARS) ==================== -->

  <!-- Group 1 arc: u,n → "un" -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    <path d="M 278,208 Q 296.5,235 315,208" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="55" stroke-dashoffset="55">
      <animate attributeName="stroke-dashoffset" values="55;0" dur="0.5s" begin="1.8s" fill="freeze"/>
    </path>
    <rect x="258" y="218" width="77" height="42" rx="4" fill="#fff" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
    <text x="296.5" y="233" text-anchor="middle" font-size="10" font-weight="600" fill="#3b82f6">u + n → un</text>
    <text x="296.5" y="248" text-anchor="middle" font-size="9" fill="#94a3b8">freq: 2</text>
  </g>

  <!-- Group 2 arc: h,a,p,p,i → "happi" -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.4s" fill="freeze"/>
    <path d="M 340,208 Q 405,252 470,208" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="145" stroke-dashoffset="145">
      <animate attributeName="stroke-dashoffset" values="145;0" dur="0.7s" begin="2.4s" fill="freeze"/>
    </path>
    <rect x="354" y="218" width="104" height="42" rx="4" fill="#fff" stroke="#10b981" stroke-width="1" opacity="0.9"/>
    <text x="406" y="233" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">h+a+p+p+i → happi</text>
    <text x="406" y="248" text-anchor="middle" font-size="9" fill="#94a3b8">4 merge steps</text>
  </g>

  <!-- Group 3 arc: n,e,s,s → "ness" -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.2s" fill="freeze"/>
    <path d="M 495,208 Q 544.5,240 595,208" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="115" stroke-dashoffset="115">
      <animate attributeName="stroke-dashoffset" values="115;0" dur="0.6s" begin="3.2s" fill="freeze"/>
    </path>
    <rect x="500" y="219" width="87" height="42" rx="4" fill="#fff" stroke="#8b5cf6" stroke-width="1" opacity="0.9"/>
    <text x="543.5" y="234" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">n+e+s+s → ness</text>
    <text x="543.5" y="249" text-anchor="middle" font-size="9" fill="#94a3b8">3 merge steps</text>
  </g>

  <!-- ==================== DOWNWARD CONNECTORS ==================== -->

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.4s" fill="freeze"/>
    <line x1="296.5" y1="265" x2="296.5" y2="330" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="293,327 296.5,337 300,327" fill="#3b82f6"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3s" fill="freeze"/>
    <line x1="406" y1="265" x2="406" y2="330" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="403,327 406,337 409,327" fill="#10b981"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.8s" fill="freeze"/>
    <line x1="544.5" y1="265" x2="544.5" y2="330" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="541.5,327 544.5,337 547.5,327" fill="#8b5cf6"/>
  </g>

  <!-- ==================== FINAL TOKENS ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.8s" fill="freeze"/>
    <text x="450" y="322" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">BPE Tokens</text>

    <rect x="246" y="340" width="100" height="36" rx="8" fill="#3b82f6" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
    <text x="296" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">un</text>

    <rect x="358" y="340" width="96" height="36" rx="8" fill="#10b981" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="406" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">happi</text>

    <rect x="470" y="340" width="84" height="36" rx="8" fill="#8b5cf6" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
    <text x="512" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ness</text>
  </g>

  <!-- ==================== TOKEN IDS ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.5s" fill="freeze"/>
    <text x="450" y="400" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Token IDs</text>

    <rect x="255" y="413" width="82" height="30" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="296" y="433" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">456</text>

    <rect x="365" y="413" width="82" height="30" rx="6" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
    <text x="406" y="433" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">18923</text>

    <rect x="478" y="413" width="68" height="30" rx="6" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="512" y="433" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">7234</text>
  </g>

  <!-- ==================== TOKENIZED OUTPUT ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="4.2s" fill="freeze"/>
    <text x="450" y="470" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Tokenized Output</text>
    <rect x="200" y="482" width="500" height="34" rx="8" fill="#fff5eb" stroke="#E95420" stroke-width="1.5"/>
    <text x="450" y="503" text-anchor="middle" font-size="13" font-weight="600" fill="#C34113">unhappiness → ["un", "happi", "ness"]</text>
  </g>

  <!-- ==================== BOTTOM NOTE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="5s" fill="freeze"/>
    <line x1="100" y1="550" x2="800" y2="550" stroke="#E95420" stroke-width="1" opacity="0.15"/>
    <text x="450" y="570" text-anchor="middle" font-size="10" fill="#94a3b8">BPE iteratively merges the most frequent character pairs, building a vocabulary of reusable subword units</text>
    <text x="450" y="586" text-anchor="middle" font-size="10" fill="#94a3b8">Balance between character-level (too fine) and word-level (too sparse) tokenization</text>
  </g>
</svg>
