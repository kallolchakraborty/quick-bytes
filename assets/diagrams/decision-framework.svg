<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <linearGradient id="genGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E95420"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>
    <linearGradient id="undGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="seqGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="900" height="780" fill="none"/>

  <!-- ==================== TITLE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#C34113">When to Use Which Model</text>
    <text x="450" y="48" text-anchor="middle" font-size="11" fill="#64748b">A decision framework for choosing the right LLM for your task</text>
    <line x1="200" y1="56" x2="700" y2="56" stroke="#E95420" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- ==================== COLUMN 1: TEXT GENERATION ==================== -->
  <!-- Header -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
    <rect x="20" y="75" width="280" height="48" rx="8" fill="url(#genGrad)" filter="url(#shadow)"/>
    <text x="40" y="98" font-size="13" font-weight="700" fill="#ffffff">Text Generation</text>
    <text x="40" y="115" font-size="9" fill="#fde8dc">Decoder-only (GPT-style)</text>
  </g>

  <!-- Gen Row 1: Self-host single GPU -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.9s" fill="freeze"/>
    <rect x="20" y="138" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="30" y="156" font-size="9" font-weight="600" fill="#475569">Self-host, 1 GPU</text>
    <text x="30" y="172" font-size="8" fill="#64748b">Single GPU, quantized 4-bit</text>
    <rect x="166" y="148" width="124" height="18" rx="9" fill="#E95420" opacity="0.1"/>
    <text x="228" y="161" text-anchor="middle" font-size="7" fill="#c34113" font-weight="600">Mistral 7B / LLaMA 8B</text>
    <rect x="166" y="170" width="124" height="18" rx="9" fill="#E95420" opacity="0.06"/>
    <text x="228" y="183" text-anchor="middle" font-size="7" fill="#c34113">4-bit ~4GB VRAM</text>
  </g>

  <!-- Gen Row 2: Self-host multi GPU -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.15s" fill="freeze"/>
    <rect x="20" y="198" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="30" y="216" font-size="9" font-weight="600" fill="#475569">Self-host, multi GPU</text>
    <text x="30" y="232" font-size="8" fill="#64748b">4+ A100 80GB or equivalent</text>
    <rect x="170" y="208" width="120" height="18" rx="9" fill="#E95420" opacity="0.1"/>
    <text x="230" y="221" text-anchor="middle" font-size="7" fill="#c34113" font-weight="600">LLaMA 3 70B / Mixtral 8x7B</text>
    <rect x="186" y="230" width="88" height="18" rx="9" fill="#E95420" opacity="0.06"/>
    <text x="230" y="243" text-anchor="middle" font-size="7" fill="#c34113">vLLM / TGI</text>
  </g>

  <!-- Gen Row 3: API multimodal -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.4s" fill="freeze"/>
    <rect x="20" y="258" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="30" y="276" font-size="9" font-weight="600" fill="#475569">API, multimodal</text>
    <text x="30" y="292" font-size="8" fill="#64748b">Text + image / audio / video</text>
    <rect x="176" y="268" width="114" height="18" rx="9" fill="#E95420" opacity="0.1"/>
    <text x="233" y="281" text-anchor="middle" font-size="7" fill="#c34113" font-weight="600">GPT-4o / Gemini 1.5 Pro</text>
    <rect x="190" y="290" width="86" height="18" rx="9" fill="#E95420" opacity="0.06"/>
    <text x="233" y="303" text-anchor="middle" font-size="7" fill="#c34113">Vision + Audio</text>
  </g>

  <!-- Gen Row 4: API general -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.65s" fill="freeze"/>
    <rect x="20" y="318" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="30" y="336" font-size="9" font-weight="600" fill="#475569">API, general purpose</text>
    <text x="30" y="352" font-size="8" fill="#64748b">Strongest overall quality</text>
    <rect x="182" y="328" width="108" height="18" rx="9" fill="#E95420" opacity="0.1"/>
    <text x="236" y="341" text-anchor="middle" font-size="7" fill="#c34113" font-weight="600">GPT-4 / Claude 3 Opus</text>
    <rect x="196" y="350" width="80" height="18" rx="9" fill="#E95420" opacity="0.06"/>
    <text x="236" y="363" text-anchor="middle" font-size="7" fill="#c34113">Best overall</text>
  </g>

  <!-- Gen Row 5: Long context -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.9s" fill="freeze"/>
    <rect x="20" y="378" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="30" y="396" font-size="9" font-weight="600" fill="#475569">Ultra-long context</text>
    <text x="30" y="412" font-size="8" fill="#64748b">200K+ token documents</text>
    <rect x="172" y="388" width="118" height="18" rx="9" fill="#E95420" opacity="0.1"/>
    <text x="231" y="401" text-anchor="middle" font-size="7" fill="#c34113" font-weight="600">Gemini 1.5 Pro / Claude 3</text>
    <rect x="186" y="410" width="90" height="18" rx="9" fill="#E95420" opacity="0.06"/>
    <text x="231" y="423" text-anchor="middle" font-size="7" fill="#c34113">1M+ / 200K ctx</text>
  </g>

  <!-- Gen Row 6: Code -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.15s" fill="freeze"/>
    <rect x="20" y="438" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="30" y="456" font-size="9" font-weight="600" fill="#475569">Code generation</text>
    <text x="30" y="472" font-size="8" fill="#64748b">Code completion, review, agent</text>
    <rect x="182" y="448" width="108" height="18" rx="9" fill="#E95420" opacity="0.1"/>
    <text x="236" y="461" text-anchor="middle" font-size="7" fill="#c34113" font-weight="600">GPT-4 / Claude 3.5 Sonnet</text>
    <rect x="200" y="470" width="72" height="18" rx="9" fill="#E95420" opacity="0.06"/>
    <text x="236" y="483" text-anchor="middle" font-size="7" fill="#c34113">Code Llama</text>
  </g>

  <!-- ==================== COLUMN 2: UNDERSTANDING ==================== -->
  <!-- Header -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    <rect x="310" y="75" width="280" height="48" rx="8" fill="url(#undGrad)" filter="url(#shadow)"/>
    <text x="330" y="98" font-size="13" font-weight="700" fill="#ffffff">Understanding &amp; Embeddings</text>
    <text x="330" y="115" font-size="9" fill="#dbeafe">Encoder-only (BERT-style)</text>
  </g>

  <!-- Und Row 1: RAG -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.3s" fill="freeze"/>
    <rect x="310" y="138" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="320" y="156" font-size="9" font-weight="600" fill="#475569">RAG / document retrieval</text>
    <text x="320" y="172" font-size="8" fill="#64748b">Semantic search, chunk retrieval</text>
    <rect x="464" y="148" width="116" height="18" rx="9" fill="#2563eb" opacity="0.1"/>
    <text x="522" y="161" text-anchor="middle" font-size="7" fill="#2563eb" font-weight="600">BERT (all-MiniLM-L6-v2)</text>
    <rect x="478" y="170" width="88" height="18" rx="9" fill="#2563eb" opacity="0.06"/>
    <text x="522" y="183" text-anchor="middle" font-size="7" fill="#2563eb">384-dim, 80MB</text>
  </g>

  <!-- Und Row 2: Classification -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.55s" fill="freeze"/>
    <rect x="310" y="198" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="320" y="216" font-size="9" font-weight="600" fill="#475569">Classification / NER / QA</text>
    <text x="320" y="232" font-size="8" fill="#64748b">Fine-tune for specific task</text>
    <rect x="464" y="208" width="116" height="18" rx="9" fill="#2563eb" opacity="0.1"/>
    <text x="522" y="221" text-anchor="middle" font-size="7" fill="#2563eb" font-weight="600">BERT / RoBERTa (fine-tuned)</text>
    <rect x="478" y="230" width="88" height="18" rx="9" fill="#2563eb" opacity="0.06"/>
    <text x="522" y="243" text-anchor="middle" font-size="7" fill="#2563eb">SOTA for understanding</text>
  </g>

  <!-- Und Row 3: Sentence similarity -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.8s" fill="freeze"/>
    <rect x="310" y="258" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="320" y="276" font-size="9" font-weight="600" fill="#475569">Sentence / text similarity</text>
    <text x="320" y="292" font-size="8" fill="#64748b">Clustering, dedup, matching</text>
    <rect x="474" y="268" width="106" height="18" rx="9" fill="#2563eb" opacity="0.1"/>
    <text x="527" y="281" text-anchor="middle" font-size="7" fill="#2563eb" font-weight="600">MiniLM / MPNet</text>
    <rect x="488" y="290" width="78" height="18" rx="9" fill="#2563eb" opacity="0.06"/>
    <text x="527" y="303" text-anchor="middle" font-size="7" fill="#2563eb">Sentence-BERT</text>
  </g>

  <!-- Und Row 4: Both gen + understanding -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.05s" fill="freeze"/>
    <rect x="310" y="318" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="320" y="336" font-size="9" font-weight="600" fill="#475569">Generation + understanding</text>
    <text x="320" y="352" font-size="8" fill="#64748b">One model for both tasks</text>
    <rect x="470" y="328" width="110" height="18" rx="9" fill="#2563eb" opacity="0.1"/>
    <text x="525" y="341" text-anchor="middle" font-size="7" fill="#2563eb" font-weight="600">Decoder-only (last hidden)</text>
    <rect x="484" y="350" width="82" height="18" rx="9" fill="#2563eb" opacity="0.06"/>
    <text x="525" y="363" text-anchor="middle" font-size="7" fill="#2563eb">LLaMA / Mistral</text>
  </g>

  <!-- Und Row 5: Sentiment -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.3s" fill="freeze"/>
    <rect x="310" y="378" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="320" y="396" font-size="9" font-weight="600" fill="#475569">Lightweight / edge inference</text>
    <text x="320" y="412" font-size="8" fill="#64748b">Latency-sensitive, low-resource</text>
    <rect x="470" y="388" width="110" height="18" rx="9" fill="#2563eb" opacity="0.1"/>
    <text x="525" y="401" text-anchor="middle" font-size="7" fill="#2563eb" font-weight="600">DistilBERT / ELECTRA</text>
    <rect x="484" y="410" width="82" height="18" rx="9" fill="#2563eb" opacity="0.06"/>
    <text x="525" y="423" text-anchor="middle" font-size="7" fill="#2563eb">60% smaller, 95% perf</text>
  </g>

  <!-- ==================== COLUMN 3: SEQ2SEQ ==================== -->
  <!-- Header -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1s" fill="freeze"/>
    <rect x="600" y="75" width="280" height="48" rx="8" fill="url(#seqGrad)" filter="url(#shadow)"/>
    <text x="620" y="98" font-size="13" font-weight="700" fill="#ffffff">Seq2Seq Tasks</text>
    <text x="620" y="115" font-size="9" fill="#ede9fe">Encoder-decoder (T5-style)</text>
  </g>

  <!-- Seq Row 1: Translation -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.7s" fill="freeze"/>
    <rect x="600" y="138" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="610" y="156" font-size="9" font-weight="600" fill="#475569">Machine translation</text>
    <text x="610" y="172" font-size="8" fill="#64748b">Multilingual, many language pairs</text>
    <rect x="754" y="148" width="116" height="18" rx="9" fill="#7c3aed" opacity="0.1"/>
    <text x="812" y="161" text-anchor="middle" font-size="7" fill="#7c3aed" font-weight="600">T5 / mT5 / NLLB</text>
    <rect x="768" y="170" width="88" height="18" rx="9" fill="#7c3aed" opacity="0.06"/>
    <text x="812" y="183" text-anchor="middle" font-size="7" fill="#7c3aed">200+ languages</text>
  </g>

  <!-- Seq Row 2: Summarization -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.95s" fill="freeze"/>
    <rect x="600" y="198" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="610" y="216" font-size="9" font-weight="600" fill="#475569">Text summarization</text>
    <text x="610" y="232" font-size="8" fill="#64748b">Abstractive, extractive</text>
    <rect x="760" y="208" width="110" height="18" rx="9" fill="#7c3aed" opacity="0.1"/>
    <text x="815" y="221" text-anchor="middle" font-size="7" fill="#7c3aed" font-weight="600">BART / T5 / Pegasus</text>
    <rect x="774" y="230" width="82" height="18" rx="9" fill="#7c3aed" opacity="0.06"/>
    <text x="815" y="243" text-anchor="middle" font-size="7" fill="#7c3aed">Dedicated task</text>
  </g>

  <!-- Seq Row 3: Text-to-SQL -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.2s" fill="freeze"/>
    <rect x="600" y="258" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="610" y="276" font-size="9" font-weight="600" fill="#475569">Text-to-SQL / structured</text>
    <text x="610" y="292" font-size="8" fill="#64748b">Natural language → query</text>
    <rect x="770" y="268" width="100" height="18" rx="9" fill="#7c3aed" opacity="0.1"/>
    <text x="820" y="281" text-anchor="middle" font-size="7" fill="#7c3aed" font-weight="600">T5 / CodeT5</text>
    <rect x="784" y="290" width="72" height="18" rx="9" fill="#7c3aed" opacity="0.06"/>
    <text x="820" y="303" text-anchor="middle" font-size="7" fill="#7c3aed">Spider benchmark</text>
  </g>

  <!-- Seq Row 4: Question gen -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.45s" fill="freeze"/>
    <rect x="600" y="318" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="610" y="336" font-size="9" font-weight="600" fill="#475569">Question generation / QA</text>
    <text x="610" y="352" font-size="8" fill="#64748b">Generate Q&A pairs from text</text>
    <rect x="764" y="328" width="106" height="18" rx="9" fill="#7c3aed" opacity="0.1"/>
    <text x="817" y="341" text-anchor="middle" font-size="7" fill="#7c3aed" font-weight="600">T5 / BART</text>
    <rect x="778" y="350" width="78" height="18" rx="9" fill="#7c3aed" opacity="0.06"/>
    <text x="817" y="363" text-anchor="middle" font-size="7" fill="#7c3aed">Fine-tune on SQuAD</text>
  </g>

  <!-- Seq Row 5: Paraphrasing -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.7s" fill="freeze"/>
    <rect x="600" y="378" width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="610" y="396" font-size="9" font-weight="600" fill="#475569">Paraphrasing / rewriting</text>
    <text x="610" y="412" font-size="8" fill="#64748b">Style transfer, simplification</text>
    <rect x="766" y="388" width="104" height="18" rx="9" fill="#7c3aed" opacity="0.1"/>
    <text x="818" y="401" text-anchor="middle" font-size="7" fill="#7c3aed" font-weight="600">T5 / BART</text>
    <rect x="780" y="410" width="76" height="18" rx="9" fill="#7c3aed" opacity="0.06"/>
    <text x="818" y="423" text-anchor="middle" font-size="7" fill="#7c3aed">Style transfer</text>
  </g>

  <!-- ==================== FOOTER LEGEND ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3s" fill="freeze"/>
    <rect x="20" y="510" width="860" height="2" rx="1" fill="#E95420" opacity="0.2"/>
    <rect x="20" y="530" width="12" height="12" rx="3" fill="url(#genGrad)"/>
    <text x="38" y="541" font-size="9" fill="#64748b">Decoder-only (generation)</text>
    <rect x="200" y="530" width="12" height="12" rx="3" fill="url(#undGrad)"/>
    <text x="218" y="541" font-size="9" fill="#64748b">Encoder-only (understanding)</text>
    <rect x="430" y="530" width="12" height="12" rx="3" fill="url(#seqGrad)"/>
    <text x="448" y="541" font-size="9" fill="#64748b">Encoder-decoder (seq2seq)</text>
  </g>

  <!-- Cross-column notes -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.3s" fill="freeze"/>
    <text x="450" y="568" text-anchor="middle" font-size="9" fill="#94a3b8">Tip: For most applications, start with a decoder-only model — they generate, embed, classify, and reason.</text>
    <text x="450" y="585" text-anchor="middle" font-size="9" fill="#94a3b8">Encoder-only still wins for pure understanding at minimal cost; T5 excels at structured seq2seq tasks.</text>
  </g>

  <!-- Key badges at bottom -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.6s" fill="freeze"/>
    <rect x="80" y="610" width="150" height="26" rx="13" fill="#E95420" opacity="0.08"/>
    <text x="155" y="628" text-anchor="middle" font-size="9" fill="#c34113" font-weight="600">Best open-weight → LLaMA 3 405B</text>
    <rect x="250" y="610" width="160" height="26" rx="13" fill="#2563eb" opacity="0.08"/>
    <text x="330" y="628" text-anchor="middle" font-size="9" fill="#2563eb" font-weight="600">Best embeddings → BERT / MiniLM</text>
    <rect x="430" y="610" width="150" height="26" rx="13" fill="#E95420" opacity="0.08"/>
    <text x="505" y="628" text-anchor="middle" font-size="9" fill="#c34113" font-weight="600">Best multimodal → GPT-4o / Gemini</text>
    <rect x="600" y="610" width="150" height="26" rx="13" fill="#E95420" opacity="0.08"/>
    <text x="675" y="628" text-anchor="middle" font-size="9" fill="#c34113" font-weight="600">Best long context → Gemini 1.5 Pro</text>
    <rect x="770" y="610" width="110" height="26" rx="13" fill="#7c3aed" opacity="0.08"/>
    <text x="825" y="628" text-anchor="middle" font-size="9" fill="#7c3aed" font-weight="600">Edge → Mistral 7B Q4</text>
  </g>
</svg>