<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Ubuntu', sans-serif; }
  </style>
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e95420"/>
      <stop offset="100%" stop-color="#c34113"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" rx="8" fill="var(--bg-subtle, #f8fafc)" opacity="0.5"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Dense Models</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="var(--text-muted, #64748b)">All Parameters Active for Every Token — Full Capacity Always Used</text>

  <!-- Section labels -->
  <rect x="30" y="80" width="180" height="22" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="50" y="95" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">INPUT TOKEN</text>

  <rect x="30" y="200" width="220" height="22" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="50" y="215" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">DENSE TRANSFORMER LAYERS</text>

  <rect x="30" y="480" width="180" height="22" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="50" y="495" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">OUTPUT</text>

  <!-- ==================== INPUT TOKEN ==================== -->
  <rect x="380" y="108" width="140" height="60" rx="8" fill="#ffffff" stroke="var(--brand-default, #e95420)" stroke-width="2" filter="url(#shadow1)">
    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="136" text-anchor="middle" font-size="14" font-weight="600" fill="var(--text-default, #0f172a)">Input Token</text>
  <text x="450" y="154" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">e.g. &quot;The&quot;</text>

  <!-- Down arrow -->
  <line x1="450" y1="168" x2="450" y2="210" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5"/>
  <polygon points="450,210 446,202 454,202" fill="var(--border-default, #e2e8f0)"/>

  <!-- ==================== DENSE FFN LAYER ==================== -->
  <rect x="55" y="220" width="790" height="240" rx="10" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="450" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="var(--brand-default, #e95420)">xN Dense Transformer Layers (All Neurons Active)</text>

  <!-- Layer columns -->
  <text x="105" y="278" font-size="9" fill="var(--text-muted, #64748b)" text-anchor="middle">d_model</text>
  <text x="450" y="315" font-size="9" fill="var(--text-muted, #64748b)" text-anchor="middle">Hidden (4 x d_ff)</text>
  <text x="780" y="278" font-size="9" fill="var(--text-muted, #64748b)" text-anchor="middle">d_model</text>

  <!-- Connections between layers -->
  <g stroke="rgba(233,84,32,0.04)" stroke-width="0.8">
    <line x1="120" y1="340" x2="120" y2="290"/><line x1="120" y1="340" x2="180" y2="290"/>
    <line x1="120" y1="340" x2="240" y2="290"/><line x1="120" y1="340" x2="300" y2="290"/>
    <line x1="120" y1="340" x2="360" y2="290"/><line x1="120" y1="340" x2="420" y2="290"/>
    <line x1="120" y1="340" x2="480" y2="290"/><line x1="120" y1="340" x2="540" y2="290"/>
    <line x1="120" y1="340" x2="600" y2="290"/><line x1="120" y1="340" x2="660" y2="290"/>
    <line x1="120" y1="340" x2="720" y2="290"/><line x1="120" y1="340" x2="780" y2="290"/>
    <line x1="780" y1="290" x2="120" y2="400"/><line x1="780" y1="290" x2="180" y2="400"/>
    <line x1="780" y1="290" x2="240" y2="400"/><line x1="780" y1="290" x2="300" y2="400"/>
    <line x1="780" y1="290" x2="360" y2="400"/><line x1="780" y1="290" x2="420" y2="400"/>
    <line x1="780" y1="290" x2="480" y2="400"/><line x1="780" y1="290" x2="540" y2="400"/>
    <line x1="780" y1="290" x2="600" y2="400"/><line x1="780" y1="290" x2="660" y2="400"/>
    <line x1="780" y1="290" x2="720" y2="400"/><line x1="780" y1="290" x2="780" y2="400"/>
  </g>

  <!-- Input neurons -->
  <g>
    <circle cx="120" cy="340" r="10" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1">
      <animate attributeName="r" values="10;12;10" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="340" r="10" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1"/>
    <circle cx="240" cy="340" r="10" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1"/>
    <circle cx="300" cy="340" r="10" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1"/>
    <circle cx="360" cy="340" r="10" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1"/>
    <circle cx="420" cy="340" r="10" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1"/>
  </g>

  <!-- Hidden neurons (all active, larger) -->
  <g>
    <circle cx="120" cy="290" r="14" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1.5"/>
    <circle cx="180" cy="290" r="14" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1.5"/>
    <circle cx="240" cy="290" r="14" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1.5"/>
    <circle cx="300" cy="290" r="14" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1.5"/>
    <circle cx="360" cy="290" r="14" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1.5"/>
    <circle cx="420" cy="290" r="14" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1.5"/>
    <circle cx="480" cy="290" r="14" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1.5"/>
    <circle cx="540" cy="290" r="14" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1.5"/>
    <circle cx="600" cy="290" r="14" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1.5"/>
    <circle cx="660" cy="290" r="14" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1.5"/>
    <circle cx="720" cy="290" r="14" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1.5"/>
    <circle cx="780" cy="290" r="14" fill="rgba(233,84,32,0.15)" stroke="#e95420" stroke-width="1.5"/>
  </g>

  <!-- Animated pulse through neurons -->
  <g>
    <circle cx="120" cy="290" r="14" fill="none" stroke="#e95420" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;20;14" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="290" r="14" fill="none" stroke="#e95420" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;20;14" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="290" r="14" fill="none" stroke="#e95420" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;20;14" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="290" r="14" fill="none" stroke="#e95420" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;20;14" dur="3s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Output neurons -->
  <g>
    <circle cx="120" cy="400" r="10" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1"/>
    <circle cx="180" cy="400" r="10" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1"/>
    <circle cx="240" cy="400" r="10" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1"/>
    <circle cx="300" cy="400" r="10" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1"/>
    <circle cx="360" cy="400" r="10" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1"/>
    <circle cx="420" cy="400" r="10" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1"/>
  </g>

  <!-- Highlight box -->
  <rect x="480" y="265" width="310" height="36" rx="6" fill="rgba(233,84,32,0.06)"/>
  <text x="495" y="282" font-size="10" font-weight="600" fill="#e95420">100% of parameters active per token</text>
  <text x="495" y="296" font-size="9" fill="var(--text-muted, #64748b)">No routing — every neuron fires for every input</text>

  <rect x="480" y="380" width="310" height="36" rx="6" fill="rgba(233,84,32,0.06)"/>
  <text x="495" y="397" font-size="10" font-weight="600" fill="#e95420">Total Params = Active Params</text>
  <text x="495" y="411" font-size="9" fill="var(--text-muted, #64748b)">Simple, predictable, full capacity</text>

  <!-- ==================== OUTPUT ==================== -->
  <line x1="450" y1="460" x2="450" y2="495" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5"/>
  <polygon points="450,495 446,487 454,487" fill="var(--border-default, #e2e8f0)"/>

  <rect x="380" y="505" width="140" height="60" rx="8" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="450" y="533" text-anchor="middle" font-size="14" font-weight="600" fill="var(--text-default, #0f172a)">Output Token</text>
  <text x="450" y="551" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Contextualized</text>

  <!-- Example box -->
  <rect x="120" y="600" width="660" height="55" rx="8" fill="rgba(233,84,32,0.04)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
  <text x="160" y="620" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">Examples</text>
  <text x="160" y="638" font-size="10" fill="var(--text-muted, #64748b)">LLaMA 3 (8B, 70B, 405B), Mistral 7B, BERT, T5 — full parameter count active every forward pass.</text>
</svg>