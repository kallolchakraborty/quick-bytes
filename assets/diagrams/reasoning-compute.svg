<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <linearGradient id="trainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c34113"/>
      <stop offset="100%" stop-color="#e95420"/>
    </linearGradient>
    <linearGradient id="testGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="900" height="650" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Train-Time Compute vs Test-Time Compute</text>
    <line x1="200" y1="36" x2="700" y2="36" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="55" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Reasoning models (o1, o3, R1) scale compute at inference time</text>
  </g>

  <!-- ==================== LEFT: TRAIN-TIME COMPUTE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <rect x="20" y="72" width="420" height="34" rx="8" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="230" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="var(--brand-default, #e95420)">TRAIN-TIME COMPUTE (Traditional)</text>

    <rect x="20" y="115" width="420" height="225" rx="10" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>

    <!-- Step 1 -->
    <circle cx="50" cy="142" r="12" fill="url(#trainGrad)"/>
    <text x="50" y="147" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="72" y="142" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">Scale Model Size</text>
    <text x="72" y="158" font-size="9" fill="var(--text-muted, #64748b)">Larger models (more parameters) = more capability</text>

    <!-- Hardware scaling icon -->
    <rect x="50" y="170" width="160" height="24" rx="4" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="130" y="186" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">GPU count: 1K → 10K → 100K</text>

    <!-- Step 2 -->
    <circle cx="50" cy="210" r="12" fill="url(#trainGrad)"/>
    <text x="50" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="72" y="210" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">Scale Training Data</text>
    <text x="72" y="226" font-size="9" fill="var(--text-muted, #64748b)">More tokens = broader knowledge, better patterns</text>

    <rect x="50" y="238" width="160" height="24" rx="4" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="130" y="254" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Data: 300B → 1T → 15T tokens</text>

    <!-- Step 3 -->
    <circle cx="50" cy="278" r="12" fill="url(#trainGrad)"/>
    <text x="50" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="72" y="278" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">Cost: Upfront Investment</text>
    <text x="72" y="294" font-size="9" fill="var(--text-muted, #64748b)">Single training run: $10M - $100M+</text>

    <text x="230" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#c34113">Capability from Parameters × Data</text>
  </g>

  <!-- ==================== RIGHT: TEST-TIME COMPUTE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/>
    <rect x="460" y="72" width="420" height="34" rx="8" fill="rgba(37,99,235,0.06)"/>
    <text x="670" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">TEST-TIME COMPUTE (Reasoning Models)</text>

    <rect x="460" y="115" width="420" height="225" rx="10" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="1" filter="url(#shadow)"/>

    <!-- Step 1 -->
    <circle cx="490" cy="142" r="12" fill="url(#testGrad)"/>
    <text x="490" y="147" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="512" y="142" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">Chain-of-Thought Reasoning</text>
    <text x="512" y="158" font-size="9" fill="var(--text-muted, #64748b)">Model "thinks" step-by-step before answering</text>

    <!-- COT visualization -->
    <rect x="490" y="168" width="200" height="40" rx="4" fill="var(--bg-subtle, #f8fafc)" stroke="#2563eb" stroke-width="0.5"/>
    <text x="500" y="183" font-size="9" fill="var(--text-muted, #64748b)">Let me solve this step by step...</text>
    <text x="500" y="198" font-size="9" fill="var(--text-muted, #64748b)">Step 1: ... Step 2: ... Step N: ...</text>

    <!-- Step 2 -->
    <circle cx="490" cy="225" r="12" fill="url(#testGrad)"/>
    <text x="490" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="512" y="225" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">Self-Correction &amp; Backtracking</text>
    <text x="512" y="241" font-size="9" fill="var(--text-muted, #64748b)">Detects errors in reasoning, backtracks, retries</text>

    <rect x="490" y="250" width="200" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="0.5"/>
    <text x="500" y="266" font-size="9" fill="#dc2626" font-weight="500">Wait, that's wrong. Let me reconsider...</text>

    <!-- Step 3 -->
    <circle cx="490" cy="290" r="12" fill="url(#testGrad)"/>
    <text x="490" y="295" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="512" y="290" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">Cost: Per-Query</text>
    <text x="512" y="306" font-size="9" fill="var(--text-muted, #64748b)">$0.01 - $1+ per query (more tokens = more cost)</text>

    <text x="670" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">Capability from Thinking Tokens × Iterations</text>
  </g>

  <!-- ==================== COMPARISON TABLE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze"/>
    <line x1="20" y1="358" x2="880" y2="358" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <text x="450" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text-default, #0f172a)">Comparison</text>

    <!-- Table header -->
    <rect x="80" y="392" width="170" height="28" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="165" y="411" text-anchor="middle" font-size="10" font-weight="600" fill="var(--brand-default, #e95420)">Dimension</text>
    <rect x="250" y="392" width="280" height="28" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="390" y="411" text-anchor="middle" font-size="10" font-weight="600" fill="var(--brand-default, #e95420)">Train-Time Compute</text>
    <rect x="530" y="392" width="290" height="28" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="675" y="411" text-anchor="middle" font-size="10" font-weight="600" fill="var(--brand-default, #e95420)">Test-Time Compute</text>

    <!-- Row 1: When -->
    <rect x="80" y="422" width="170" height="24" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="165" y="438" text-anchor="middle" font-size="10" fill="var(--text-default, #0f172a)">When</text>
    <rect x="250" y="422" width="280" height="24" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="390" y="438" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Pre-training / Fine-tuning</text>
    <rect x="530" y="422" width="290" height="24" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="675" y="438" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Inference / Generation</text>

    <!-- Row 2: What it buys -->
    <rect x="80" y="448" width="170" height="24" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="165" y="464" text-anchor="middle" font-size="10" fill="var(--text-default, #0f172a)">What it buys</text>
    <rect x="250" y="448" width="280" height="24" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="390" y="464" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Knowledge, patterns, capability</text>
    <rect x="530" y="448" width="290" height="24" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="675" y="464" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Task-level reasoning, accuracy</text>

    <!-- Row 3: Cost -->
    <rect x="80" y="474" width="170" height="24" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="165" y="490" text-anchor="middle" font-size="10" fill="var(--text-default, #0f172a)">Cost</text>
    <rect x="250" y="474" width="280" height="24" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="390" y="490" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Upfront ($10M+)</text>
    <rect x="530" y="474" width="290" height="24" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="675" y="490" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Per-query ($0.01 - $1+)</text>

    <!-- Row 4: Scaling -->
    <rect x="80" y="500" width="170" height="24" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="165" y="516" text-anchor="middle" font-size="10" fill="var(--text-default, #0f172a)">Scaling axis</text>
    <rect x="250" y="500" width="280" height="24" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="390" y="516" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Model size × data tokens</text>
    <rect x="530" y="500" width="290" height="24" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="675" y="516" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Thinking tokens × iterations</text>

    <!-- Row 5: Example models -->
    <rect x="80" y="526" width="170" height="24" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="165" y="542" text-anchor="middle" font-size="10" fill="var(--text-default, #0f172a)">Example models</text>
    <rect x="250" y="526" width="280" height="24" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="390" y="542" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">GPT-3, GPT-4, LLaMA, BERT</text>
    <rect x="530" y="526" width="290" height="24" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="675" y="542" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">o1, o3, DeepSeek-R1, Gemini-Thinking</text>
  </g>

  <!-- ==================== KEY INSIGHT BOTTOM ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
    <line x1="20" y1="565" x2="880" y2="565" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <rect x="100" y="580" width="700" height="55" rx="10" fill="var(--brand-light, rgba(233,84,32,0.06))" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="450" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="var(--brand-default, #e95420)">Paradigm Shift: Scaling at Inference Time</text>
    <text x="450" y="620" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Reasoning models trade latency for accuracy — think 10-100 seconds for hard problems.</text>
    <text x="450" y="636" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Staff+ insight: Best results combine both — a strong base model (train-time) + reasoning (test-time).</text>
  </g>
</svg>
