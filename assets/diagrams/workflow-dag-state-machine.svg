<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <filter id="shadowActive">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#e95420" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#059669"/>
    </marker>
  </defs>

  <rect width="900" height="650" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Workflow DAG &amp; State Machine</text>
    <line x1="280" y1="36" x2="620" y2="36" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="54" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Each workflow node executes as a state machine with recovery</text>
  </g>

  <!-- LEFT SIDE: DAG -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>
    <!-- DAG Label -->
    <rect x="30" y="65" width="90" height="22" rx="5" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="75" y="80" text-anchor="middle" font-size="10" font-weight="600" fill="var(--brand-default, #e95420)">WORKFLOW DAG</text>
  </g>

  <!-- Node A: Data Ingestion -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    <rect x="60" y="100" width="140" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="60" y="100" width="140" height="24" rx="8" fill="#94a3b8"/>
    <rect x="60" y="116" width="140" height="8" fill="#94a3b8"/>
    <text x="130" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">A: Data Ingestion</text>
    <text x="130" y="140" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Pending</text>
    <!-- Status dot -->
    <circle cx="180" cy="108" r="4" fill="#e95420">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Node B: Embedding -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
    <rect x="60" y="195" width="140" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="60" y="195" width="140" height="24" rx="8" fill="#94a3b8"/>
    <rect x="60" y="211" width="140" height="8" fill="#94a3b8"/>
    <text x="130" y="213" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">B: Embedding</text>
    <text x="130" y="235" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Pending</text>
  </g>

  <!-- Node C: Vector Search -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.7s" fill="freeze"/>
    <rect x="60" y="290" width="140" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="60" y="290" width="140" height="24" rx="8" fill="#94a3b8"/>
    <rect x="60" y="306" width="140" height="8" fill="#94a3b8"/>
    <text x="130" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">C: Vector Search</text>
    <text x="130" y="330" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Pending</text>
  </g>

  <!-- Node D: LLM Call -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    <rect x="60" y="385" width="140" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="60" y="385" width="140" height="24" rx="8" fill="#94a3b8"/>
    <rect x="60" y="401" width="140" height="8" fill="#94a3b8"/>
    <text x="130" y="403" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">D: LLM Call</text>
    <text x="130" y="425" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Pending</text>
  </g>

  <!-- Node E: Output Formatting -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
    <rect x="60" y="480" width="140" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="60" y="480" width="140" height="24" rx="8" fill="#94a3b8"/>
    <rect x="60" y="496" width="140" height="8" fill="#94a3b8"/>
    <text x="130" y="498" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">E: Output Formatting</text>
    <text x="130" y="520" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Pending</text>
  </g>

  <!-- DAG Edges (dependencies) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/>
    <!-- A → B -->
    <line x1="130" y1="160" x2="130" y2="195" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
    <!-- B → C -->
    <line x1="130" y1="255" x2="130" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
    <!-- C → D -->
    <line x1="130" y1="350" x2="130" y2="385" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
    <!-- D → E -->
    <line x1="130" y1="445" x2="130" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  </g>

  <!-- Animated execution path (traveling dot through DAG) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/>
    <!-- Traveling dot A→B -->
    <circle cx="130" cy="160" r="5" fill="#e95420" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;195" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Traveling dot B→C -->
    <circle cx="130" cy="255" r="5" fill="#e95420" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="255;290" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Traveling dot C→D -->
    <circle cx="130" cy="350" r="5" fill="#e95420" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="5.5s" begin="1.0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="350;385" dur="5.5s" begin="1.0s" repeatCount="indefinite"/>
    </circle>
    <!-- Traveling dot D→E -->
    <circle cx="130" cy="445" r="5" fill="#e95420" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="6.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="445;480" dur="6.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- RIGHT SIDE: State Machine -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>
    <rect x="630" y="65" width="110" height="22" rx="5" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="685" y="80" text-anchor="middle" font-size="10" font-weight="600" fill="var(--brand-default, #e95420)">NODE STATE MACHINE</text>
  </g>

  <!-- State: Pending -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    <ellipse cx="710" cy="120" rx="65" ry="24" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <text x="710" y="125" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">PENDING</text>
    <text x="760" y="118" font-size="8" fill="var(--text-muted, #64748b)">Start</text>
  </g>

  <!-- State: Running -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.7s" fill="freeze"/>
    <ellipse cx="710" cy="200" rx="65" ry="24" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <text x="710" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">RUNNING</text>
  </g>

  <!-- State: Completed -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
    <ellipse cx="710" cy="280" rx="65" ry="24" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <text x="710" y="285" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">COMPLETED</text>
  </g>

  <!-- State: Failed (with retry) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <ellipse cx="710" cy="360" rx="65" ry="24" fill="var(--bg-default, #ffffff)" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="710" y="350" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">FAILED</text>
    <text x="710" y="365" text-anchor="middle" font-size="8" fill="#dc2626">(retry n)</text>
  </g>

  <!-- State: Dead Letter -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>
    <ellipse cx="710" cy="430" rx="65" ry="24" fill="var(--bg-default, #ffffff)" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,2" filter="url(#shadow)"/>
    <text x="710" y="435" text-anchor="middle" font-size="9" font-weight="600" fill="#7c3aed">DEAD LETTER</text>
  </g>

  <!-- State Machine Transition Arrows -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
    <!-- Pending → Running -->
    <path d="M 680 144 Q 660 160 680 176" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <text x="650" y="163" font-size="8" fill="#2563eb" font-weight="600">dispatch</text>
    <!-- Running → Completed -->
    <path d="M 680 224 Q 660 240 680 256" stroke="#059669" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <text x="650" y="243" font-size="8" fill="#059669" font-weight="600">success</text>
    <!-- Running → Failed -->
    <path d="M 755 224 Q 775 260 755 336" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <text x="780" y="280" font-size="8" fill="#dc2626" font-weight="600">error</text>
    <!-- Failed → Running (retry) -->
    <path d="M 740 384 Q 775 400 755 224" stroke="#e95420" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.6s" repeatCount="indefinite"/>
    </path>
    <text x="790" y="310" font-size="8" fill="#e95420" font-weight="600">retry</text>
    <!-- Failed → Dead Letter -->
    <path d="M 680 384 Q 660 400 680 406" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <text x="650" y="400" font-size="8" fill="#7c3aed" font-weight="600">max retries</text>
  </g>

  <!-- Bottom legend -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/>
    <line x1="50" y1="545" x2="850" y2="545" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="565" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text-default, #0f172a)">Key Principles</text>

    <rect x="50" y="580" width="250" height="24" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="175" y="596" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Each node is an idempotent state machine</text>

    <rect x="325" y="580" width="250" height="24" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="450" y="596" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Recoverable from any intermediate state</text>

    <rect x="600" y="580" width="250" height="24" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="725" y="596" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Deterministic replay for debugging</text>
  </g>
</svg>