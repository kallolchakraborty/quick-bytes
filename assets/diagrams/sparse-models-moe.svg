<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Ubuntu', sans-serif; }
  </style>
  <defs>
    <linearGradient id="routerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="expertGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e95420"/>
      <stop offset="100%" stop-color="#c34113"/>
    </linearGradient>
    <linearGradient id="expertGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="expertGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="expertGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" rx="8" fill="var(--bg-subtle, #f8fafc)" opacity="0.5"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Sparse Models (Mixture of Experts / MoE)</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="var(--text-muted, #64748b)">Router-Selected Expert Activation — More Capacity per FLOP</text>

  <!-- Section labels -->
  <rect x="30" y="80" width="180" height="22" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="50" y="95" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">INPUT TOKEN</text>

  <rect x="30" y="195" width="180" height="22" rx="4" fill="rgba(124,58,237,0.06)"/>
  <text x="50" y="210" font-size="11" font-weight="600" fill="#7c3aed">ROUTER / GATE</text>

  <rect x="30" y="345" width="180" height="22" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="50" y="360" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">EXPERTS (E₁–E₈)</text>

  <rect x="30" y="555" width="180" height="22" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="50" y="570" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">OUTPUT TOKEN</text>

  <!-- ==================== INPUT TOKEN ==================== -->
  <rect x="380" y="105" width="140" height="60" rx="8" fill="#ffffff" stroke="var(--brand-default, #e95420)" stroke-width="2" filter="url(#shadow1)">
    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="var(--text-default, #0f172a)">Input Token</text>
  <text x="450" y="151" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">e.g. &quot;The&quot;</text>

  <!-- Down arrow to router -->
  <line x1="450" y1="165" x2="450" y2="200" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5"/>
  <polygon points="450,200 446,192 454,192" fill="var(--border-default, #e2e8f0)"/>

  <!-- ==================== ROUTER / GATE ==================== -->
  <rect x="300" y="210" width="300" height="110" rx="12" fill="rgba(124,58,237,0.06)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow1)">
    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">Router / Gate Network</text>
  <text x="450" y="256" text-anchor="middle" font-size="10" fill="#7c3aed">Learned linear layer + softmax</text>

  <!-- Router weights visualization -->
  <g>
    <rect x="330" y="270" width="60" height="18" rx="4" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1"/>
    <text x="360" y="283" text-anchor="middle" font-size="8" font-weight="600" fill="#6d28d9">Top-1</text>
    <rect x="420" y="270" width="60" height="18" rx="4" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="450" y="283" text-anchor="middle" font-size="8" font-weight="600" fill="#6d28d9">Top-2</text>
    <rect x="510" y="270" width="60" height="18" rx="4" fill="rgba(124,58,237,0.04)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="540" y="283" text-anchor="middle" font-size="8" font-weight="600" fill="var(--text-muted, #64748b)">Top-8</text>
  </g>
  <text x="450" y="308" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Selects top-k experts (typically k=2)</text>

  <!-- Weight distribution label -->
  <text x="680" y="240" font-size="9" fill="var(--text-muted, #64748b)">Routing weights:</text>
  <rect x="680" y="248" width="36" height="14" rx="3" fill="rgba(233,84,32,0.12)"/>
  <text x="698" y="258" text-anchor="middle" font-size="7" fill="#c34113">0.7</text>
  <rect x="720" y="248" width="36" height="14" rx="3" fill="rgba(37,99,235,0.12)"/>
  <text x="738" y="258" text-anchor="middle" font-size="7" fill="#1d4ed8">0.3</text>
  <text x="680" y="280" font-size="8" fill="var(--text-muted, #64748b)">softmax over</text>
  <text x="680" y="292" font-size="8" fill="var(--text-muted, #64748b)">8 experts</text>

  <!-- Lines from router to experts -->
  <g stroke="var(--border-default, #e2e8f0)" stroke-width="1.2" stroke-linecap="round">
    <!-- Active paths -->
    <line x1="340" y1="320" x2="140" y2="400"/>
    <line x1="440" y1="320" x2="340" y2="400"/>
    <!-- Inactive paths (dashed) -->
    <line x1="460" y1="320" x2="460" y2="400" stroke-dasharray="4 3" opacity="0.3"/>
    <line x1="520" y1="320" x2="580" y2="400" stroke-dasharray="4 3" opacity="0.3"/>
    <line x1="560" y1="320" x2="780" y2="400" stroke-dasharray="4 3" opacity="0.3"/>
  </g>

  <!-- Active routing highlights -->
  <g stroke="#7c3aed" stroke-width="2" opacity="0">
    <line x1="340" y1="320" x2="140" y2="400" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="440" y1="320" x2="340" y2="400" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Routing probability badges -->
  <rect x="200" y="355" width="50" height="18" rx="9" fill="rgba(233,84,32,0.12)"/>
  <text x="225" y="367" text-anchor="middle" font-size="9" font-weight="600" fill="#c34113">p=0.7</text>
  <rect x="380" y="355" width="50" height="18" rx="9" fill="rgba(37,99,235,0.12)"/>
  <text x="405" y="367" text-anchor="middle" font-size="9" font-weight="600" fill="#1d4ed8">p=0.3</text>

  <!-- ==================== EXPERTS ==================== -->
  <!-- Expert row -->
  <g>
    <!-- Expert 1 (active) -->
    <rect x="95" y="385" width="90" height="90" rx="10" fill="#ffffff" stroke="#e95420" stroke-width="2" filter="url(#shadow1)">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="140" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#c34113">E₁</text>
    <text x="140" y="440" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Linguistics</text>
    <text x="140" y="455" text-anchor="middle" font-size="8" fill="#e95420" font-weight="600">ACTIVE</text>

    <!-- Expert 2 (active) -->
    <rect x="295" y="385" width="90" height="90" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow1)">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="340" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">E₂</text>
    <text x="340" y="440" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Reasoning</text>
    <text x="340" y="455" text-anchor="middle" font-size="8" fill="#2563eb" font-weight="600">ACTIVE</text>

    <!-- Expert 3 (inactive) -->
    <rect x="495" y="385" width="90" height="90" rx="10" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1" stroke-dasharray="4 3" filter="url(#shadow1)" opacity="0.5"/>
    <text x="540" y="420" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text-muted, #64748b)">E₃</text>
    <text x="540" y="440" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Code</text>
    <text x="540" y="455" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">idle</text>

    <!-- Expert 4 (inactive) -->
    <rect x="695" y="385" width="90" height="90" rx="10" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1" stroke-dasharray="4 3" filter="url(#shadow1)" opacity="0.5"/>
    <text x="740" y="420" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text-muted, #64748b)">E₄</text>
    <text x="740" y="440" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Math</text>
    <text x="740" y="455" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">idle</text>
  </g>

  <!-- Remaining experts indicator -->
  <rect x="95" y="485" width="690" height="22" rx="6" fill="rgba(233,84,32,0.04)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="440" y="500" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Experts E₅, E₆, E₇, E₈ also idle (only top-2 activated per token)</text>

  <!-- Weighted sum from experts to output -->
  <g stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" stroke-linecap="round">
    <line x1="140" y1="475" x2="140" y2="520"/>
    <line x1="340" y1="475" x2="340" y2="520"/>
  </g>
  <g stroke="#e95420" stroke-width="2" opacity="0">
    <line x1="140" y1="475" x2="140" y2="520" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    </line>
  </g>
  <g stroke="#2563eb" stroke-width="2" opacity="0">
    <line x1="340" y1="475" x2="340" y2="520" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Weighted sum box -->
  <rect x="180" y="525" width="200" height="24" rx="12" fill="rgba(124,58,237,0.06)" stroke="#7c3aed" stroke-width="1"/>
  <text x="280" y="541" text-anchor="middle" font-size="9" font-weight="500" fill="#6d28d9">Weighted Sum: 0.7xE₁ + 0.3xE₂</text>

  <!-- ==================== OUTPUT ==================== -->
  <line x1="280" y1="549" x2="450" y2="570" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5"/>
  <polygon points="450,570 442,564 444,574" fill="var(--border-default, #e2e8f0)"/>

  <rect x="380" y="580" width="140" height="60" rx="8" fill="#ffffff" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="450" y="608" text-anchor="middle" font-size="14" font-weight="600" fill="var(--text-default, #0f172a)">Output Token</text>
  <text x="450" y="626" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Contextualized</text>

  <!-- Statistics bar -->
  <rect x="55" y="580" width="280" height="60" rx="8" fill="rgba(233,84,32,0.04)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
  <text x="75" y="600" font-size="10" font-weight="600" fill="var(--brand-default, #e95420)">Sparse MoE Statistics</text>
  <text x="75" y="616" font-size="9" fill="var(--text-muted, #64748b)">Total Params: sum of all experts</text>
  <text x="75" y="630" font-size="9" fill="var(--text-muted, #64748b)">Active Params: k x expert_dim per token</text>

  <rect x="620" y="580" width="225" height="60" rx="8" fill="rgba(233,84,32,0.04)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
  <text x="640" y="600" font-size="10" font-weight="600" fill="var(--brand-default, #e95420)">Examples</text>
  <text x="640" y="616" font-size="9" fill="var(--text-muted, #64748b)">GPT-4 (~1.7T total, ~280B active)</text>
  <text x="640" y="630" font-size="9" fill="var(--text-muted, #64748b)">Mixtral 8x7B, Gemini 1.5, DeepSeek V2</text>

  <!-- Load balancing note -->
  <rect x="55" y="650" width="790" height="20" rx="6" fill="rgba(245,158,11,0.06)" stroke="#d97706" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="450" y="664" text-anchor="middle" font-size="9" fill="#b45309">Challenge: Load balancing — auxiliary loss ensures tokens are evenly distributed across all experts</text>
</svg>