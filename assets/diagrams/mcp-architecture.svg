<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <filter id="shadowDeep">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#c34113" flood-opacity="0.20"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#059669"/>
    </marker>
  </defs>

  <rect width="900" height="550" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">MCP — Model Context Protocol Architecture</text>
    <line x1="220" y1="34" x2="680" y2="34" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="50" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">"USB-C for AI" — Universal protocol for LLM-to-tool integration</text>
  </g>

  <!-- ==================== LAYER 1: HOST APPLICATION ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.5s" fill="freeze"/>
    <rect x="30" y="68" width="840" height="30" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="450" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-default, #e95420)">LAYER 1: HOST APPLICATION</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
    <rect x="30" y="108" width="840" height="70" rx="10" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="2" filter="url(#shadowDeep)">
      <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="108" width="840" height="30" rx="10" fill="var(--brand-default, #e95420)"/>
    <rect x="30" y="130" width="840" height="8" fill="var(--brand-default, #e95420)"/>
    <text x="450" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">HOST APPLICATION (Claude Desktop, IDE Plugin, Custom App)</text>

    <text x="50" y="155" font-size="10" fill="var(--text-default, #0f172a)">Orchestrates user interaction, manages connections to MCP servers, provides user interface</text>
    <text x="50" y="170" font-size="9" fill="var(--text-muted, #64748b)">Host → MCP Client → MCP Server → External Tools/Data</text>
  </g>

  <!-- ==================== LAYER 2: MCP PROTOCOL ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.8s" fill="freeze"/>
    <line x1="30" y1="195" x2="870" y2="195" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <rect x="30" y="205" width="840" height="30" rx="6" fill="rgba(37,99,235,0.06)"/>
    <text x="450" y="225" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">LAYER 2: MCP PROTOCOL (Client-Server Communication)</text>
  </g>

  <!-- MCP Client -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
    <rect x="80" y="248" width="220" height="80" rx="10" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <rect x="80" y="248" width="220" height="28" rx="10" fill="#2563eb"/>
    <rect x="80" y="268" width="220" height="8" fill="#2563eb"/>
    <text x="190" y="269" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">MCP CLIENT</text>

    <text x="90" y="292" font-size="9" fill="var(--text-default, #0f172a)">Discovers available tools</text>
    <text x="90" y="308" font-size="9" fill="var(--text-default, #0f172a)">Forwards tool call requests</text>
    <text x="90" y="320" font-size="9" fill="var(--text-muted, #64748b)">→ Sends JSON-RPC messages</text>
  </g>

  <!-- Protocol pipe -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.0s" fill="freeze"/>
    <rect x="330" y="268" width="240" height="40" rx="20" fill="var(--bg-subtle, #f8fafc)" stroke="#2563eb" stroke-width="1" stroke-dasharray="6,3"/>
    <text x="450" y="284" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">JSON-RPC Protocol</text>
    <text x="450" y="300" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Stdio | WebSocket | HTTP</text>

    <line x1="300" y1="288" x2="328" y2="288" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <line x1="570" y1="288" x2="598" y2="288" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Animated request/response -->
    <circle cx="340" cy="280" r="2" fill="#2563eb" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="340;560" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="296" r="2" fill="#059669" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="560;340" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- MCP Server -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <rect x="600" y="248" width="220" height="80" rx="10" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect x="600" y="248" width="220" height="28" rx="10" fill="#059669"/>
    <rect x="600" y="268" width="220" height="8" fill="#059669"/>
    <text x="710" y="269" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">MCP SERVER</text>

    <text x="610" y="292" font-size="9" fill="var(--text-default, #0f172a)">Exposes tool definitions</text>
    <text x="610" y="308" font-size="9" fill="var(--text-default, #0f172a)">Executes tool calls</text>
    <text x="610" y="320" font-size="9" fill="var(--text-muted, #64748b)">Returns results as JSON-RPC</text>
  </g>

  <!-- ==================== LAYER 3: TOOLS & DATA SOURCES ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.2s" fill="freeze"/>
    <line x1="30" y1="348" x2="870" y2="348" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <rect x="30" y="358" width="840" height="30" rx="6" fill="rgba(5,150,105,0.08)"/>
    <text x="450" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">LAYER 3: EXTERNAL TOOLS &amp; DATA SOURCES</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>
    <!-- Arrow down from MCP Server -->
    <path d="M 710 328 L 710 355" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>

    <!-- Tool 1 -->
    <rect x="40" y="400" width="190" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="40" y="400" width="190" height="24" rx="8" fill="#64748b"/>
    <rect x="40" y="416" width="190" height="8" fill="#64748b"/>
    <text x="135" y="418" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">File System</text>
    <text x="135" y="440" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Read/write files, search</text>
    <text x="135" y="454" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Local or cloud storage</text>

    <!-- Tool 2 -->
    <rect x="250" y="400" width="190" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="250" y="400" width="190" height="24" rx="8" fill="#64748b"/>
    <rect x="250" y="416" width="190" height="8" fill="#64748b"/>
    <text x="345" y="418" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Databases</text>
    <text x="345" y="440" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">SQL queries, vector search</text>
    <text x="345" y="454" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Postgres, SQLite, Pinecone</text>

    <!-- Tool 3 -->
    <rect x="460" y="400" width="190" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="460" y="400" width="190" height="24" rx="8" fill="#64748b"/>
    <rect x="460" y="416" width="190" height="8" fill="#64748b"/>
    <text x="555" y="418" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">APIs</text>
    <text x="555" y="440" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">REST, GraphQL, gRPC</text>
    <text x="555" y="454" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">External services</text>

    <!-- Tool 4 -->
    <rect x="670" y="400" width="200" height="60" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="670" y="400" width="200" height="24" rx="8" fill="#64748b"/>
    <rect x="670" y="416" width="200" height="8" fill="#64748b"/>
    <text x="770" y="418" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Custom Tools</text>
    <text x="770" y="440" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Any Python/JS/Go service</text>
    <text x="770" y="454" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">implements MCP spec</text>
  </g>

  <!-- ==================== BOTTOM: KEY BENEFITS ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/>
    <line x1="30" y1="478" x2="870" y2="478" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <rect x="30" y="490" width="840" height="50" rx="8" fill="var(--brand-light, rgba(233,84,32,0.06))" stroke="var(--brand-default, #e95420)" stroke-width="1"/>

    <text x="150" y="510" text-anchor="middle" font-size="9" font-weight="600" fill="var(--text-default, #0f172a)">Universal Protocol</text>
    <text x="150" y="525" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">One standard for all tools</text>

    <line x1="270" y1="495" x2="270" y2="535" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>

    <text x="370" y="510" text-anchor="middle" font-size="9" font-weight="600" fill="var(--text-default, #0f172a)">Dynamic Discovery</text>
    <text x="370" y="525" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Servers advertise their tools</text>

    <line x1="490" y1="495" x2="490" y2="535" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>

    <text x="590" y="510" text-anchor="middle" font-size="9" font-weight="600" fill="var(--text-default, #0f172a)">Pluggable Architecture</text>
    <text x="590" y="525" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Add/remove servers without changes</text>

    <line x1="710" y1="495" x2="710" y2="535" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>

    <text x="800" y="510" text-anchor="middle" font-size="9" font-weight="600" fill="var(--text-default, #0f172a)">Open Standard</text>
    <text x="800" y="525" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Anthropic, community-driven</text>
  </g>
</svg>
