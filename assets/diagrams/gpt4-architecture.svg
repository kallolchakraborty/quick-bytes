<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Ubuntu', sans-serif; }
  </style>
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e95420"/>
      <stop offset="100%" stop-color="#c34113"/>
    </linearGradient>
    <linearGradient id="routerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e95420"/>
      <stop offset="100%" stop-color="#c34113"/>
    </linearGradient>
    <linearGradient id="activeGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" rx="8" fill="var(--bg-subtle, #f8fafc)" opacity="0.5"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">GPT-4 Architecture</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="var(--text-muted, #64748b)">Mixture of Experts — ~1.7T Total / ~280B Active</text>

  <!-- Section labels -->
  <rect x="30" y="75" width="180" height="22" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="50" y="90" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">INPUT TOKEN</text>

  <rect x="30" y="175" width="180" height="22" rx="4" fill="rgba(124,58,237,0.06)"/>
  <text x="50" y="190" font-size="11" font-weight="600" fill="#7c3aed">ROUTER / GATE</text>

  <rect x="30" y="285" width="180" height="22" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="50" y="300" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">EXPERTS (E₁–E₈)</text>

  <rect x="30" y="430" width="180" height="22" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="50" y="445" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">OUTPUT TOKEN</text>

  <!-- ==================== INPUT TOKEN ==================== -->
  <rect x="380" y="85" width="140" height="55" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="2" filter="url(#shadow1)">
    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="var(--text-default, #0f172a)">Input Token</text>
  <text x="450" y="128" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">e.g. &quot;The&quot;</text>

  <!-- Down arrow to router -->
  <line x1="450" y1="140" x2="450" y2="170" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5"/>
  <polygon points="450,170 446,162 454,162" fill="var(--border-default, #e2e8f0)"/>

  <!-- ==================== ROUTER / GATE ==================== -->
  <rect x="280" y="185" width="340" height="80" rx="12" fill="rgba(124,58,237,0.06)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow1)">
    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">MoE Router / Gate Network</text>
  <text x="450" y="226" text-anchor="middle" font-size="10" fill="#7c3aed">Learned linear layer + top-2 softmax</text>

  <!-- Softmax weight visualization -->
  <g>
    <rect x="320" y="240" width="60" height="18" rx="4" fill="rgba(233,84,32,0.10)" stroke="#e95420" stroke-width="1.5"/>
    <text x="350" y="253" text-anchor="middle" font-size="9" font-weight="600" fill="#c34113">w₁=0.7</text>
    <rect x="420" y="240" width="60" height="18" rx="4" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="450" y="253" text-anchor="middle" font-size="9" font-weight="600" fill="#1d4ed8">w₂=0.3</text>
    <rect x="520" y="240" width="60" height="18" rx="4" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="550" y="253" text-anchor="middle" font-size="9" font-weight="500" fill="var(--text-muted, #64748b)">w₃₋₈=0</text>
  </g>

  <!-- ==================== ROUTING LINES TO EXPERTS ==================== -->
  <!-- Inactive paths (dashed) -->
  <g stroke="var(--border-default, #e2e8f0)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.3">
    <line x1="350" y1="265" x2="305" y2="295"/>
    <line x1="450" y1="265" x2="379" y2="295"/>
    <line x1="450" y1="265" x2="453" y2="295"/>
    <line x1="450" y1="265" x2="527" y2="295"/>
    <line x1="550" y1="265" x2="601" y2="295"/>
    <line x1="550" y1="265" x2="675" y2="295"/>
  </g>

  <!-- Active paths (E1 and E2) with animated pulse -->
  <g stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" opacity="0">
    <line x1="350" y1="265" x2="187" y2="295">
      <animate attributeName="opacity" values="0;0.9;0" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="450" y1="265" x2="261" y2="295">
      <animate attributeName="opacity" values="0;0.9;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Solid active connection background -->
  <g stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" opacity="0.25">
    <line x1="350" y1="265" x2="187" y2="295"/>
    <line x1="450" y1="265" x2="261" y2="295"/>
  </g>

  <!-- Routing probability badges -->
  <rect x="250" y="278" width="52" height="18" rx="9" fill="rgba(233,84,32,0.12)"/>
  <text x="276" y="291" text-anchor="middle" font-size="9" font-weight="600" fill="#c34113">p=0.7</text>
  <rect x="310" y="278" width="52" height="18" rx="9" fill="rgba(37,99,235,0.12)"/>
  <text x="336" y="291" text-anchor="middle" font-size="9" font-weight="600" fill="#1d4ed8">p=0.3</text>

  <!-- ==================== EXPERTS ==================== -->
  <!-- 8 expert blocks in a row: w=68, h=68, gap=6 -->
  <!-- total = 8*68 + 7*6 = 586, start x = 450 - 293 = 157 -->
  <!-- positions: 157, 231, 305, 379, 453, 527, 601, 675 -->

  <!-- E1 — ACTIVE -->
  <g>
    <rect x="157" y="295" width="68" height="68" rx="8" fill="var(--bg-default, #ffffff)" stroke="url(#activeGrad)" stroke-width="2" filter="url(#shadow1)">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="157" y="295" width="68" height="22" rx="8" fill="rgba(233,84,32,0.08)"/>
    <text x="191" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#c34113">E₁</text>
    <text x="191" y="335" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Linguistics</text>
    <rect x="165" y="347" width="52" height="14" rx="4" fill="rgba(233,84,32,0.10)"/>
    <text x="191" y="357" text-anchor="middle" font-size="7" font-weight="700" fill="#e95420">ACTIVE</text>
  </g>

  <!-- E2 — ACTIVE -->
  <g>
    <rect x="231" y="295" width="68" height="68" rx="8" fill="var(--bg-default, #ffffff)" stroke="url(#activeGrad2)" stroke-width="2" filter="url(#shadow1)">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="231" y="295" width="68" height="22" rx="8" fill="rgba(37,99,235,0.08)"/>
    <text x="265" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">E₂</text>
    <text x="265" y="335" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Reasoning</text>
    <rect x="239" y="347" width="52" height="14" rx="4" fill="rgba(37,99,235,0.10)"/>
    <text x="265" y="357" text-anchor="middle" font-size="7" font-weight="700" fill="#2563eb">ACTIVE</text>
  </g>

  <!-- E3 — inactive -->
  <g>
    <rect x="305" y="295" width="68" height="68" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="339" y="322" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-muted, #64748b)">E₃</text>
    <text x="339" y="345" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Code</text>
  </g>

  <!-- E4 — inactive -->
  <g>
    <rect x="379" y="295" width="68" height="68" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="413" y="322" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-muted, #64748b)">E₄</text>
    <text x="413" y="345" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Math</text>
  </g>

  <!-- E5 — inactive -->
  <g>
    <rect x="453" y="295" width="68" height="68" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="487" y="322" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-muted, #64748b)">E₅</text>
    <text x="487" y="345" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Vision</text>
  </g>

  <!-- E6 — inactive -->
  <g>
    <rect x="527" y="295" width="68" height="68" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="561" y="322" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-muted, #64748b)">E₆</text>
    <text x="561" y="345" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Science</text>
  </g>

  <!-- E7 — inactive -->
  <g>
    <rect x="601" y="295" width="68" height="68" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="635" y="322" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-muted, #64748b)">E₇</text>
    <text x="635" y="345" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Tool Use</text>
  </g>

  <!-- E8 — inactive -->
  <g>
    <rect x="675" y="295" width="68" height="68" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="709" y="322" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-muted, #64748b)">E₈</text>
    <text x="709" y="345" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Safety</text>
  </g>

  <!-- ==================== WEIGHTED SUM ==================== -->
  <!-- Lines from E1 and E2 to weighted sum -->
  <g stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" stroke-linecap="round">
    <line x1="191" y1="363" x2="191" y2="390"/>
    <line x1="265" y1="363" x2="265" y2="390"/>
  </g>
  <!-- Animated pulse on merge lines -->
  <g stroke="#e95420" stroke-width="2" opacity="0">
    <line x1="191" y1="363" x2="191" y2="390" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <g stroke="#2563eb" stroke-width="2" opacity="0">
    <line x1="265" y1="363" x2="265" y2="390" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" begin="1.3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Weighted sum box -->
  <rect x="165" y="390" width="260" height="28" rx="14" fill="rgba(124,58,237,0.06)" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="295" y="409" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">Weighted Sum: 0.7×E₁ + 0.3×E₂</text>

  <!-- ==================== ARROW TO OUTPUT ==================== -->
  <line x1="295" y1="418" x2="450" y2="445" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5"/>
  <polygon points="450,445 442,439 444,449" fill="var(--border-default, #e2e8f0)"/>

  <!-- ==================== OUTPUT TOKEN ==================== -->
  <rect x="380" y="450" width="140" height="55" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="450" y="475" text-anchor="middle" font-size="14" font-weight="600" fill="var(--text-default, #0f172a)">Output Token</text>
  <text x="450" y="493" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Contextualized</text>

  <!-- ==================== BOTTOM PANELS ==================== -->

  <!-- GQA Callout -->
  <rect x="55" y="530" width="240" height="130" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow1)"/>
  <rect x="55" y="530" width="240" height="28" rx="8" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
  <text x="175" y="549" text-anchor="middle" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">Grouped-Query Attention</text>
  <text x="175" y="570" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">8 KV heads per 32 query heads</text>
  <line x1="75" y1="578" x2="275" y2="578" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
  <text x="75" y="594" font-size="9" fill="var(--text-muted, #64748b)">• Reduces KV-cache memory by 4×</text>
  <text x="75" y="610" font-size="9" fill="var(--text-muted, #64748b)">• vs. standard multi-head attention</text>
  <text x="75" y="626" font-size="9" fill="var(--text-muted, #64748b)">• Key/value heads are shared</text>
  <text x="75" y="642" font-size="9" fill="var(--text-muted, #64748b)">• Improves inference throughput</text>

  <!-- Stats Box -->
  <rect x="330" y="530" width="240" height="130" rx="8" fill="rgba(233,84,32,0.04)" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
  <rect x="330" y="530" width="240" height="28" rx="8" fill="rgba(233,84,32,0.06)"/>
  <text x="450" y="549" text-anchor="middle" font-size="11" font-weight="600" fill="var(--brand-default, #e95420)">GPT-4 at a Glance</text>
  <line x1="350" y1="566" x2="550" y2="566" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
  <text x="350" y="582" font-size="9" fill="var(--text-default, #0f172a)"><tspan font-weight="600">Total Params:</tspan> ~1.7 trillion</text>
  <text x="350" y="598" font-size="9" fill="var(--text-default, #0f172a)"><tspan font-weight="600">Active Params:</tspan> ~280 billion</text>
  <text x="350" y="614" font-size="9" fill="var(--text-default, #0f172a)"><tspan font-weight="600">Layers:</tspan> ~120</text>
  <text x="350" y="630" font-size="9" fill="var(--text-default, #0f172a)"><tspan font-weight="600">Experts:</tspan> 8 (top-2 active)</text>
  <text x="350" y="646" font-size="9" fill="var(--text-default, #0f172a)"><tspan font-weight="600">Context:</tspan> 32K tokens (up to 128K)</text>

  <!-- Speculative Decoding Callout -->
  <rect x="605" y="530" width="240" height="130" rx="8" fill="var(--bg-default, #ffffff)" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)"/>
  <rect x="605" y="530" width="240" height="28" rx="8" fill="rgba(124,58,237,0.06)"/>
  <text x="725" y="549" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Speculative Decoding</text>
  <text x="725" y="570" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Draft model + verification</text>
  <line x1="625" y1="578" x2="825" y2="578" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
  <text x="625" y="594" font-size="9" fill="var(--text-muted, #64748b)">• Draft model generates K tokens</text>
  <text x="625" y="610" font-size="9" fill="var(--text-muted, #64748b)">  cheaply in parallel</text>
  <text x="625" y="626" font-size="9" fill="var(--text-muted, #64748b)">• Target model verifies all at once</text>
  <text x="625" y="642" font-size="9" fill="var(--text-muted, #64748b)">• 2-3× latency improvement</text>
</svg>
