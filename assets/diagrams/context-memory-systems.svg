<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.12);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="var(--text-muted, #64748b)"/>
    </marker>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,10 L5,0 L10,10" fill="var(--brand-default, #e95420)"/>
    </marker>
  </defs>

  <rect width="900" height="550" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Memory Architecture for LLM Systems</text>
    <text x="450" y="48" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Three-tier memory framework: Working → Semantic → Skill</text>
    <line x1="220" y1="55" x2="680" y2="55" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- ==================== TIER 1: WORKING MEMORY (top) ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.5s" fill="freeze"/>
    <rect x="40" y="75" width="680" height="100" rx="10" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="75" width="680" height="28" rx="10" fill="#059669"/>
    <rect x="40" y="93" width="680" height="10" fill="#059669"/>
    <text x="380" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">WORKING MEMORY</text>

    <text x="60" y="125" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">Context Window + KV Cache</text>
    <text x="60" y="145" font-size="10" fill="var(--text-muted, #64748b)">Fastest access (on-GPU). Stores current conversation, prompt tokens, intermediate attention states.</text>
    <text x="60" y="163" font-size="10" fill="var(--text-muted, #64748b)">Limited by context window size (8K–2M tokens). Volatile — cleared between inference passes.</text>

    <!-- Capacity indicator -->
    <rect x="620" y="110" width="80" height="50" rx="6" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="660" y="128" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Capacity</text>
    <text x="660" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">~16K tokens</text>
    <text x="660" y="156" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">~60KB (KV)</text>
  </g>

  <!-- Down arrow: Working → Semantic -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    <line x1="380" y1="175" x2="380" y2="210" stroke="var(--text-muted, #64748b)" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  </g>

  <!-- ==================== TIER 2: SEMANTIC MEMORY (middle) ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.9s" fill="freeze"/>
    <rect x="40" y="215" width="680" height="120" rx="10" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="215" width="680" height="28" rx="10" fill="#2563eb"/>
    <rect x="40" y="233" width="680" height="10" fill="#2563eb"/>
    <text x="380" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SEMANTIC MEMORY</text>

    <text x="60" y="265" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">RAG + Vector Database + Knowledge Graph</text>
    <text x="60" y="285" font-size="10" fill="var(--text-muted, #64748b)">Persistent storage of embeddings, facts, and documents. Retrieved via similarity search.</text>
    <text x="60" y="303" font-size="10" fill="var(--text-muted, #64748b)">Capacity scales with storage (millions of documents). Higher latency — requires retrieval step before inference.</text>
    <text x="60" y="321" font-size="10" fill="var(--text-muted, #64748b)">Updated asynchronously. Common stores: Pinecone, Chroma, Weaviate, pgvector.</text>

    <!-- Capacity indicator -->
    <rect x="620" y="250" width="80" height="70" rx="6" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="660" y="268" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Capacity</text>
    <text x="660" y="284" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">~10M docs</text>
    <text x="660" y="300" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">~10GB+</text>
    <text x="660" y="314" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">100ms+ latency</text>
  </g>

  <!-- Down arrow: Semantic → Skill -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
    <line x1="380" y1="335" x2="380" y2="370" stroke="var(--text-muted, #64748b)" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  </g>

  <!-- ==================== TIER 3: SKILL MEMORY (bottom) ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.3s" fill="freeze"/>
    <rect x="40" y="375" width="680" height="120" rx="10" fill="var(--bg-default, #ffffff)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="375" width="680" height="28" rx="10" fill="#7c3aed"/>
    <rect x="40" y="393" width="680" height="10" fill="#7c3aed"/>
    <text x="380" y="393" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SKILL MEMORY</text>

    <text x="60" y="425" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">Fine-tuning + LoRA + Model Weights</text>
    <text x="60" y="445" font-size="10" fill="var(--text-muted, #64748b)">Permanent knowledge embedded in model parameters. Requires training to update.</text>
    <text x="60" y="463" font-size="10" fill="var(--text-muted, #64748b)">Best for domain adaptation, style mastery, format following. Most expensive to change (hours–days of training).</text>
    <text x="60" y="481" font-size="10" fill="var(--text-muted, #64748b)">Can be swapped at inference time (LoRA adapters, modular architectures).</text>

    <!-- Capacity indicator -->
    <rect x="620" y="410" width="80" height="70" rx="6" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="660" y="428" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Capacity</text>
    <text x="660" y="444" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">~7B–70B params</text>
    <text x="660" y="460" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">~15–140GB</text>
    <text x="660" y="474" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Hours to update</text>
  </g>

  <!-- Right side: Manager / Orchestrator -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
    <rect x="760" y="100" width="120" height="370" rx="10" fill="var(--brand-light, rgba(233,84,32,0.06))" stroke="var(--brand-default, #e95420)" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="820" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-default, #e95420)">MEMORY</text>
    <text x="820" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-default, #e95420)">MANAGER</text>
    <line x1="780" y1="160" x2="860" y2="160" stroke="var(--brand-default, #e95420)" stroke-width="1" opacity="0.5"/>

    <text x="820" y="195" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Decides:</text>
    <text x="820" y="215" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">When to retrieve</text>
    <text x="820" y="235" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b))">When to summarize</text>
    <text x="820" y="255" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">When to fine-tune</text>
    <text x="820" y="275" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Cache strategy</text>
    <text x="820" y="295" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Token budget</text>
    <text x="820" y="315" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Eviction policy</text>
    <line x1="780" y1="340" x2="860" y2="340" stroke="var(--brand-default, #e95420)" stroke-width="1" opacity="0.5"/>

    <text x="820" y="365" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">Key insight:</text>
    <text x="820" y="385" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Only working memory</text>
    <text x="820" y="405" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">is visible to the</text>
    <text x="820" y="425" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">model at inference.</text>
    <text x="820" y="445" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Semantic and skill</text>
    <text x="820" y="460" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">must be loaded into</text>
    <text x="820" y="475" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">working memory.</text>
  </g>

  <!-- Arrows from Memory Manager to tiers -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>
    <line x1="760" y1="125" x2="720" y2="125" stroke="var(--brand-default, #e95420)" stroke-width="1" marker-end="url(#arrowUp)"/>
    <line x1="760" y1="275" x2="720" y2="275" stroke="var(--brand-default, #e95420)" stroke-width="1" marker-end="url(#arrowUp)"/>
    <line x1="760" y1="435" x2="720" y2="435" stroke="var(--brand-default, #e95420)" stroke-width="1" marker-end="url(#arrowUp)"/>
  </g>
</svg>
