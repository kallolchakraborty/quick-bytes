<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#E95420" flood-opacity="0.3"/>
    </filter>
    <filter id="glowTeal">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#0d9488" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="500" fill="none"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#C34113">KV Cache Eviction Strategies</text>
  <line x1="270" y1="38" x2="630" y2="38" stroke="#E95420" stroke-width="1" opacity="0.3"/>

  <!-- ==================== LANE 1: Sliding Window ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <!-- Lane bg -->
    <rect x="30" y="50" width="840" height="135" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="55" y="72" font-size="12" font-weight="700" fill="#C34113">Sliding Window</text>

    <!-- Token boxes: t1-t8 -->
    <!-- t1 - evicted (gray, faded) -->
    <g transform="translate(80,90)" opacity="0.25">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₁</text>
    </g>
    <!-- t2 - evicted -->
    <g transform="translate(145,90)" opacity="0.25">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₂</text>
    </g>
    <!-- t3 - evicted -->
    <g transform="translate(210,90)" opacity="0.25">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₃</text>
    </g>
    <!-- t4 - evicted -->
    <g transform="translate(275,90)" opacity="0.25">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₄</text>
    </g>

    <!-- Window bracket for t5-t8 -->
    <rect x="343" y="82" width="254" height="46" rx="6" fill="none" stroke="#E95420" stroke-width="2" stroke-dasharray="0"/>

    <!-- t5 - kept -->
    <g transform="translate(350,90)">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#E95420" filter="url(#glow)"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">t₅</text>
    </g>
    <!-- t6 - kept -->
    <g transform="translate(415,90)">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#E95420" filter="url(#glow)"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">t₆</text>
    </g>
    <!-- t7 - kept -->
    <g transform="translate(480,90)">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#E95420" filter="url(#glow)"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">t₇</text>
    </g>
    <!-- t8 - kept (newest) -->
    <g transform="translate(545,90)">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#C34113" filter="url(#shadow)"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">t₈</text>
    </g>

    <!-- Label -->
    <text x="640" y="100" font-size="10" font-weight="700" fill="#C34113">Fixed window W=4</text>
    <text x="640" y="115" font-size="8" fill="#94a3b8">Keep only last W tokens</text>
    <text x="640" y="130" font-size="8" fill="#94a3b8">Simple, predictable</text>

    <!-- Memory bar (right) -->
    <rect x="760" y="80" width="18" height="50" rx="3" fill="#f1f5f9" stroke="#E95420" stroke-width="1"/>
    <rect x="760" y="105" width="18" height="25" rx="3" fill="#E95420" opacity="0.4"/>
    <text x="769" y="145" text-anchor="middle" font-size="7" fill="#94a3b8">50%</text>
    <text x="769" y="77" text-anchor="middle" font-size="7" fill="#94a3b8">mem</text>
  </g>

  <!-- ==================== LANE 2: StreamingLLM ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1s" fill="freeze"/>
    <!-- Lane bg -->
    <rect x="30" y="200" width="840" height="135" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="55" y="222" font-size="12" font-weight="700" fill="#C34113">StreamingLLM (Attention Sinks)</text>

    <!-- t1 - sink (teal/green) -->
    <g transform="translate(80,240)">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#0d9488" filter="url(#glowTeal)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="27" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">t₁</text>
      <text x="27" y="26" text-anchor="middle" font-size="6" fill="#ccfbf1">sink</text>
    </g>
    <!-- t2 - sink -->
    <g transform="translate(145,240)">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#0d9488" filter="url(#glowTeal)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <text x="27" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">t₂</text>
      <text x="27" y="26" text-anchor="middle" font-size="6" fill="#ccfbf1">sink</text>
    </g>

    <!-- t3 - evicted -->
    <g transform="translate(210,240)" opacity="0.2">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₃</text>
    </g>
    <!-- t4 - evicted -->
    <g transform="translate(275,240)" opacity="0.2">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₄</text>
    </g>
    <!-- t5 - evicted -->
    <g transform="translate(340,240)" opacity="0.2">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₅</text>
    </g>
    <!-- t6 - evicted -->
    <g transform="translate(405,240)" opacity="0.2">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₆</text>
    </g>

    <!-- t7 - kept (recent window) -->
    <g transform="translate(470,240)">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#E95420" filter="url(#glow)"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">t₇</text>
    </g>
    <!-- t8 - kept (newest) -->
    <g transform="translate(535,240)">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#C34113" filter="url(#shadow)"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">t₈</text>
    </g>

    <!-- Bracket for sinks -->
    <rect x="78" y="232" width="130" height="46" rx="6" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="143" y="290" text-anchor="middle" font-size="7" fill="#0d9488" font-weight="600">initial tokens (sinks)</text>

    <!-- Bracket for recent -->
    <rect x="468" y="232" width="130" height="46" rx="6" fill="none" stroke="#E95420" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="533" y="290" text-anchor="middle" font-size="7" fill="#E95420" font-weight="600">recent window</text>

    <!-- Label -->
    <text x="640" y="250" font-size="10" font-weight="700" fill="#C34113">Sinks + recent window</text>
    <text x="640" y="265" font-size="8" fill="#94a3b8">First tokens absorb excess attention</text>
    <text x="640" y="280" font-size="8" fill="#94a3b8">Drop middle → stable perplexity</text>

    <!-- Memory bar -->
    <rect x="760" y="230" width="18" height="50" rx="3" fill="#f1f5f9" stroke="#E95420" stroke-width="1"/>
    <rect x="760" y="240" width="18" height="40" rx="3" fill="#E95420" opacity="0.4"/>
    <text x="769" y="300" text-anchor="middle" font-size="7" fill="#94a3b8">40%</text>
    <text x="769" y="227" text-anchor="middle" font-size="7" fill="#94a3b8">mem</text>
  </g>

  <!-- ==================== LANE 3: H2O ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
    <!-- Lane bg -->
    <rect x="30" y="350" width="840" height="135" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="55" y="372" font-size="12" font-weight="700" fill="#C34113">H2O (Importance Scoring)</text>

    <!-- Token boxes with importance bars above -->
    <!-- t1 - low importance, evicted -->
    <g transform="translate(80,400)" opacity="0.25">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₁</text>
    </g>
    <rect x="95" y="388" width="8" height="6" rx="1" fill="#d1d5db" opacity="0.4"/>

    <!-- t2 - HIGH importance, kept -->
    <g transform="translate(145,400)">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#E95420" filter="url(#glow)"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">t₂</text>
    </g>
    <rect x="160" y="380" width="8" height="24" rx="1" fill="#E95420" opacity="0.6"/>

    <!-- t3 - low importance, evicted -->
    <g transform="translate(210,400)" opacity="0.2">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₃</text>
    </g>
    <rect x="225" y="392" width="8" height="12" rx="1" fill="#d1d5db" opacity="0.4"/>

    <!-- t4 - low importance, evicted -->
    <g transform="translate(275,400)" opacity="0.2">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₄</text>
    </g>
    <rect x="290" y="390" width="8" height="14" rx="1" fill="#d1d5db" opacity="0.4"/>

    <!-- t5 - HIGH importance, kept -->
    <g transform="translate(340,400)">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#E95420" filter="url(#glow)"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">t₅</text>
    </g>
    <rect x="355" y="378" width="8" height="26" rx="1" fill="#E95420" opacity="0.6"/>

    <!-- t6 - low importance, evicted -->
    <g transform="translate(405,400)" opacity="0.2">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₆</text>
    </g>
    <rect x="420" y="394" width="8" height="10" rx="1" fill="#d1d5db" opacity="0.4"/>

    <!-- t7 - low importance, evicted -->
    <g transform="translate(470,400)" opacity="0.2">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">t₇</text>
    </g>
    <rect x="485" y="393" width="8" height="11" rx="1" fill="#d1d5db" opacity="0.4"/>

    <!-- t8 - HIGH importance, kept -->
    <g transform="translate(535,400)">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#C34113" filter="url(#shadow)"/>
      <text x="27" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">t₈</text>
    </g>
    <rect x="550" y="376" width="8" height="28" rx="1" fill="#C34113" opacity="0.7"/>

    <!-- Importance bar label -->
    <text x="310" y="445" text-anchor="middle" font-size="8" fill="#94a3b8">↑ Importance score (attention weight) ↑</text>

    <!-- Label -->
    <text x="640" y="400" font-size="10" font-weight="700" fill="#C34113">Keep heavy hitters</text>
    <text x="640" y="415" font-size="8" fill="#94a3b8">Score = cumulative attention weight</text>
    <text x="640" y="430" font-size="8" fill="#94a3b8">Keep top-k by importance</text>
    <text x="640" y="445" font-size="8" fill="#94a3b8">Best quality per cache byte</text>

    <!-- Memory bar -->
    <rect x="760" y="380" width="18" height="50" rx="3" fill="#f1f5f9" stroke="#E95420" stroke-width="1"/>
    <rect x="760" y="395" width="18" height="35" rx="3" fill="#E95420" opacity="0.4"/>
    <text x="769" y="450" text-anchor="middle" font-size="7" fill="#94a3b8">35%</text>
    <text x="769" y="377" text-anchor="middle" font-size="7" fill="#94a3b8">mem</text>
  </g>

  <!-- ==================== BOTTOM NOTE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.2s" fill="freeze"/>
    <rect x="180" y="465" width="540" height="24" rx="5" fill="#fde8dc" stroke="#f0883e" stroke-width="1"/>
    <text x="450" y="481" text-anchor="middle" font-size="9" font-weight="600" fill="#c34113">All strategies reduce cache from O(n) → O(1) or O(W), enabling infinite-length generation</text>
  </g>
</svg>