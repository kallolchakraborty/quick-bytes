<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowDn" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#E95420"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#E95420"/>
    </marker>
    <pattern id="wastePattern" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="900" height="520" fill="none"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#C34113">PagedAttention: Virtual Memory for KV Cache</text>
  <line x1="200" y1="38" x2="700" y2="38" stroke="#E95420" stroke-width="1" opacity="0.3"/>

  <!-- ==================== LEFT: Traditional Contiguous ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>

    <!-- Section label -->
    <text x="200" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#C34113">Traditional (Contiguous)</text>

    <!-- GPU Memory bar -->
    <rect x="30" y="78" width="340" height="20" rx="4" fill="#e2e8f0"/>
    <text x="200" y="75" text-anchor="middle" font-size="9" fill="#94a3b8">GPU Memory</text>

    <!-- Request 1: 87.5% waste -->
    <rect x="30" y="105" width="340" height="44" rx="6" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="34" y="109" width="40" height="36" rx="3" fill="#E95420" opacity="0.8"/>
    <text x="54" y="130" text-anchor="middle" font-size="8" fill="#fff" font-weight="600">Used</text>
    <rect x="78" y="109" width="288" height="36" rx="3" fill="url(#wastePattern)"/>
    <rect x="78" y="109" width="288" height="36" rx="3" fill="#fee2e2" opacity="0.5"/>
    <text x="222" y="126" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="600">Waste: 87.5%</text>
    <text x="222" y="140" text-anchor="middle" font-size="7" fill="#94a3b8">Pre-allocated for max sequence length</text>
    <text x="30" y="125" font-size="8" fill="#475569" font-weight="600" transform="rotate(-90,30,125)">Req 1</text>

    <!-- Request 2: 50% waste -->
    <rect x="30" y="158" width="340" height="44" rx="6" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="34" y="162" width="170" height="36" rx="3" fill="#E95420" opacity="0.8"/>
    <text x="119" y="183" text-anchor="middle" font-size="8" fill="#fff" font-weight="600">Used</text>
    <rect x="208" y="162" width="158" height="36" rx="3" fill="url(#wastePattern)"/>
    <rect x="208" y="162" width="158" height="36" rx="3" fill="#fee2e2" opacity="0.5"/>
    <text x="287" y="179" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="600">Waste: 50%</text>
    <text x="287" y="193" text-anchor="middle" font-size="7" fill="#94a3b8">Fixed allocation</text>
    <text x="30" y="178" font-size="8" fill="#475569" font-weight="600" transform="rotate(-90,30,178)">Req 2</text>

    <!-- Request 3 -->
    <rect x="30" y="211" width="340" height="44" rx="6" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="34" y="215" width="70" height="36" rx="3" fill="#E95420" opacity="0.8"/>
    <text x="69" y="236" text-anchor="middle" font-size="8" fill="#fff" font-weight="600">Used</text>
    <rect x="108" y="215" width="258" height="36" rx="3" fill="url(#wastePattern)"/>
    <rect x="108" y="215" width="258" height="36" rx="3" fill="#fee2e2" opacity="0.5"/>
    <text x="237" y="232" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="600">Waste: 79%</text>
    <text x="30" y="231" font-size="8" fill="#475569" font-weight="600" transform="rotate(-90,30,231)">Req 3</text>

    <!-- Memory utilization bar -->
    <text x="200" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Memory Utilization</text>
    <rect x="60" y="285" width="280" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="60" y="285" width="84" height="16" rx="8" fill="#dc2626"/>
    <text x="200" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">20–40%</text>

    <!-- Fragmentation label -->
    <rect x="60" y="325" width="280" height="28" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="200" y="343" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="600">Internal fragmentation + memory waste</text>
  </g>

  <!-- ==================== DIVIDER ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
    <line x1="430" y1="100" x2="430" y2="360" stroke="#E95420" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
    <rect x="410" y="218" width="40" height="24" rx="12" fill="#E95420"/>
    <text x="430" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">→</text>
  </g>

  <!-- ==================== RIGHT: PagedAttention ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2s" fill="freeze"/>

    <!-- Section label -->
    <text x="680" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#C34113">PagedAttention</text>

    <!-- GPU Memory bar -->
    <rect x="470" y="78" width="370" height="20" rx="4" fill="#e2e8f0"/>
    <text x="655" y="75" text-anchor="middle" font-size="9" fill="#94a3b8">GPU Memory (Non-contiguous Blocks)</text>

    <!-- Block table -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.5s" fill="freeze"/>
      <rect x="590" y="108" width="160" height="96" rx="6" fill="#fff" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="670" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">Block Table</text>
      <line x1="590" y1="130" x2="750" y2="130" stroke="#E95420" stroke-width="0.5"/>
      <!-- Header -->
      <text x="625" y="144" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">Logical</text>
      <text x="715" y="144" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">Physical</text>
      <line x1="670" y1="134" x2="670" y2="200" stroke="#E95420" stroke-width="0.5"/>
      <!-- Entries -->
      <text x="625" y="162" text-anchor="middle" font-size="9" fill="#475569">0</text>
      <text x="715" y="162" text-anchor="middle" font-size="9" fill="#E95420" font-weight="600">Block 7</text>
      <text x="625" y="178" text-anchor="middle" font-size="9" fill="#475569">1</text>
      <text x="715" y="178" text-anchor="middle" font-size="9" fill="#E95420" font-weight="600">Block 2</text>
      <text x="625" y="194" text-anchor="middle" font-size="9" fill="#475569">2</text>
      <text x="715" y="194" text-anchor="middle" font-size="9" fill="#E95420" font-weight="600">Block 15</text>
    </g>

    <!-- Scattered blocks representing actual allocation -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze"/>
      <!-- Request 1 blocks (small, scattered) -->
      <rect x="474" y="135" width="32" height="18" rx="3" fill="#E95420" opacity="0.8"/>
      <text x="490" y="148" text-anchor="middle" font-size="7" fill="#fff">R1</text>
      <rect x="530" y="135" width="32" height="18" rx="3" fill="#E95420" opacity="0.7"/>
      <text x="546" y="148" text-anchor="middle" font-size="7" fill="#fff">R1</text>
      <rect x="590" y="135" width="32" height="18" rx="3" fill="#E95420" opacity="0.6"/>
      <text x="606" y="148" text-anchor="middle" font-size="7" fill="#fff">R1</text>

      <!-- Request 2 blocks (small, scattered) -->
      <rect x="490" y="165" width="32" height="18" rx="3" fill="#3b82f6" opacity="0.8"/>
      <text x="506" y="178" text-anchor="middle" font-size="7" fill="#fff">R2</text>
      <rect x="556" y="165" width="32" height="18" rx="3" fill="#3b82f6" opacity="0.7"/>
      <text x="572" y="178" text-anchor="middle" font-size="7" fill="#fff">R2</text>

      <!-- Request 3 blocks (small, scattered) -->
      <rect x="518" y="195" width="32" height="18" rx="3" fill="#10b981" opacity="0.8"/>
      <text x="534" y="208" text-anchor="middle" font-size="7" fill="#fff">R3</text>
      <rect x="580" y="195" width="32" height="18" rx="3" fill="#10b981" opacity="0.7"/>
      <text x="596" y="208" text-anchor="middle" font-size="7" fill="#fff">R3</text>
      <rect x="730" y="135" width="32" height="18" rx="3" fill="#10b981" opacity="0.6"/>
      <text x="746" y="148" text-anchor="middle" font-size="7" fill="#fff">R3</text>

      <!-- Empty blocks (free) -->
      <rect x="474" y="225" width="32" height="18" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5"/>
      <text x="490" y="238" text-anchor="middle" font-size="7" fill="#94a3b8">Free</text>
      <rect x="518" y="225" width="32" height="18" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5"/>
      <text x="534" y="238" text-anchor="middle" font-size="7" fill="#94a3b8">Free</text>
      <rect x="562" y="225" width="32" height="18" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5"/>
      <text x="578" y="238" text-anchor="middle" font-size="7" fill="#94a3b8">Free</text>
      <rect x="606" y="225" width="32" height="18" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5"/>
      <text x="622" y="238" text-anchor="middle" font-size="7" fill="#94a3b8">Free</text>
      <rect x="650" y="225" width="32" height="18" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5"/>
      <text x="666" y="238" text-anchor="middle" font-size="7" fill="#94a3b8">Free</text>
      <rect x="694" y="225" width="32" height="18" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5"/>
      <text x="710" y="238" text-anchor="middle" font-size="7" fill="#94a3b8">Free</text>
    </g>

    <!-- Memory utilization bar -->
    <text x="655" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Memory Utilization</text>
    <rect x="485" y="285" width="340" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="485" y="285" width="330" height="16" rx="8" fill="#10b981"/>
    <text x="655" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">95–99%</text>

    <!-- PagedAttention label -->
    <rect x="485" y="325" width="340" height="28" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="655" y="343" text-anchor="middle" font-size="9" fill="#10b981" font-weight="600">No internal fragmentation — allocate only what's needed</text>
  </g>

  <!-- ==================== COPY-ON-WRITE ANNOTATION ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.5s" fill="freeze"/>

    <rect x="470" y="370" width="370" height="68" rx="8" fill="#fff5eb" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="655" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">Shared Prefix Blocks (Copy-on-Write)</text>
    <text x="655" y="406" text-anchor="middle" font-size="9" fill="#475569">Multiple requests can share the same physical blocks</text>
    <text x="655" y="420" text-anchor="middle" font-size="9" fill="#475569">for identical system prompts — duplicated only on write</text>

    <!-- Shared prefix visualization -->
    <rect x="490" y="448" width="24" height="14" rx="2" fill="#E95420" opacity="0.9"/>
    <text x="502" y="458" text-anchor="middle" font-size="6" fill="#fff" font-weight="600">Sys</text>
    <rect x="518" y="448" width="24" height="14" rx="2" fill="#E95420" opacity="0.9"/>
    <text x="530" y="458" text-anchor="middle" font-size="6" fill="#fff" font-weight="600">Prompt</text>
    <line x1="546" y1="455" x2="570" y2="455" stroke="#E95420" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="600" y="458" text-anchor="middle" font-size="8" fill="#475569">→ shared by R1, R2, R3</text>

    <text x="655" y="480" text-anchor="middle" font-size="8" fill="#94a3b8">Like OS fork() — zero-copy for read-only pages</text>
  </g>

  <!-- ==================== FLOW PARTICLES ==================== -->
  <circle r="2.5" fill="#E95420" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0;0;0;0;0;0;0;0" dur="4s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="200;200;200;200;200;200;430;655;655;655" dur="4s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="127;180;233;285;285;285;230;127;180;285" dur="4s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>