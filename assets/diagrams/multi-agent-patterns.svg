<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#059669"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Multi-Agent Coordination Patterns</text>
    <line x1="260" y1="34" x2="640" y2="34" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="50" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Coordinate multiple LLM agents with different roles</text>
  </g>

  <!-- ==================== PATTERN 1: ORCHESTRATOR-WORKERS ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.5s" fill="freeze"/>
    <rect x="15" y="68" width="280" height="28" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="155" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-default, #e95420)">ORCHESTRATOR-WORKERS</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
    <!-- Orchestrator -->
    <rect x="85" y="108" width="140" height="36" rx="8" fill="var(--brand-default, #e95420)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="155" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Orchestrator</text>

    <!-- Lines to workers -->
    <line x1="110" y1="144" x2="40" y2="185" stroke="var(--brand-default, #e95420)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="155" y1="144" x2="155" y2="185" stroke="var(--brand-default, #e95420)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="200" y1="144" x2="270" y2="185" stroke="var(--brand-default, #e95420)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Workers -->
    <rect x="15" y="190" width="100" height="32" rx="6" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <text x="65" y="210" text-anchor="middle" font-size="9" font-weight="500" fill="var(--text-muted, #64748b)">Worker A</text>
    <rect x="110" y="190" width="100" height="32" rx="6" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <text x="160" y="210" text-anchor="middle" font-size="9" font-weight="500" fill="var(--text-muted, #64748b)">Worker B</text>
    <rect x="205" y="190" width="100" height="32" rx="6" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <text x="255" y="210" text-anchor="middle" font-size="9" font-weight="500" fill="var(--text-muted, #64748b)">Worker C</text>
  </g>

  <!-- ==================== PATTERN 2: SUPERVISOR ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.8s" fill="freeze"/>
    <rect x="310" y="68" width="280" height="28" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="450" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-default, #e95420)">SUPERVISOR</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
    <!-- Supervisor at top -->
    <rect x="370" y="105" width="160" height="36" rx="8" fill="#7c3aed" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Supervisor</text>

    <!-- Review arrows (dashed) -->
    <path d="M 450 141 L 450 170 L 200 170 L 200 185" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)" fill="none" stroke-dasharray="4,3"/>
    <path d="M 450 141 L 450 185" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)" fill="none" stroke-dasharray="4,3"/>
    <path d="M 450 141 L 450 170 L 700 170 L 700 185" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)" fill="none" stroke-dasharray="4,3"/>

    <!-- Workers -->
    <rect x="135" y="190" width="120" height="32" rx="6" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <text x="195" y="210" text-anchor="middle" font-size="9" font-weight="500" fill="var(--text-muted, #64748b)">Generator</text>
    <rect x="390" y="190" width="120" height="32" rx="6" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <text x="450" y="210" text-anchor="middle" font-size="9" font-weight="500" fill="var(--text-muted, #64748b)">Critic</text>
    <rect x="645" y="190" width="120" height="32" rx="6" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <text x="705" y="210" text-anchor="middle" font-size="9" font-weight="500" fill="var(--text-muted, #64748b)">Editor</text>
  </g>

  <!-- ==================== PATTERN 3: DEBATE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.1s" fill="freeze"/>
    <rect x="605" y="68" width="280" height="28" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="745" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-default, #e95420)">DEBATE</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
    <!-- Two debaters -->
    <rect x="655" y="108" width="90" height="34" rx="6" fill="#2563eb" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
    <text x="700" y="130" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Pro</text>

    <rect x="755" y="108" width="90" height="34" rx="6" fill="#dc2626" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <text x="800" y="130" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Con</text>

    <!-- Debate arrows -->
    <path d="M 700 142 L 700 170 L 755 170" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
    <path d="M 800 142 L 800 170 L 745 170" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

    <!-- Judge -->
    <rect x="700" y="190" width="100" height="32" rx="6" fill="#059669" filter="url(#shadow)"/>
    <text x="750" y="210" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Judge</text>
  </g>

  <!-- ==================== ROW 2 ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.3s" fill="freeze"/>
    <line x1="15" y1="245" x2="885" y2="245" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- PATTERN 4: PIPELINE -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.4s" fill="freeze"/>
    <rect x="15" y="258" width="280" height="28" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="155" y="277" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-default, #e95420)">PIPELINE</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    <rect x="20" y="298" width="85" height="36" rx="6" fill="#2563eb" filter="url(#shadow)"/>
    <text x="62" y="320" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Step A</text>
    <line x1="105" y1="316" x2="145" y2="316" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="150" y="298" width="85" height="36" rx="6" fill="#059669" filter="url(#shadow)"/>
    <text x="192" y="320" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Step B</text>
    <line x1="235" y1="316" x2="275" y2="316" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <rect x="280" y="298" width="85" height="36" rx="6" fill="var(--brand-default, #e95420)" filter="url(#shadow)"/>
    <text x="322" y="320" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Step C</text>
  </g>

  <!-- PATTERN 5: SWARM -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.6s" fill="freeze"/>
    <rect x="380" y="258" width="280" height="28" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="520" y="277" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-default, #e95420)">SWARM</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.7s" fill="freeze"/>
    <!-- Many simple agents -->
    <rect x="390" y="298" width="65" height="30" rx="5" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <text x="422" y="317" text-anchor="middle" font-size="8" font-weight="500" fill="var(--text-muted, #64748b)">Agent 1</text>
    <rect x="465" y="298" width="65" height="30" rx="5" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <text x="497" y="317" text-anchor="middle" font-size="8" font-weight="500" fill="var(--text-muted, #64748b)">Agent 2</text>
    <rect x="540" y="298" width="65" height="30" rx="5" fill="var(--bg-default, #ffffff)" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <text x="572" y="317" text-anchor="middle" font-size="8" font-weight="500" fill="var(--text-muted, #64748b)">Agent N</text>

    <!-- Competition arrows -->
    <path d="M 410 328 L 410 355 L 520 355 L 520 340" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
    <path d="M 497 328 L 497 355 L 520 355 L 520 340" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
    <path d="M 572 328 L 572 355 L 520 355 L 520 340" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)" fill="none"/>

    <!-- Winner -->
    <rect x="465" y="345" width="110" height="34" rx="6" fill="#059669" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.5s" begin="1.7s" repeatCount="indefinite"/>
    </rect>
    <text x="520" y="366" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Highest Confidence</text>
  </g>

  <!-- ==================== BOTTOM: COMPARISON TABLE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    <line x1="15" y1="400" x2="885" y2="400" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <text x="450" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text-default, #0f172a)">Pattern Selection Guide</text>
    <text x="450" y="438" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Staff+ insight: Start with a single agent. Add agents only when quality ceiling is insufficient.</text>

    <!-- Table -->
    <rect x="15" y="450" width="140" height="26" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="85" y="468" text-anchor="middle" font-size="9" font-weight="600" fill="var(--brand-default, #e95420)">Pattern</text>
    <rect x="155" y="450" width="200" height="26" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="255" y="468" text-anchor="middle" font-size="9" font-weight="600" fill="var(--brand-default, #e95420)">Best For</text>
    <rect x="355" y="450" width="140" height="26" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="425" y="468" text-anchor="middle" font-size="9" font-weight="600" fill="var(--brand-default, #e95420)">Complexity</text>
    <rect x="495" y="450" width="390" height="26" rx="4" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="690" y="468" text-anchor="middle" font-size="9" font-weight="600" fill="var(--brand-default, #e95420)">Example</text>

    <!-- Row 1 -->
    <rect x="15" y="478" width="140" height="22" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="85" y="493" text-anchor="middle" font-size="8" fill="var(--text-default, #0f172a)">Orchestrator</text>
    <rect x="155" y="478" width="200" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="255" y="493" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Multi-step with clear subtasks</text>
    <rect x="355" y="478" width="140" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="425" y="493" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Medium</text>
    <rect x="495" y="478" width="390" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="690" y="493" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Research → Outline → Draft → Fact-check</text>

    <!-- Row 2 -->
    <rect x="15" y="502" width="140" height="22" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="85" y="517" text-anchor="middle" font-size="8" fill="var(--text-default, #0f172a)">Supervisor</text>
    <rect x="155" y="502" width="200" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="255" y="517" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Quality-critical tasks</text>
    <rect x="355" y="502" width="140" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="425" y="517" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">High</text>
    <rect x="495" y="502" width="390" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="690" y="517" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Generate → Critic → Edit loop with human approval</text>

    <!-- Row 3 -->
    <rect x="15" y="526" width="140" height="22" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="85" y="541" text-anchor="middle" font-size="8" fill="var(--text-default, #0f172a)">Debate</text>
    <rect x="155" y="526" width="200" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="255" y="541" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">High uncertainty decisions</text>
    <rect x="355" y="526" width="140" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="425" y="541" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">High</text>
    <rect x="495" y="526" width="390" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="690" y="541" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Pro-Con debate → Judge selects best argument</text>

    <!-- Row 4 -->
    <rect x="15" y="550" width="140" height="22" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="85" y="565" text-anchor="middle" font-size="8" fill="var(--text-default, #0f172a)">Pipeline</text>
    <rect x="155" y="550" width="200" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="255" y="565" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Fixed sequential workflows</text>
    <rect x="355" y="550" width="140" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="425" y="565" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Low</text>
    <rect x="495" y="550" width="390" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="690" y="565" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Classify → Extract → Summarize → Format</text>

    <!-- Row 5 -->
    <rect x="15" y="574" width="140" height="22" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="85" y="589" text-anchor="middle" font-size="8" fill="var(--text-default, #0f172a)">Swarm</text>
    <rect x="155" y="574" width="200" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="255" y="589" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">High throughput, simple tasks</text>
    <rect x="355" y="574" width="140" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="425" y="589" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">Medium</text>
    <rect x="495" y="574" width="390" height="22" rx="3" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="690" y="589" text-anchor="middle" font-size="8" fill="var(--text-muted, #64748b)">100 agents → each tries → best confidence wins</text>
  </g>
</svg>
