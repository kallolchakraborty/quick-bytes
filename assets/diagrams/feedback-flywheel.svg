<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="700" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Feedback Loop — The AI Data Flywheel</text>
    <line x1="240" y1="36" x2="660" y2="36" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="54" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Continuous improvement: production → evaluation → retraining → deployment</text>
  </g>

  <!-- Central hub -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.4s" fill="freeze"/>
    <circle cx="450" cy="360" r="55" fill="var(--brand-default, #e95420)" filter="url(#shadow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="450" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">DATA</text>
    <text x="450" y="373" text-anchor="middle" font-size="10" font-weight="600" fill="#fde8dc">FLYWHEEL</text>
  </g>

  <!-- Circular arrows -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.5s" fill="freeze"/>
    <!-- Arrow arcs between nodes -->
    <path d="M 450 125 A 240 240 0 0 1 670 220" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;-10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 670 220 A 240 240 0 0 1 690 460" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;-10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 690 460 A 240 240 0 0 1 520 590" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;-10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 520 590 A 240 240 0 0 1 380 590" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;-10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 380 590 A 240 240 0 0 1 210 460" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;-10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 210 460 A 240 240 0 0 1 230 220" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;-10" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Node 1: Production Serving -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.6s" fill="freeze"/>
    <rect x="355" y="95" width="190" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#e95420" stroke-width="2" filter="url(#shadow)"/>
    <rect x="355" y="95" width="190" height="28" rx="10" fill="#e95420"/>
    <rect x="355" y="115" width="190" height="8" fill="#e95420"/>
    <text x="450" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PRODUCTION SERVING</text>
    <text x="370" y="142" font-size="9" fill="var(--text-default, #0f172a)">Model serves live traffic</text>
    <text x="370" y="152" font-size="8" fill="var(--text-muted, #64748b)">Log inputs, outputs, latency</text>
  </g>

  <!-- Node 2: Log & Sample -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.75s" fill="freeze"/>
    <rect x="620" y="190" width="190" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <rect x="620" y="190" width="190" height="28" rx="10" fill="#2563eb"/>
    <rect x="620" y="210" width="190" height="8" fill="#2563eb"/>
    <text x="715" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">LOG &amp; SAMPLE</text>
    <text x="635" y="237" font-size="9" fill="var(--text-default, #0f172a)">Stratified sampling of traffic</text>
    <text x="635" y="247" font-size="8" fill="var(--text-muted, #64748b)">Store raw + metadata</text>
  </g>

  <!-- Node 3: Evaluate -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.9s" fill="freeze"/>
    <rect x="645" y="430" width="190" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect x="645" y="430" width="190" height="28" rx="10" fill="#7c3aed"/>
    <rect x="645" y="450" width="190" height="8" fill="#7c3aed"/>
    <text x="740" y="452" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">EVALUATE</text>
    <text x="660" y="477" font-size="9" fill="var(--text-default, #0f172a)">Offline eval on test sets</text>
    <text x="660" y="487" font-size="8" fill="var(--text-muted, #64748b)">Drift detection on production logs</text>
  </g>

  <!-- Drift alert trigger -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.0s" fill="freeze"/>
    <rect x="700" y="375" width="80" height="22" rx="5" fill="#dc2626" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="740" y="390" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">DRIFT!</text>
    <!-- Alert arrow from Evaluate to Retrain -->
    <line x1="790" y1="450" x2="790" y2="495" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="802" y="477" font-size="7" fill="#dc2626" font-weight="600">trigger</text>
  </g>

  <!-- Node 4: Retrain -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.1s" fill="freeze"/>
    <rect x="680" y="500" width="190" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect x="680" y="500" width="190" height="28" rx="10" fill="#059669"/>
    <rect x="680" y="520" width="190" height="8" fill="#059669"/>
    <text x="775" y="522" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">RETRAIN</text>
    <text x="695" y="547" font-size="9" fill="var(--text-default, #0f172a)">Fine-tune / train new model</text>
    <text x="695" y="557" font-size="8" fill="var(--text-muted, #64748b)">With latest production data</text>
  </g>

  <!-- Node 5: Validate -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.25s" fill="freeze"/>
    <rect x="160" y="540" width="190" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect x="160" y="540" width="190" height="28" rx="10" fill="#7c3aed"/>
    <rect x="160" y="560" width="190" height="8" fill="#7c3aed"/>
    <text x="255" y="562" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">VALIDATE</text>
    <text x="175" y="587" font-size="9" fill="var(--text-default, #0f172a)">Shadow deployment comparison</text>
    <text x="175" y="597" font-size="8" fill="var(--text-muted, #64748b)">Canary analysis, A/B testing</text>
  </g>

  <!-- Node 6: Deploy -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.4s" fill="freeze"/>
    <rect x="100" y="190" width="190" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <rect x="100" y="190" width="190" height="28" rx="10" fill="#2563eb"/>
    <rect x="100" y="210" width="190" height="8" fill="#2563eb"/>
    <text x="195" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DEPLOY</text>
    <text x="115" y="237" font-size="9" fill="var(--text-default, #0f172a)">Roll out with gates</text>
    <text x="115" y="247" font-size="8" fill="var(--text-muted, #64748b)">1% → 5% → 20% → 100%</text>
  </g>

  <!-- Deployment gate -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    <rect x="255" y="220" width="70" height="22" rx="5" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="290" y="234" text-anchor="middle" font-size="8" font-weight="600" fill="#059669">✓ PASS</text>
  </g>

  <!-- Validation gate -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    <rect x="495" y="560" width="70" height="22" rx="5" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="530" y="574" text-anchor="middle" font-size="8" font-weight="600" fill="#059669">✓ PASS</text>
  </g>

  <!-- Legend -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
    <line x1="50" y1="635" x2="850" y2="635" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="655" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text-default, #0f172a)">Key Metric</text>
    <text x="450" y="675" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Flywheel velocity: time from production log → updated model deployed. Target: &lt;24h at FAANG scale.</text>
  </g>
</svg>