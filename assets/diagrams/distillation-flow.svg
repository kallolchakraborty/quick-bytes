<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <filter id="shadowDeep">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#c34113" flood-opacity="0.20"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <marker id="arrowLine" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#64748b"/>
    </marker>
    <linearGradient id="teacherGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c34113"/>
      <stop offset="100%" stop-color="#e95420"/>
    </linearGradient>
    <linearGradient id="studentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Knowledge Distillation Flow</text>
    <text x="450" y="46" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Large Teacher → Small Student: Deploy GPT-4 quality at GPT-3.5 cost</text>
    <line x1="180" y1="54" x2="720" y2="54" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- ==================== TOP: TEACHER + DATA ==================== -->

  <!-- Input Data -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <rect x="50" y="75" width="160" height="90" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <text x="130" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-default, #0f172a)">Input Data</text>
    <line x1="60" y1="108" x2="200" y2="108" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="130" y="124" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Production queries</text>
    <text x="130" y="140" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">+ synthetic data</text>
    <text x="130" y="156" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">+ edge cases</text>

    <!-- Arrow from Input to Teacher -->
    <line x1="210" y1="120" x2="265" y2="120" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Teacher Model -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/>
    <rect x="270" y="70" width="200" height="100" rx="12" fill="url(#teacherGrad)" filter="url(#shadowDeep)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="270" y="70" width="200" height="30" rx="12" fill="rgba(0,0,0,0.15)"/>
    <rect x="270" y="90" width="200" height="10" fill="rgba(0,0,0,0.15)"/>
    <text x="370" y="93" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">TEACHER</text>
    <text x="370" y="113" text-anchor="middle" font-size="10" fill="#fde8dc">GPT-4 / Claude 3 Opus</text>
    <text x="370" y="130" text-anchor="middle" font-size="10" fill="#fde8dc">175B - 1.8T params</text>
    <text x="370" y="148" text-anchor="middle" font-size="10" fill="#fde8dc">Generates soft targets</text>
    <text x="370" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">VERY EXPENSIVE</text>

    <!-- Pulsing glow effect -->
    <rect x="268" y="68" width="204" height="104" rx="14" fill="none" stroke="#ffffff" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.3;0" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Arrow from Teacher to Soft Labels -->
  <line x1="470" y1="120" x2="520" y2="120" stroke="var(--brand-default, #e95420)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Soft Labels -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze"/>
    <rect x="525" y="75" width="170" height="90" rx="8" fill="var(--bg-default, #ffffff)" stroke="#c34113" stroke-width="2" filter="url(#shadowDeep)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="610" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#c34113">Soft Targets</text>
    <line x1="535" y1="108" x2="685" y2="108" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <text x="610" y="124" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Token probability</text>
    <text x="610" y="140" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">distributions</text>
    <text x="610" y="156" font-size="9" fill="var(--text-muted, #64748b)">"Dark knowledge"</text>

    <!-- Probability distribution mini-vis -->
    <rect x="535" y="135" width="60" height="22" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <rect x="537" y="139" width="20" height="14" rx="2" fill="#c34113" opacity="0.7"/>
    <rect x="559" y="141" width="12" height="10" rx="2" fill="#e95420" opacity="0.5"/>
    <rect x="573" y="143" width="8" height="6" rx="2" fill="#e95420" opacity="0.3"/>
  </g>

  <!-- ==================== MIDDLE: DISTILLATION PROCESS ==================== -->

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/>
    <line x1="50" y1="185" x2="850" y2="185" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <!-- Loss function -->
    <rect x="200" y="200" width="500" height="55" rx="10" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <text x="450" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-default, #0f172a)">Distillation Loss Function</text>
    <text x="450" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="var(--brand-default, #e95420)">L = α · KL(P_teacher || P_student) + (1-α) · CE(y_true, P_student)</text>
  </g>

  <!-- Arrow down from Soft Targets to Student -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
    <line x1="610" y1="165" x2="610" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowLine)" stroke-dasharray="5,3"/>
    <text x="630" y="230" font-size="9" fill="var(--text-muted, #64748b)">Minimize KL divergence</text>
  </g>

  <!-- Student Model -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
    <rect x="270" y="280" width="200" height="95" rx="12" fill="url(#studentGrad)" filter="url(#shadowDeep)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" begin="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="270" y="280" width="200" height="28" rx="12" fill="rgba(0,0,0,0.1)"/>
    <rect x="270" y="300" width="200" height="8" fill="rgba(0,0,0,0.1)"/>
    <text x="370" y="301" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">STUDENT</text>
    <text x="370" y="322" text-anchor="middle" font-size="10" fill="#ecfdf5">7B - 13B params</text>
    <text x="370" y="340" text-anchor="middle" font-size="10" fill="#ecfdf5">Learns teacher's distribution</text>
    <text x="370" y="358" text-anchor="middle" font-size="10" fill="#ecfdf5">Faster, cheaper, smaller</text>
    <text x="370" y="372" text-anchor="middle" font-size="11" font-weight="600" fill="#064e3b">20-50× CHEAPER</text>
  </g>

  <!-- ==================== BOTTOM: RESULTS ==================== -->

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/>
    <line x1="50" y1="395" x2="850" y2="395" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <!-- Quality retention -->
    <rect x="50" y="410" width="240" height="80" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="170" y="435" text-anchor="middle" font-size="12" font-weight="700" fill="var(--brand-default, #e95420)">Quality Retention</text>
    <text x="170" y="455" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">95-99%</text>
    <text x="170" y="475" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">of teacher quality</text>

    <!-- Cost reduction -->
    <rect x="330" y="410" width="240" height="80" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="450" y="435" text-anchor="middle" font-size="12" font-weight="700" fill="var(--brand-default, #e95420)">Cost Reduction</text>
    <text x="450" y="455" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">20-50×</text>
    <text x="450" y="475" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">per query cost savings</text>

    <!-- Latency -->
    <rect x="610" y="410" width="240" height="80" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--brand-default, #e95420)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="730" y="435" text-anchor="middle" font-size="12" font-weight="700" fill="var(--brand-default, #e95420)">Latency</text>
    <text x="730" y="455" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">5-10× faster</text>
    <text x="730" y="475" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">vs teacher model</text>
  </g>

  <!-- Deployment options -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
    <line x1="50" y1="508" x2="850" y2="508" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <text x="450" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text-default, #0f172a)">Production Deployment Options</text>

    <rect x="50" y="540" width="190" height="45" rx="6" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="145" y="558" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Cloud Inference</text>
    <text x="145" y="575" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Deploy at scale on GPUs</text>

    <rect x="260" y="540" width="190" height="45" rx="6" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="355" y="558" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Edge / On-device</text>
    <text x="355" y="575" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">1-3B params on mobile</text>

    <rect x="470" y="540" width="190" height="45" rx="6" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="565" y="558" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Real-time APIs</text>
    <text x="565" y="575" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">&lt;100ms latency requirements</text>

    <rect x="680" y="540" width="170" height="45" rx="6" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
    <text x="765" y="558" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Cost-sensitive</text>
    <text x="765" y="575" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">High volume, low budget</text>
  </g>
</svg>
