<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="var(--brand-default, #e95420)"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="650" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">AI Orchestration Stack</text>
    <line x1="290" y1="36" x2="610" y2="36" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="54" text-anchor="middle" font-size="11" fill="var(--text-muted, #64748b)">Layered orchestration hierarchy — each layer delegates to the one below</text>
  </g>

  <!-- Layer 6: Task Orchestration -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.5s" fill="freeze"/>
    <rect x="230" y="72" width="440" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect x="230" y="72" width="440" height="28" rx="10" fill="#7c3aed"/>
    <rect x="230" y="92" width="440" height="8" fill="#7c3aed"/>
    <text x="450" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">TASK ORCHESTRATION</text>
    <text x="250" y="116" font-size="10" fill="var(--text-default, #0f172a)">Plan decomposition, dependency resolution, DAG execution</text>
    <rect x="620" y="101" width="30" height="20" rx="4" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="635" y="114" text-anchor="middle" font-size="8" fill="var(--brand-default, #e95420)" font-weight="700">T6</text>
  </g>

  <!-- Layer 5: Workflow Orchestration -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.65s" fill="freeze"/>
    <rect x="230" y="147" width="440" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <rect x="230" y="147" width="440" height="28" rx="10" fill="#2563eb"/>
    <rect x="230" y="167" width="440" height="8" fill="#2563eb"/>
    <text x="450" y="167" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">WORKFLOW ORCHESTRATION</text>
    <text x="250" y="191" font-size="10" fill="var(--text-default, #0f172a)">State machines, DAG pipelines, retry policies, idempotency</text>
    <rect x="620" y="176" width="30" height="20" rx="4" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="635" y="189" text-anchor="middle" font-size="8" fill="var(--brand-default, #e95420)" font-weight="700">T5</text>
  </g>

  <!-- Layer 4: Agent Orchestration -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.8s" fill="freeze"/>
    <rect x="230" y="222" width="440" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect x="230" y="222" width="440" height="28" rx="10" fill="#059669"/>
    <rect x="230" y="242" width="440" height="8" fill="#059669"/>
    <text x="450" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">AGENT ORCHESTRATION</text>
    <text x="250" y="266" font-size="10" fill="var(--text-default, #0f172a)">Agent delegation, handoff protocols, HITL, tool delegation graphs</text>
    <rect x="620" y="251" width="30" height="20" rx="4" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="635" y="264" text-anchor="middle" font-size="8" fill="var(--brand-default, #e95420)" font-weight="700">T4</text>
  </g>

  <!-- Layer 3: Model Orchestration -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.95s" fill="freeze"/>
    <rect x="230" y="297" width="440" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#e95420" stroke-width="2" filter="url(#shadow)"/>
    <rect x="230" y="297" width="440" height="28" rx="10" fill="#e95420"/>
    <rect x="230" y="317" width="440" height="8" fill="#e95420"/>
    <text x="450" y="317" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">MODEL ORCHESTRATION</text>
    <text x="250" y="341" font-size="10" fill="var(--text-default, #0f172a)">Model routing, cascading, fallback chains, cost-quality optimization</text>
    <rect x="620" y="326" width="30" height="20" rx="4" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="635" y="339" text-anchor="middle" font-size="8" fill="var(--brand-default, #e95420)" font-weight="700">T3</text>
  </g>

  <!-- Layer 2: Resource Orchestration -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.1s" fill="freeze"/>
    <rect x="230" y="372" width="440" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <rect x="230" y="372" width="440" height="28" rx="10" fill="#dc2626"/>
    <rect x="230" y="392" width="440" height="8" fill="#dc2626"/>
    <text x="450" y="392" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">RESOURCE ORCHESTRATION</text>
    <text x="250" y="416" font-size="10" fill="var(--text-default, #0f172a)">GPU/TPU scheduling, gang scheduling, elastic scaling, preemption</text>
    <rect x="620" y="401" width="30" height="20" rx="4" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="635" y="414" text-anchor="middle" font-size="8" fill="var(--brand-default, #e95420)" font-weight="700">T2</text>
  </g>

  <!-- Layer 1: Governance & Compliance -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.25s" fill="freeze"/>
    <rect x="230" y="447" width="440" height="60" rx="10" fill="var(--bg-default, #ffffff)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect x="230" y="447" width="440" height="28" rx="10" fill="#7c3aed"/>
    <rect x="230" y="467" width="440" height="8" fill="#7c3aed"/>
    <text x="450" y="467" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">GOVERNANCE &amp; COMPLIANCE</text>
    <text x="250" y="491" font-size="10" fill="var(--text-default, #0f172a)">Model registry, audit trails, approval gates, lineage tracking</text>
    <rect x="620" y="476" width="30" height="20" rx="4" fill="var(--brand-medium, rgba(233,84,32,0.15))"/>
    <text x="635" y="489" text-anchor="middle" font-size="8" fill="var(--brand-default, #e95420)" font-weight="700">T1</text>
  </g>

  <!-- Arrows between layers (bidirectional data flow) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
    <!-- T6 → T5 -->
    <line x1="215" y1="102" x2="215" y2="177" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGray)">
      <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="685" y1="132" x2="685" y2="147" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
    <!-- T5 → T4 -->
    <line x1="215" y1="177" x2="215" y2="252" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGray)">
      <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="685" y1="207" x2="685" y2="222" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
    <!-- T4 → T3 -->
    <line x1="215" y1="252" x2="215" y2="327" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGray)">
      <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="685" y1="282" x2="685" y2="297" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
    <!-- T3 → T2 -->
    <line x1="215" y1="327" x2="215" y2="402" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGray)">
      <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="685" y1="357" x2="685" y2="372" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
    <!-- T2 → T1 -->
    <line x1="215" y1="402" x2="215" y2="477" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGray)">
      <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="685" y1="432" x2="685" y2="447" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  </g>

  <!-- Legend / Callout -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/>
    <line x1="50" y1="545" x2="850" y2="545" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
    <text x="450" y="565" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text-default, #0f172a)">Orchestration Flow</text>
    <text x="450" y="583" text-anchor="middle" font-size="10" fill="var(--text-muted, #64748b)">Upward: requests, context, observations. Downward: delegations, tool calls, resource allocations.</text>

    <rect x="140" y="595" width="180" height="24" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <circle cx="155" cy="607" r="4" fill="#e95420"/>
    <text x="165" y="611" font-size="9" fill="var(--text-muted, #64748b)">Delegation (down)</text>

    <rect x="360" y="595" width="180" height="24" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <circle cx="375" cy="607" r="4" fill="#94a3b8"/>
    <text x="385" y="611" font-size="9" fill="var(--text-muted, #64748b)">Data flow (up/down)</text>

    <rect x="580" y="595" width="180" height="24" rx="5" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="0.5"/>
    <circle cx="595" cy="607" r="4" fill="#7c3aed"/>
    <text x="605" y="611" font-size="9" fill="var(--text-muted, #64748b)">Governance (cross-cutting)</text>
  </g>
</svg>