<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Ubuntu, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <linearGradient id="cacheGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowGreen">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowDn" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#E95420"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#059669"/>
    </marker>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#E95420"/>
    </marker>
  </defs>

  <rect width="900" height="550" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.1s" fill="freeze"/>
    <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#C34113">KV Cache: Token-by-Token Generation</text>
    <text x="450" y="46" text-anchor="middle" font-size="11" fill="#64748b">Each step: compute one new K,V pair, append to cache, attend to all cached entries</text>
    <line x1="200" y1="54" x2="700" y2="54" stroke="#E95420" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- ==================== STEP 1 ==================== -->
  <g id="kv-step-1" opacity="1">
    <!-- Input token -->
    <rect x="40" y="75" width="80" height="32" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">"The"</text>
    <text x="80" y="118" text-anchor="middle" font-size="8" fill="#64748b">Input</text>

    <!-- Arrow to compute -->
    <line x1="120" y1="91" x2="160" y2="91" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <!-- K,V computation -->
    <rect x="165" y="75" width="110" height="32" rx="16" fill="#fff5eb" stroke="#E95420" stroke-width="1.5"/>
    <text x="220" y="96" text-anchor="middle" font-size="10" font-weight="600" fill="#C34113">K₁, V₁</text>

    <!-- Arrow to cache -->
    <line x1="275" y1="91" x2="320" y2="91" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <!-- Cache box -->
    <rect x="325" y="72" width="130" height="38" rx="8" fill="url(#cacheGrad)" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#shadowGreen)"/>
    <text x="390" y="86" text-anchor="middle" font-size="9" font-weight="600" fill="#059669">Cache:</text>
    <rect x="340" y="92" width="40" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="360" y="103" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₁V₁</text>

    <!-- Arrow to attention -->
    <line x1="455" y1="91" x2="500" y2="91" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <!-- Attention block -->
    <rect x="505" y="70" width="120" height="42" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="2;3;2" dur="2s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="565" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">Attention</text>
    <text x="565" y="102" text-anchor="middle" font-size="8" fill="#94a3b8">Q₁ × Cache</text>

    <!-- Arrow to output -->
    <line x1="625" y1="91" x2="670" y2="91" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <!-- Output -->
    <rect x="675" y="75" width="80" height="32" rx="8" fill="#E95420" filter="url(#shadow)"/>
    <text x="715" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">"cat"</text>

    <!-- Step label -->
    <rect x="40" y="125" width="50" height="18" rx="4" fill="#E95420"/>
    <text x="65" y="137" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">Step 1</text>
  </g>

  <!-- ==================== STEP 2 ==================== -->
  <g id="kv-step-2" opacity="0">
    <rect x="40" y="155" width="80" height="32" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">"cat"</text>
    <text x="80" y="198" text-anchor="middle" font-size="8" fill="#64748b">Input</text>

    <line x1="120" y1="171" x2="160" y2="171" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="165" y="155" width="110" height="32" rx="16" fill="#fff5eb" stroke="#E95420" stroke-width="1.5"/>
    <text x="220" y="176" text-anchor="middle" font-size="10" font-weight="600" fill="#C34113">K₂, V₂</text>

    <line x1="275" y1="171" x2="320" y2="171" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="325" y="152" width="180" height="38" rx="8" fill="url(#cacheGrad)" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#shadowGreen)"/>
    <text x="415" y="166" text-anchor="middle" font-size="9" font-weight="600" fill="#059669">Cache:</text>
    <rect x="340" y="172" width="40" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="360" y="183" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₁V₁</text>
    <rect x="388" y="172" width="40" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="408" y="183" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₂V₂</text>

    <line x1="505" y1="171" x2="500" y2="171" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="505" y="150" width="120" height="42" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)"/>
    <text x="565" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">Attention</text>
    <text x="565" y="182" text-anchor="middle" font-size="8" fill="#94a3b8">Q₂ × Cache</text>

    <line x1="625" y1="171" x2="670" y2="171" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="675" y="155" width="80" height="32" rx="8" fill="#E95420" filter="url(#shadow)"/>
    <text x="715" y="176" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">"sat"</text>

    <rect x="40" y="205" width="50" height="18" rx="4" fill="#E95420"/>
    <text x="65" y="217" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">Step 2</text>
  </g>

  <!-- ==================== STEP 3 ==================== -->
  <g id="kv-step-3" opacity="0">
    <rect x="40" y="235" width="80" height="32" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">"sat"</text>
    <text x="80" y="278" text-anchor="middle" font-size="8" fill="#64748b">Input</text>

    <line x1="120" y1="251" x2="160" y2="251" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="165" y="235" width="110" height="32" rx="16" fill="#fff5eb" stroke="#E95420" stroke-width="1.5"/>
    <text x="220" y="256" text-anchor="middle" font-size="10" font-weight="600" fill="#C34113">K₃, V₃</text>

    <line x1="275" y1="251" x2="320" y2="251" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="325" y="232" width="230" height="38" rx="8" fill="url(#cacheGrad)" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#shadowGreen)"/>
    <text x="440" y="246" text-anchor="middle" font-size="9" font-weight="600" fill="#059669">Cache:</text>
    <rect x="340" y="252" width="40" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="360" y="263" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₁V₁</text>
    <rect x="388" y="252" width="40" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="408" y="263" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₂V₂</text>
    <rect x="436" y="252" width="40" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="456" y="263" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₃V₃</text>

    <line x1="555" y1="251" x2="500" y2="251" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="505" y="230" width="120" height="42" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)"/>
    <text x="565" y="248" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">Attention</text>
    <text x="565" y="262" text-anchor="middle" font-size="8" fill="#94a3b8">Q₃ × Cache</text>

    <line x1="625" y1="251" x2="670" y2="251" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="675" y="235" width="80" height="32" rx="8" fill="#E95420" filter="url(#shadow)"/>
    <text x="715" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">"on"</text>

    <rect x="40" y="285" width="50" height="18" rx="4" fill="#E95420"/>
    <text x="65" y="297" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">Step 3</text>
  </g>

  <!-- ==================== STEP 4 ==================== -->
  <g id="kv-step-4" opacity="0">
    <rect x="40" y="315" width="80" height="32" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">"on"</text>
    <text x="80" y="358" text-anchor="middle" font-size="8" fill="#64748b">Input</text>

    <line x1="120" y1="331" x2="160" y2="331" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="165" y="315" width="110" height="32" rx="16" fill="#fff5eb" stroke="#E95420" stroke-width="1.5"/>
    <text x="220" y="336" text-anchor="middle" font-size="10" font-weight="600" fill="#C34113">K₄, V₄</text>

    <line x1="275" y1="331" x2="320" y2="331" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="325" y="312" width="280" height="38" rx="8" fill="url(#cacheGrad)" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#shadowGreen)"/>
    <text x="465" y="326" text-anchor="middle" font-size="9" font-weight="600" fill="#059669">Cache:</text>
    <rect x="340" y="332" width="38" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="359" y="343" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₁V₁</text>
    <rect x="385" y="332" width="38" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="404" y="343" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₂V₂</text>
    <rect x="430" y="332" width="38" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="449" y="343" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₃V₃</text>
    <rect x="475" y="332" width="38" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="494" y="343" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₄V₄</text>

    <line x1="605" y1="331" x2="500" y2="331" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="505" y="310" width="120" height="42" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)"/>
    <text x="565" y="328" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">Attention</text>
    <text x="565" y="342" text-anchor="middle" font-size="8" fill="#94a3b8">Q₄ × Cache</text>

    <line x1="625" y1="331" x2="670" y2="331" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="675" y="315" width="80" height="32" rx="8" fill="#E95420" filter="url(#shadow)"/>
    <text x="715" y="336" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">"the"</text>

    <rect x="40" y="365" width="50" height="18" rx="4" fill="#E95420"/>
    <text x="65" y="377" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">Step 4</text>
  </g>

  <!-- ==================== STEP 5 ==================== -->
  <g id="kv-step-5" opacity="0">
    <rect x="40" y="395" width="80" height="32" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">"the"</text>
    <text x="80" y="438" text-anchor="middle" font-size="8" fill="#64748b">Input</text>

    <line x1="120" y1="411" x2="160" y2="411" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="165" y="395" width="110" height="32" rx="16" fill="#fff5eb" stroke="#E95420" stroke-width="1.5"/>
    <text x="220" y="416" text-anchor="middle" font-size="10" font-weight="600" fill="#C34113">K₅, V₅</text>

    <line x1="275" y1="411" x2="320" y2="411" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="325" y="392" width="330" height="38" rx="8" fill="url(#cacheGrad)" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#shadowGreen)"/>
    <text x="490" y="406" text-anchor="middle" font-size="9" font-weight="600" fill="#059669">Cache:</text>
    <rect x="340" y="412" width="36" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="358" y="423" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₁V₁</text>
    <rect x="383" y="412" width="36" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="401" y="423" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₂V₂</text>
    <rect x="426" y="412" width="36" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="444" y="423" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₃V₃</text>
    <rect x="469" y="412" width="36" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="487" y="423" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₄V₄</text>
    <rect x="512" y="412" width="36" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="530" y="423" text-anchor="middle" font-size="7" font-weight="600" fill="#059669">K₅V₅</text>

    <line x1="655" y1="411" x2="500" y2="411" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="505" y="390" width="120" height="42" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)"/>
    <text x="565" y="408" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">Attention</text>
    <text x="565" y="422" text-anchor="middle" font-size="8" fill="#94a3b8">Q₅ × Cache</text>

    <line x1="625" y1="411" x2="670" y2="411" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowRight)"/>

    <rect x="675" y="395" width="80" height="32" rx="8" fill="#E95420" filter="url(#shadow)"/>
    <text x="715" y="416" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">"mat"</text>

    <rect x="40" y="445" width="50" height="18" rx="4" fill="#E95420"/>
    <text x="65" y="457" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">Step 5</text>
  </g>

  <!-- ==================== KEY INSIGHT BOX ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <rect x="40" y="480" width="820" height="52" rx="10" fill="#fff5eb" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="500" font-size="11" font-weight="700" fill="#C34113">Key insight:</text>
    <text x="152" y="500" font-size="11" fill="#64748b">Each step only computes ONE new K,V pair and appends it to the cache.</text>
    <text x="60" y="520" font-size="10" fill="#64748b">Attention reads from the full cache (all previous tokens) but only ONE new K,V is computed per step → O(n) total work.</text>
  </g>

  <!-- ==================== FLOW PARTICLES ==================== -->
  <circle r="2.5" fill="#059669" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0;0;0;0;0" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="220;220;390;390;565;565;715;715" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="91;91;91;91;91;91;91;91" dur="4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ==================== CACHE GROWTH INDICATOR ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.3s" fill="freeze"/>
    <rect x="780" y="65" width="100" height="380" rx="10" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>
    <text x="830" y="82" text-anchor="middle" font-size="8" font-weight="600" fill="#059669" transform="rotate(-90,830,255)">CACHE GROWS →</text>
  </g>

  <!-- ==================== STEP NUMBERS (right side vertical) ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.3s" fill="freeze"/>
    <text x="870" y="96" text-anchor="middle" font-size="9" fill="#94a3b8">t=1</text>
    <text x="870" y="176" text-anchor="middle" font-size="9" fill="#94a3b8">t=2</text>
    <text x="870" y="256" text-anchor="middle" font-size="9" fill="#94a3b8">t=3</text>
    <text x="870" y="336" text-anchor="middle" font-size="9" fill="#94a3b8">t=4</text>
    <text x="870" y="416" text-anchor="middle" font-size="9" fill="#94a3b8">t=5</text>
  </g>
</svg>
