<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowDn" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#E95420"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#E95420"/>
    </marker>
    <linearGradient id="draftGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="100%" stop-color="#fde8dc"/>
    </linearGradient>
    <linearGradient id="verifyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" fill="none"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#C34113">Speculative Decoding &amp; KV Cache</text>
  <line x1="200" y1="38" x2="700" y2="38" stroke="#E95420" stroke-width="1" opacity="0.3"/>

  <!-- ==================== DRAFT MODEL (TOP) ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <rect x="120" y="50" width="450" height="32" rx="6" fill="url(#draftGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="345" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#C34113">Draft Model (7B, fast)</text>
    <text x="580" y="70" font-size="9" fill="#94a3b8">Generates candidates sequentially</text>
  </g>

  <!-- Draft tokens -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
    <!-- Token 1: "The" -->
    <rect x="120" y="95" width="80" height="40" rx="8" fill="url(#draftGrad)" stroke="#f0883e" stroke-width="1.5"/>
    <text x="160" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#C34113">The</text>
    <text x="160" y="130" text-anchor="middle" font-size="7" fill="#94a3b8">t₁</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
    <!-- Arrow -->
    <line x1="200" y1="115" x2="220" y2="115" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <!-- Token 2: "cat" -->
    <rect x="224" y="95" width="80" height="40" rx="8" fill="url(#draftGrad)" stroke="#f0883e" stroke-width="1.5"/>
    <text x="264" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#C34113">cat</text>
    <text x="264" y="130" text-anchor="middle" font-size="7" fill="#94a3b8">t₂</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
    <line x1="304" y1="115" x2="324" y2="115" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <!-- Token 3: "sat" -->
    <rect x="328" y="95" width="80" height="40" rx="8" fill="url(#draftGrad)" stroke="#f0883e" stroke-width="1.5"/>
    <text x="368" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#C34113">sat</text>
    <text x="368" y="130" text-anchor="middle" font-size="7" fill="#94a3b8">t₃</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    <line x1="408" y1="115" x2="428" y2="115" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <!-- Token 4: "on" -->
    <rect x="432" y="95" width="80" height="40" rx="8" fill="url(#draftGrad)" stroke="#f0883e" stroke-width="1.5"/>
    <text x="472" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#C34113">on</text>
    <text x="472" y="130" text-anchor="middle" font-size="7" fill="#94a3b8">t₄</text>
  </g>

  <!-- KV cache blocks under draft tokens -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    <rect x="130" y="140" width="60" height="14" rx="3" fill="#E95420" opacity="0.3"/>
    <text x="160" y="150" text-anchor="middle" font-size="6" fill="#C34113">K₁V₁</text>
    <rect x="234" y="140" width="60" height="14" rx="3" fill="#E95420" opacity="0.3"/>
    <text x="264" y="150" text-anchor="middle" font-size="6" fill="#C34113">K₂V₂</text>
    <rect x="338" y="140" width="60" height="14" rx="3" fill="#E95420" opacity="0.3"/>
    <text x="368" y="150" text-anchor="middle" font-size="6" fill="#C34113">K₃V₃</text>
    <rect x="442" y="140" width="60" height="14" rx="3" fill="#E95420" opacity="0.3"/>
    <text x="472" y="150" text-anchor="middle" font-size="6" fill="#C34113">K₄V₄</text>
    <text x="345" y="168" text-anchor="middle" font-size="8" fill="#94a3b8">Draft KV cache entries</text>
  </g>

  <!-- ==================== VERIFICATION (MIDDLE) ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2s" fill="freeze"/>
    <!-- Arrow down -->
    <line x1="345" y1="175" x2="345" y2="195" stroke="#C34113" stroke-width="2" marker-end="url(#arrowDn)"/>
    <text x="345" y="192" text-anchor="middle" font-size="9" font-weight="600" fill="#C34113">Verify all in parallel</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.2s" fill="freeze"/>
    <rect x="120" y="200" width="450" height="32" rx="6" fill="url(#verifyGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="345" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">Target Model (70B, accurate)</text>
    <text x="580" y="220" font-size="9" fill="#94a3b8">Verifies all drafts at once</text>
  </g>

  <!-- Verification dashed lines -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.5s" fill="freeze"/>
    <line x1="160" y1="232" x2="160" y2="265" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="264" y1="232" x2="264" y2="265" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="368" y1="232" x2="368" y2="265" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="472" y1="232" x2="472" y2="265" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- ==================== RESULT (BOTTOM) ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3s" fill="freeze"/>
    <text x="345" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">Verification Result</text>
  </g>

  <!-- Token 1: Accepted -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.1s" fill="freeze"/>
    <rect x="120" y="290" width="80" height="44" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="160" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">The</text>
    <text x="160" y="326" text-anchor="middle" font-size="14" fill="#10b981">✓</text>
  </g>

  <!-- Token 2: Accepted -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.2s" fill="freeze"/>
    <rect x="224" y="290" width="80" height="44" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="264" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">cat</text>
    <text x="264" y="326" text-anchor="middle" font-size="14" fill="#10b981">✓</text>
  </g>

  <!-- Token 3: Rejected -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.3s" fill="freeze"/>
    <rect x="328" y="290" width="80" height="44" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="368" y="306" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">sat</text>
    <text x="368" y="322" text-anchor="middle" font-size="14" fill="#ef4444">✗</text>
    <text x="368" y="332" text-anchor="middle" font-size="6" fill="#dc2626">wants 'is'</text>
  </g>

  <!-- Token 4: Rejected -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.4s" fill="freeze"/>
    <rect x="432" y="290" width="80" height="44" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="472" y="306" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">on</text>
    <text x="472" y="322" text-anchor="middle" font-size="14" fill="#ef4444">✗</text>
    <text x="472" y="332" text-anchor="middle" font-size="6" fill="#dc2626">also rejected</text>
  </g>

  <!-- ==================== CACHE STATE UPDATE ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4s" fill="freeze"/>
    <text x="345" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">KV Cache Update</text>

    <!-- Before -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.1s" fill="freeze"/>
      <text x="120" y="378" font-size="9" font-weight="600" fill="#475569">Before:</text>
      <rect x="180" y="368" width="40" height="18" rx="3" fill="#E95420" opacity="0.3"/>
      <text x="200" y="380" text-anchor="middle" font-size="7" fill="#C34113">K₁</text>
      <rect x="224" y="368" width="40" height="18" rx="3" fill="#E95420" opacity="0.3"/>
      <text x="244" y="380" text-anchor="middle" font-size="7" fill="#C34113">K₂</text>
      <rect x="268" y="368" width="40" height="18" rx="3" fill="#E95420" opacity="0.3"/>
      <text x="288" y="380" text-anchor="middle" font-size="7" fill="#C34113">K₃</text>
      <rect x="312" y="368" width="40" height="18" rx="3" fill="#E95420" opacity="0.3"/>
      <text x="332" y="380" text-anchor="middle" font-size="7" fill="#C34113">K₄</text>
    </g>

    <!-- Arrow -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.3s" fill="freeze"/>
      <line x1="360" y1="377" x2="390" y2="377" stroke="#C34113" stroke-width="1.5" marker-end="url(#arrowR)"/>
      <text x="375" y="373" text-anchor="middle" font-size="7" fill="#dc2626">truncate</text>
    </g>

    <!-- After -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.4s" fill="freeze"/>
      <text x="400" y="378" font-size="9" font-weight="600" fill="#475569">After:</text>
      <rect x="450" y="368" width="40" height="18" rx="3" fill="#10b981" opacity="0.3"/>
      <text x="470" y="380" text-anchor="middle" font-size="7" fill="#059669">K₁</text>
      <rect x="494" y="368" width="40" height="18" rx="3" fill="#10b981" opacity="0.3"/>
      <text x="514" y="380" text-anchor="middle" font-size="7" fill="#059669">K₂</text>
      <rect x="538" y="368" width="48" height="18" rx="3" fill="#10b981" opacity="0.5" stroke="#10b981" stroke-width="1"/>
      <text x="562" y="380" text-anchor="middle" font-size="7" fill="#059669" font-weight="600">K₃_target</text>
    </g>

    <text x="345" y="405" text-anchor="middle" font-size="8" fill="#94a3b8">Keep K₁,K₂ (accepted) · Replace K₃ with target's token · Drop K₄</text>
  </g>

  <!-- ==================== ACCEPTANCE RATE MINI CHART ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.5s" fill="freeze"/>
    <rect x="620" y="280" width="250" height="120" rx="8" fill="#fff5eb" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="745" y="300" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">Acceptance Rate → Speedup</text>

    <!-- Mini bar chart -->
    <rect x="650" y="360" width="30" height="30" rx="2" fill="#E95420" opacity="0.3"/>
    <rect x="650" y="370" width="30" height="20" rx="2" fill="#E95420" opacity="0.7"/>
    <text x="665" y="355" text-anchor="middle" font-size="7" fill="#475569">30%</text>
    <text x="665" y="398" text-anchor="middle" font-size="7" fill="#475569">1.5×</text>

    <rect x="695" y="360" width="30" height="30" rx="2" fill="#E95420" opacity="0.3"/>
    <rect x="695" y="355" width="30" height="35" rx="2" fill="#E95420" opacity="0.7"/>
    <text x="710" y="355" text-anchor="middle" font-size="7" fill="#475569">50%</text>
    <text x="710" y="398" text-anchor="middle" font-size="7" fill="#475569">2×</text>

    <rect x="740" y="360" width="30" height="30" rx="2" fill="#E95420" opacity="0.3"/>
    <rect x="740" y="340" width="30" height="50" rx="2" fill="#E95420" opacity="0.7"/>
    <text x="755" y="355" text-anchor="middle" font-size="7" fill="#475569">70%</text>
    <text x="755" y="398" text-anchor="middle" font-size="7" fill="#475569">3×</text>

    <rect x="785" y="360" width="30" height="30" rx="2" fill="#E95420" opacity="0.3"/>
    <rect x="785" y="330" width="30" height="60" rx="2" fill="#E95420" opacity="0.8"/>
    <text x="800" y="355" text-anchor="middle" font-size="7" fill="#475569">90%</text>
    <text x="800" y="398" text-anchor="middle" font-size="7" fill="#475569">5×</text>

    <!-- Axes -->
    <line x1="645" y1="390" x2="820" y2="390" stroke="#cbd5e1" stroke-width="0.5"/>
    <text x="735" y="410" text-anchor="middle" font-size="7" fill="#94a3b8">Higher acceptance = more speedup from parallel verification</text>
  </g>

  <!-- ==================== FLOW PARTICLES ==================== -->
  <!-- Draft generation particle -->
  <circle r="2.5" fill="#E95420" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0;0;0;0;0;0" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="160;200;264;304;368;408;472;472;472" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="115;115;115;115;115;115;115;115;115" dur="4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <!-- Verification particle -->
  <circle r="2" fill="#10b981" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0;0;0;0;0;0" dur="4s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="160;264;368;472;472;368;264;160;160" dur="4s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="232;232;232;232;265;265;265;265;265" dur="4s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>