<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#E95420"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="none"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#C34113">Inference Optimizations</text>
  <line x1="290" y1="40" x2="610" y2="40" stroke="#E95420" stroke-width="1" opacity="0.3"/>

  <!-- ==================== CARD 1: KV-Cache ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <rect x="50" y="60" width="385" height="240" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Header -->
    <rect x="50" y="60" width="385" height="32" rx="10" fill="#E95420"/>
    <rect x="50" y="82" width="385" height="10" rx="0" fill="#E95420"/>
    <text x="242" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">KV-Cache</text>

    <!-- Symbolic diagram -->
    <rect x="80" y="108" width="120" height="28" rx="6" fill="url(#boxGrad)" stroke="#94a3b8" stroke-width="1"/>
    <text x="140" y="126" text-anchor="middle" font-size="9" fill="#475569">Previous tokens K,V</text>

    <line x1="200" y1="122" x2="230" y2="122" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="235" y="100" width="80" height="44" rx="6" fill="#E95420" opacity="0.12" stroke="#E95420" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="275" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#c34113">Cache</text>
    <text x="275" y="132" text-anchor="middle" font-size="8" fill="#94a3b8">O(n × d × L)</text>

    <!-- Right side: before / after -->
    <rect x="80" y="156" width="130" height="55" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="145" y="172" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">Without Cache</text>
    <text x="145" y="188" text-anchor="middle" font-size="9" fill="#c34113">O(n²) per token</text>
    <text x="145" y="202" text-anchor="middle" font-size="8" fill="#94a3b8">Recompute all K,V</text>

    <line x1="220" y1="183" x2="245" y2="183" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="250" y="156" width="140" height="55" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <text x="320" y="172" text-anchor="middle" font-size="9" font-weight="600" fill="#c34113">With Cache</text>
    <text x="320" y="188" text-anchor="middle" font-size="9" fill="#c34113">O(1) per token</text>
    <text x="320" y="202" text-anchor="middle" font-size="8" fill="#94a3b8">Append new K,V only</text>

    <rect x="80" y="225" width="170" height="22" rx="4" fill="#fde8dc"/>
    <text x="165" y="240" text-anchor="middle" font-size="8" fill="#c34113">Memory: O(n × d × L) per sequence</text>
    <rect x="260" y="225" width="60" height="22" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="290" y="240" text-anchor="middle" font-size="8" fill="#c34113">2–4×</text>
  </g>

  <!-- ==================== CARD 2: Speculative Decoding ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
    <rect x="465" y="60" width="385" height="240" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>

    <rect x="465" y="60" width="385" height="32" rx="10" fill="#c34113"/>
    <rect x="465" y="82" width="385" height="10" rx="0" fill="#c34113"/>
    <text x="657" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Speculative Decoding</text>

    <!-- Draft model -->
    <rect x="495" y="105" width="100" height="40" rx="8" fill="url(#boxGrad)" stroke="#f0883e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="545" y="121" text-anchor="middle" font-size="10" font-weight="600" fill="#c34113">Draft Model</text>
    <text x="545" y="137" text-anchor="middle" font-size="8" fill="#94a3b8">Small, fast</text>

    <!-- Arrow -->
    <line x1="595" y1="125" x2="625" y2="125" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Candidate tokens -->
    <rect x="630" y="108" width="30" height="34" rx="4" fill="#E95420" opacity="0.15"/>
    <text x="645" y="130" text-anchor="middle" font-size="10" font-weight="600" fill="#c34113">t₁</text>
    <rect x="665" y="108" width="30" height="34" rx="4" fill="#E95420" opacity="0.15"/>
    <text x="680" y="130" text-anchor="middle" font-size="10" font-weight="600" fill="#c34113">t₂</text>
    <rect x="700" y="108" width="30" height="34" rx="4" fill="#E95420" opacity="0.15"/>
    <text x="715" y="130" text-anchor="middle" font-size="10" font-weight="600" fill="#c34113">t₃</text>
    <rect x="735" y="108" width="30" height="34" rx="4" fill="#E95420" opacity="0.15"/>
    <text x="750" y="130" text-anchor="middle" font-size="10" font-weight="600" fill="#c34113">t₄</text>

    <!-- Verification -->
    <line x1="645" y1="142" x2="645" y2="162" stroke="#E95420" stroke-width="1"/>
    <line x1="750" y1="142" x2="750" y2="162" stroke="#E95420" stroke-width="1"/>

    <rect x="495" y="166" width="310" height="36" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="2;3;2" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="650" y="189" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">Large Model Verifies All Candidates in Parallel</text>

    <!-- Accept/Reject -->
    <text x="530" y="218" font-size="10" font-weight="600" fill="#10b981">✓ Accept prefix</text>
    <text x="695" y="218" font-size="10" font-weight="600" fill="#c34113">✗ Reject &amp; resample</text>

    <rect x="495" y="235" width="170" height="22" rx="4" fill="#fde8dc"/>
    <text x="580" y="251" text-anchor="middle" font-size="8" fill="#c34113">2–3× throughput improvement</text>
    <rect x="680" y="235" width="60" height="22" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="710" y="251" text-anchor="middle" font-size="8" fill="#c34113">2–3×</text>
  </g>

  <!-- ==================== CARD 3: Quantization ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/>
    <rect x="50" y="320" width="250" height="275" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>

    <rect x="50" y="320" width="250" height="32" rx="10" fill="#E95420"/>
    <rect x="50" y="342" width="250" height="10" rx="0" fill="#E95420"/>
    <text x="175" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Quantization</text>

    <!-- FP16 → INT8 -->
    <rect x="80" y="370" width="70" height="50" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="115" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">FP16</text>
    <text x="115" y="408" text-anchor="middle" font-size="8" fill="#94a3b8">16-bit</text>

    <line x1="150" y1="395" x2="185" y2="395" stroke="#E95420" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="190" y="370" width="70" height="50" rx="6" fill="#fde8dc" stroke="#E95420" stroke-width="1.5"/>
    <text x="225" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#c34113">INT8</text>
    <text x="225" y="408" text-anchor="middle" font-size="8" fill="#94a3b8">8-bit</text>

    <!-- Memory comparison bars -->
    <text x="175" y="443" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">Memory Footprint</text>
    <rect x="80" y="452" width="160" height="14" rx="4" fill="#3b82f6" opacity="0.3"/>
    <text x="100" y="463" font-size="8" fill="#1d4ed8">FP16: 2×</text>
    <rect x="80" y="472" width="80" height="14" rx="4" fill="#E95420" opacity="0.5"/>
    <text x="100" y="483" font-size="8" fill="#c34113">INT8: 1×</text>

    <rect x="75" y="500" width="200" height="45" rx="6" fill="#fde8dc"/>
    <text x="175" y="516" text-anchor="middle" font-size="9" fill="#c34113">Weight-only: 2× memory ↓</text>
    <text x="175" y="530" text-anchor="middle" font-size="8" fill="#94a3b8">GPTQ, AWQ, GGUF</text>

    <rect x="95" y="555" width="70" height="22" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="130" y="571" text-anchor="middle" font-size="8" fill="#c34113">2×</text>
    <rect x="180" y="555" width="80" height="22" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="220" y="571" text-anchor="middle" font-size="8" fill="#c34113">Minimal loss</text>
  </g>

  <!-- ==================== CARD 4: Flash Attention ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
    <rect x="325" y="320" width="250" height="275" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>

    <rect x="325" y="320" width="250" height="32" rx="10" fill="#c34113"/>
    <rect x="325" y="342" width="250" height="10" rx="0" fill="#c34113"/>
    <text x="450" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Flash Attention</text>

    <!-- Tiling diagram -->
    <rect x="355" y="370" width="190" height="60" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="450" y="388" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">Fused Tiled Attention</text>

    <!-- Small tile blocks -->
    <rect x="365" y="398" width="24" height="22" rx="3" fill="#E95420" opacity="0.7"/>
    <rect x="393" y="398" width="24" height="22" rx="3" fill="#E95420" opacity="0.5"/>
    <rect x="421" y="398" width="24" height="22" rx="3" fill="#E95420" opacity="0.6"/>
    <rect x="449" y="398" width="24" height="22" rx="3" fill="#E95420" opacity="0.4"/>
    <rect x="477" y="398" width="24" height="22" rx="3" fill="#E95420" opacity="0.5"/>
    <rect x="505" y="398" width="24" height="22" rx="3" fill="#E95420" opacity="0.6"/>

    <!-- Arrow + tile animation -->
    <rect x="355" y="445" width="24" height="22" rx="3" fill="#E95420" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="355;355;505;505" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>

    <rect x="355" y="472" width="190" height="40" rx="6" fill="#fde8dc"/>
    <text x="450" y="488" text-anchor="middle" font-size="9" fill="#c34113">Process in tiles on SRAM</text>
    <text x="450" y="503" text-anchor="middle" font-size="8" fill="#94a3b8">Avoids O(n²) memory writes</text>

    <rect x="370" y="525" width="60" height="22" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="400" y="541" text-anchor="middle" font-size="8" fill="#c34113">2–4×</text>
    <rect x="445" y="525" width="90" height="22" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="490" y="541" text-anchor="middle" font-size="8" fill="#c34113">Long seq only</text>
  </g>

  <!-- ==================== CARD 5: Continuous Batching ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
    <rect x="600" y="320" width="250" height="275" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>

    <rect x="600" y="320" width="250" height="32" rx="10" fill="#E95420"/>
    <rect x="600" y="342" width="250" height="10" rx="0" fill="#E95420"/>
    <text x="725" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Continuous Batching</text>

    <!-- Request queue -->
    <rect x="630" y="368" width="190" height="45" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="725" y="386" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">Request Queue</text>

    <rect x="640" y="396" width="30" height="12" rx="3" fill="#E95420" opacity="0.5"/>
    <rect x="675" y="396" width="30" height="12" rx="3" fill="#E95420" opacity="0.4"/>
    <rect x="710" y="396" width="30" height="12" rx="3" fill="#E95420" opacity="0.6"/>
    <rect x="745" y="396" width="30" height="12" rx="3" fill="#E95420" opacity="0.3"/>
    <rect x="780" y="396" width="30" height="12" rx="3" fill="#E95420" opacity="0.5"/>

    <!-- Arrow to GPU -->
    <line x1="725" y1="413" x2="725" y2="432" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- GPU box -->
    <rect x="630" y="438" width="190" height="55" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="2;3;2" dur="2s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="725" y="458" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">Single GPU Forward Pass</text>
    <text x="725" y="475" text-anchor="middle" font-size="9" fill="#94a3b8">Processes all requests together</text>

    <!-- KV-cache management -->
    <rect x="630" y="505" width="190" height="42" rx="6" fill="#fde8dc"/>
    <text x="725" y="521" text-anchor="middle" font-size="9" fill="#c34113">Requests join/leave dynamically</text>
    <text x="725" y="537" text-anchor="middle" font-size="8" fill="#94a3b8">vLLM, TGI, TensorRT-LLM</text>

    <rect x="660" y="558" width="60" height="22" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="690" y="575" text-anchor="middle" font-size="8" fill="#c34113">10–30×</text>
    <rect x="735" y="558" width="80" height="22" rx="10" fill="#E95420" opacity="0.1"/>
    <text x="775" y="575" text-anchor="middle" font-size="8" fill="#c34113">GPU utilization</text>
  </g>
</svg>
