<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Ubuntu', sans-serif; }
  </style>
  <defs>
    <linearGradient id="encGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e95420"/>
      <stop offset="100%" stop-color="#c34113"/>
    </linearGradient>
    <linearGradient id="decGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" rx="8" fill="var(--bg-subtle, #f8fafc)" opacity="0.5"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-default, #0f172a)">Encoder-Decoder Architecture (T5-style)</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="var(--text-muted, #64748b)">Bidirectional Encoder + Autoregressive Decoder with Cross-Attention</text>

  <!-- ==================== SECTION LABELS ==================== -->
  <rect x="30" y="75" width="130" height="22" rx="4" fill="rgba(233,84,32,0.06)"/>
  <text x="44" y="90" font-size="11" font-weight="600" fill="#e95420">INPUT</text>

  <rect x="30" y="230" width="130" height="22" rx="4" fill="rgba(233,84,32,0.06)"/>
  <text x="44" y="245" font-size="11" font-weight="600" fill="#e95420">ENCODER STACK</text>

  <rect x="30" y="410" width="130" height="22" rx="4" fill="rgba(37,99,235,0.06)"/>
  <text x="44" y="425" font-size="11" font-weight="600" fill="#2563eb">DECODER STACK</text>

  <rect x="30" y="580" width="130" height="22" rx="4" fill="rgba(37,99,235,0.06)"/>
  <text x="44" y="595" font-size="11" font-weight="600" fill="#2563eb">OUTPUT</text>

  <!-- ==================== INPUT ==================== -->
  <!-- Source input tokens -->
  <g>
    <rect x="95" y="105" width="80" height="50" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="135" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">The</text>
    <text x="135" y="142" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">src</text>

    <rect x="190" y="105" width="80" height="50" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="230" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">cat</text>
    <text x="230" y="142" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">src</text>

    <rect x="285" y="105" width="80" height="50" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="325" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">sat</text>
    <text x="325" y="142" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">src</text>

    <rect x="380" y="105" width="80" height="50" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="420" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">on</text>
    <text x="420" y="142" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">src</text>

    <rect x="475" y="105" width="80" height="50" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="515" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">the</text>
    <text x="515" y="142" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">src</text>

    <rect x="570" y="105" width="80" height="50" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="610" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">mat</text>
    <text x="610" y="142" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">src</text>
  </g>

  <!-- Down arrows to encoder -->
  <g stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" stroke-linecap="round">
    <line x1="135" y1="155" x2="135" y2="225"/><line x1="230" y1="155" x2="230" y2="225"/>
    <line x1="325" y1="155" x2="325" y2="225"/><line x1="420" y1="155" x2="420" y2="225"/>
    <line x1="515" y1="155" x2="515" y2="225"/><line x1="610" y1="155" x2="610" y2="225"/>
  </g>
  <g fill="var(--border-default, #e2e8f0)">
    <polygon points="135,225 131,217 139,217"/><polygon points="230,225 226,217 234,217"/>
    <polygon points="325,225 321,217 329,217"/><polygon points="420,225 416,217 424,217"/>
    <polygon points="515,225 511,217 519,217"/><polygon points="610,225 606,217 614,217"/>
  </g>

  <!-- ==================== ENCODER STACK ==================== -->
  <rect x="55" y="235" width="540" height="155" rx="10" fill="var(--bg-default, #ffffff)" stroke="#e95420" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="325" y="257" text-anchor="middle" font-size="12" font-weight="600" fill="#e95420">×N Encoder Layers (Bidirectional Self-Attention)</text>

  <!-- Encoder internal: bidirectional arcs -->
  <g>
    <circle cx="135" cy="305" r="14" fill="rgba(233,84,32,0.06)" stroke="#e95420" stroke-width="1.5"/>
    <text x="135" y="309" text-anchor="middle" font-size="9" font-weight="500" fill="#e95420">1</text>
    <circle cx="230" cy="305" r="14" fill="rgba(233,84,32,0.06)" stroke="#e95420" stroke-width="1.5"/>
    <text x="230" y="309" text-anchor="middle" font-size="9" font-weight="500" fill="#e95420">2</text>
    <circle cx="325" cy="305" r="14" fill="rgba(233,84,32,0.06)" stroke="#e95420" stroke-width="1.5"/>
    <text x="325" y="309" text-anchor="middle" font-size="9" font-weight="500" fill="#e95420">3</text>
    <circle cx="420" cy="305" r="14" fill="rgba(233,84,32,0.06)" stroke="#e95420" stroke-width="1.5"/>
    <text x="420" y="309" text-anchor="middle" font-size="9" font-weight="500" fill="#e95420">4</text>
    <circle cx="515" cy="305" r="14" fill="rgba(233,84,32,0.06)" stroke="#e95420" stroke-width="1.5"/>
    <text x="515" y="309" text-anchor="middle" font-size="9" font-weight="500" fill="#e95420">5</text>
    <circle cx="610" cy="305" r="14" fill="rgba(233,84,32,0.06)" stroke="#e95420" stroke-width="1.5"/>
    <text x="610" y="309" text-anchor="middle" font-size="9" font-weight="500" fill="#e95420">6</text>
  </g>

  <!-- Bidirectional arcs inside encoder -->
  <g stroke="#e95420" stroke-width="1" fill="none" opacity="0.15">
    <path d="M149 305 Q190 275 216 305" stroke-dasharray="3 3"/><path d="M244 305 Q280 275 311 305" stroke-dasharray="3 3"/>
    <path d="M339 305 Q375 275 406 305" stroke-dasharray="3 3"/><path d="M434 305 Q470 275 501 305" stroke-dasharray="3 3"/>
    <path d="M529 305 Q565 275 596 305" stroke-dasharray="3 3"/>
  </g>
  <!-- Animated sweeps -->
  <g stroke="#e95420" stroke-width="1.5" fill="none" opacity="0">
    <path d="M149 300 Q190 270 216 300" stroke-dasharray="6 50" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="56;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M339 300 Q375 270 406 300" stroke-dasharray="6 50" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="56;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M529 300 Q565 270 596 300" stroke-dasharray="6 50" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="56;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="210" y="345" width="230" height="20" rx="10" fill="rgba(233,84,32,0.06)"/>
  <text x="325" y="359" text-anchor="middle" font-size="10" font-weight="500" fill="#e95420">Bidirectional Self-Attention</text>

  <!-- Cross-attention arrow from encoder → decoder -->
  <g>
    <path d="M595 305 L690 305 L690 440" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 3">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <polygon points="690,440 684,432 696,432" fill="#7c3aed"/>
    <text x="645" y="365" font-size="9" font-weight="500" fill="#7c3aed">Cross-Attention</text>
    <text x="645" y="377" font-size="8" fill="#7c3aed">Keys &amp; Values</text>
  </g>

  <!-- ==================== DECODER STACK ==================== -->
  <rect x="55" y="420" width="790" height="140" rx="10" fill="var(--bg-default, #ffffff)" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="450" y="442" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">×N Decoder Layers (Causal Self-Attention + Cross-Attention)</text>

  <!-- Decoder positions -->
  <g>
    <circle cx="160" cy="490" r="14" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="160" y="494" text-anchor="middle" font-size="9" font-weight="500" fill="#2563eb">1</text>
    <circle cx="310" cy="490" r="14" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="310" y="494" text-anchor="middle" font-size="9" font-weight="500" fill="#2563eb">2</text>
    <circle cx="460" cy="490" r="14" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="460" y="494" text-anchor="middle" font-size="9" font-weight="500" fill="#2563eb">3</text>
    <circle cx="610" cy="490" r="14" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="610" y="494" text-anchor="middle" font-size="9" font-weight="500" fill="#2563eb">4</text>
    <circle cx="760" cy="490" r="14" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="760" y="494" text-anchor="middle" font-size="9" font-weight="500" fill="#2563eb">5</text>
  </g>

  <!-- Causal arcs in decoder -->
  <g stroke="#2563eb" stroke-width="1.5" fill="none" opacity="0">
    <path d="M174 485 Q240 460 296 485" stroke-dasharray="5 40" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="45;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M324 485 Q390 460 446 485" stroke-dasharray="5 40" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.5;0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="45;0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M474 485 Q540 460 596 485" stroke-dasharray="5 40" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.5;0" dur="3s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="45;0" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M624 485 Q690 460 746 485" stroke-dasharray="5 40" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.5;0" dur="3s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="45;0" dur="3s" begin="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="440" y="518" width="230" height="20" rx="10" fill="rgba(37,99,235,0.06)"/>
  <text x="555" y="533" text-anchor="middle" font-size="10" font-weight="500" fill="#2563eb">Causal Self-Attention</text>

  <!-- Cross-attention arcs inside decoder -->
  <g stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0">
    <path d="M160 505 Q160 445 135 320" stroke-dasharray="5 30" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.4;0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M310 505 Q310 445 230 320" stroke-dasharray="5 30" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.4;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M460 505 Q460 445 325 320" stroke-dasharray="5 30" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.4;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Autoregressive input to decoder -->
  <rect x="160" y="100" width="80" height="50" rx="6" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#shadow1)"/>
  <text x="200" y="121" text-anchor="middle" font-size="11" font-weight="500" fill="#1d4ed8">&lt;s&gt;</text>
  <text x="200" y="137" text-anchor="middle" font-size="9" fill="#2563eb">dec start</text>
  <!-- Arrow from decoder input to decoder stack -->
  <g stroke="#2563eb" stroke-width="1.5" stroke-linecap="round">
    <line x1="200" y1="150" x2="160" y2="420"/>
  </g>
  <polygon points="160,420 155,412 165,412" fill="#2563eb"/>

  <!-- ==================== OUTPUT ==================== -->
  <!-- Down arrows from decoder to output -->
  <g stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" stroke-linecap="round">
    <line x1="160" y1="560" x2="160" y2="595"/>
    <line x1="310" y1="560" x2="310" y2="595"/>
    <line x1="460" y1="560" x2="460" y2="595"/>
    <line x1="610" y1="560" x2="610" y2="595"/>
    <line x1="760" y1="560" x2="760" y2="595"/>
  </g>
  <g fill="var(--border-default, #e2e8f0)">
    <polygon points="160,595 156,587 164,587"/><polygon points="310,595 306,587 314,587"/>
    <polygon points="460,595 456,587 464,587"/><polygon points="610,595 606,587 614,587"/>
    <polygon points="760,595 756,587 764,587"/>
  </g>

  <!-- Output token boxes -->
  <g>
    <rect x="120" y="605" width="80" height="50" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="160" y="626" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">Le</text>
    <text x="160" y="642" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">tgt</text>

    <rect x="270" y="605" width="80" height="50" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="310" y="626" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">chat</text>
    <text x="310" y="642" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">tgt</text>

    <rect x="420" y="605" width="80" height="50" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="460" y="626" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">chat</text>
    <text x="460" y="642" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">tgt</text>

    <rect x="570" y="605" width="80" height="50" rx="6" fill="#ffffff" stroke="var(--border-default, #e2e8f0)" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="610" y="626" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text-default, #0f172a)">tapis</text>
    <text x="610" y="642" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">tgt</text>

    <rect x="720" y="605" width="80" height="50" rx="6" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="760" y="626" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">&lt;/s&gt;</text>
    <text x="760" y="642" text-anchor="middle" font-size="9" fill="#2563eb">end</text>
  </g>

  <!-- Translation label -->
  <rect x="120" y="80" width="120" height="18" rx="9" fill="rgba(233,84,32,0.06)"/>
  <text x="180" y="93" text-anchor="middle" font-size="9" font-weight="500" fill="#e95420">English (source)</text>

  <rect x="120" y="580" width="120" height="18" rx="9" fill="rgba(37,99,235,0.06)"/>
  <text x="180" y="593" text-anchor="middle" font-size="9" font-weight="500" fill="#2563eb">French (target)</text>

  <!-- Training objective label -->
  <rect x="630" y="82" width="170" height="18" rx="9" fill="#f3e8ff"/>
  <text x="715" y="95" text-anchor="middle" font-size="9" font-weight="500" fill="#6d28d9">Training: Span Corruption</text>

  <!-- Arrow connecting masked spans -->
  <g>
    <path d="M420 155 Q420 185 570 185 Q720 185 720 130" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity="0">
      <animate attributeName="opacity" values="0;0;0.5" dur="3s" fill="freeze"/>
    </path>
    <polygon points="720,130 714,138 726,138" fill="#7c3aed" opacity="0">
      <animate attributeName="opacity" values="0;0;0.5" dur="3s" fill="freeze"/>
    </polygon>
  </g>
</svg>