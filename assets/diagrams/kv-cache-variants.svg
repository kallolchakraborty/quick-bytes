<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <linearGradient id="kvGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8dc"/>
      <stop offset="100%" stop-color="#f5c4a8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#E95420" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowDn" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#E95420"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#E95420"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="none"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#C34113">Attention Variants: KV Cache Impact</text>
  <line x1="260" y1="40" x2="640" y2="40" stroke="#E95420" stroke-width="1" opacity="0.3"/>

  <!-- Grid dividers -->
  <line x1="450" y1="50" x2="450" y2="510" stroke="#E95420" stroke-width="1" opacity="0.15"/>
  <line x1="30" y1="275" x2="870" y2="275" stroke="#E95420" stroke-width="1" opacity="0.15"/>

  <!-- ========== PANEL 1: MHA (top-left) ========== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <!-- Panel bg -->
    <rect x="30" y="50" width="410" height="220" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="235" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#C34113">MHA (Multi-Head Attention)</text>

    <!-- Query heads -->
    <g transform="translate(80,90)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₁</text>
    </g>
    <g transform="translate(80,120)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₂</text>
    </g>
    <g transform="translate(80,150)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₃</text>
    </g>
    <g transform="translate(80,180)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₄</text>
    </g>

    <!-- Arrows Q→KV -->
    <line x1="126" y1="101" x2="175" y2="101" stroke="#E95420" stroke-width="1.2" marker-end="url(#arrowR)"/>
    <line x1="126" y1="131" x2="175" y2="131" stroke="#E95420" stroke-width="1.2" marker-end="url(#arrowR)"/>
    <line x1="126" y1="161" x2="175" y2="161" stroke="#E95420" stroke-width="1.2" marker-end="url(#arrowR)"/>
    <line x1="126" y1="191" x2="175" y2="191" stroke="#E95420" stroke-width="1.2" marker-end="url(#arrowR)"/>

    <!-- KV pairs (separate) -->
    <g transform="translate(180,88)">
      <rect x="0" y="0" width="50" height="26" rx="5" fill="url(#kvGrad)" stroke="#f0883e" stroke-width="1"/>
      <text x="25" y="17" text-anchor="middle" font-size="9" font-weight="600" fill="#C34113">K₁V₁</text>
    </g>
    <g transform="translate(180,118)">
      <rect x="0" y="0" width="50" height="26" rx="5" fill="url(#kvGrad)" stroke="#f0883e" stroke-width="1"/>
      <text x="25" y="17" text-anchor="middle" font-size="9" font-weight="600" fill="#C34113">K₂V₂</text>
    </g>
    <g transform="translate(180,148)">
      <rect x="0" y="0" width="50" height="26" rx="5" fill="url(#kvGrad)" stroke="#f0883e" stroke-width="1"/>
      <text x="25" y="17" text-anchor="middle" font-size="9" font-weight="600" fill="#C34113">K₃V₃</text>
    </g>
    <g transform="translate(180,178)">
      <rect x="0" y="0" width="50" height="26" rx="5" fill="url(#kvGrad)" stroke="#f0883e" stroke-width="1"/>
      <text x="25" y="17" text-anchor="middle" font-size="9" font-weight="600" fill="#C34113">K₄V₄</text>
    </g>

    <!-- Cache size bar -->
    <rect x="270" y="88" width="150" height="26" rx="5" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <rect x="270" y="88" width="150" height="26" rx="5" fill="#E95420" opacity="0.25"/>
    <text x="345" y="105" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">Cache = 100%</text>

    <!-- Full cache visual -->
    <rect x="270" y="130" width="37" height="18" rx="3" fill="#E95420" opacity="0.3"/>
    <rect x="312" y="130" width="37" height="18" rx="3" fill="#E95420" opacity="0.3"/>
    <rect x="354" y="130" width="37" height="18" rx="3" fill="#E95420" opacity="0.3"/>
    <rect x="396" y="130" width="18" height="18" rx="3" fill="#E95420" opacity="0.3"/>
    <text x="345" y="165" text-anchor="middle" font-size="8" fill="#94a3b8">4 KV pairs cached</text>

    <text x="235" y="205" text-anchor="middle" font-size="8" fill="#94a3b8">Each head has independent K,V</text>
    <text x="235" y="220" text-anchor="middle" font-size="8" fill="#94a3b8">Maximum memory usage</text>
  </g>

  <!-- ========== PANEL 2: MQA (top-right) ========== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
    <!-- Panel bg -->
    <rect x="460" y="50" width="410" height="220" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="665" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#C34113">MQA (Multi-Query Attention)</text>

    <!-- Query heads -->
    <g transform="translate(510,90)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₁</text>
    </g>
    <g transform="translate(510,120)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₂</text>
    </g>
    <g transform="translate(510,150)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₃</text>
    </g>
    <g transform="translate(510,180)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₄</text>
    </g>

    <!-- Dashed lines converging to shared KV -->
    <line x1="556" y1="101" x2="600" y2="133" stroke="#E95420" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="556" y1="131" x2="600" y2="133" stroke="#E95420" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="556" y1="161" x2="600" y2="143" stroke="#E95420" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="556" y1="191" x2="600" y2="143" stroke="#E95420" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- Shared KV pair with pulsing glow -->
    <g transform="translate(605,118)">
      <rect x="0" y="0" width="55" height="50" rx="6" fill="url(#kvGrad)" stroke="#E95420" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="27" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">K₁</text>
      <text x="27" y="40" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">V₁</text>
      <text x="27" y="60" text-anchor="middle" font-size="8" fill="#E95420" font-weight="600">shared</text>
    </g>

    <!-- Cache size bar -->
    <rect x="690" y="118" width="150" height="26" rx="5" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <rect x="690" y="118" width="37" height="26" rx="5" fill="#E95420" opacity="0.25"/>
    <text x="765" y="135" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">Cache = 25%</text>

    <!-- Small cache visual -->
    <rect x="690" y="160" width="37" height="18" rx="3" fill="#E95420" opacity="0.3"/>
    <text x="765" y="195" text-anchor="middle" font-size="8" fill="#94a3b8">1 KV pair shared by all heads</text>
    <text x="665" y="215" text-anchor="middle" font-size="8" fill="#94a3b8">4× memory reduction</text>
  </g>

  <!-- ========== PANEL 3: GQA (bottom-left) ========== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
    <!-- Panel bg -->
    <rect x="30" y="280" width="410" height="220" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="235" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#C34113">GQA (Grouped-Query Attention)</text>

    <!-- Group 1: Q1,Q2 -->
    <g transform="translate(60,320)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₁</text>
    </g>
    <g transform="translate(60,350)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₂</text>
    </g>

    <!-- Group 2: Q3,Q4 -->
    <g transform="translate(60,390)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₃</text>
    </g>
    <g transform="translate(60,420)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₄</text>
    </g>

    <!-- Group labels -->
    <rect x="112" y="318" width="32" height="56" rx="6" fill="none" stroke="#E95420" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
    <text x="128" y="384" text-anchor="middle" font-size="7" fill="#E95420" font-weight="600">Group 1</text>
    <rect x="112" y="388" width="32" height="56" rx="6" fill="none" stroke="#E95420" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
    <text x="128" y="454" text-anchor="middle" font-size="7" fill="#E95420" font-weight="600">Group 2</text>

    <!-- Arrows to shared KV -->
    <line x1="106" y1="331" x2="155" y2="343" stroke="#E95420" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="106" y1="361" x2="155" y2="343" stroke="#E95420" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="106" y1="401" x2="155" y2="413" stroke="#E95420" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="106" y1="431" x2="155" y2="413" stroke="#E95420" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- KV pair 1 with glow -->
    <g transform="translate(158,326)">
      <rect x="0" y="0" width="50" height="36" rx="5" fill="url(#kvGrad)" stroke="#E95420" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="25" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#C34113">K₁V₁</text>
      <text x="25" y="30" text-anchor="middle" font-size="7" fill="#E95420" font-weight="600">shared</text>
    </g>

    <!-- KV pair 2 with glow -->
    <g transform="translate(158,396)">
      <rect x="0" y="0" width="50" height="36" rx="5" fill="url(#kvGrad)" stroke="#E95420" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="2;3;2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <text x="25" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#C34113">K₂V₂</text>
      <text x="25" y="30" text-anchor="middle" font-size="7" fill="#E95420" font-weight="600">shared</text>
    </g>

    <!-- Cache size bar -->
    <rect x="240" y="326" width="150" height="26" rx="5" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <rect x="240" y="326" width="75" height="26" rx="5" fill="#E95420" opacity="0.25"/>
    <text x="315" y="343" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">Cache = 50%</text>

    <!-- Cache visual -->
    <rect x="240" y="368" width="37" height="18" rx="3" fill="#E95420" opacity="0.3"/>
    <rect x="282" y="368" width="37" height="18" rx="3" fill="#E95420" opacity="0.3"/>
    <text x="315" y="405" text-anchor="middle" font-size="8" fill="#94a3b8">2 KV pairs, each shared by 2 heads</text>
    <text x="235" y="465" text-anchor="middle" font-size="8" fill="#94a3b8">Best trade-off: quality vs memory</text>
  </g>

  <!-- ========== PANEL 4: MLA (bottom-right) ========== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    <!-- Panel bg -->
    <rect x="460" y="280" width="410" height="220" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="665" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#C34113">MLA (Multi-head Latent Attention)</text>

    <!-- Query heads -->
    <g transform="translate(500,320)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₁</text>
    </g>
    <g transform="translate(500,350)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₂</text>
    </g>
    <g transform="translate(500,380)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₃</text>
    </g>
    <g transform="translate(500,410)">
      <rect x="0" y="0" width="44" height="22" rx="4" fill="#E95420" filter="url(#shadow)"/>
      <text x="22" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Q₄</text>
    </g>

    <!-- Arrows to latent -->
    <line x1="546" y1="331" x2="590" y2="360" stroke="#E95420" stroke-width="1.2"/>
    <line x1="546" y1="361" x2="590" y2="365" stroke="#E95420" stroke-width="1.2"/>
    <line x1="546" y1="391" x2="590" y2="380" stroke="#E95420" stroke-width="1.2"/>
    <line x1="546" y1="421" x2="590" y2="385" stroke="#E95420" stroke-width="1.2"/>

    <!-- Compressed latent block -->
    <g transform="translate(595,348)">
      <rect x="0" y="0" width="65" height="55" rx="8" fill="#fff5eb" stroke="#E95420" stroke-width="2" filter="url(#shadow)">
        <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="32" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="#C34113">Latent</text>
      <text x="32" y="32" text-anchor="middle" font-size="7" fill="#E95420">d_c &lt; d</text>
      <text x="32" y="45" text-anchor="middle" font-size="7" fill="#94a3b8">compress</text>
    </g>

    <!-- Arrow latent→KV -->
    <line x1="662" y1="375" x2="695" y2="375" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrowR)"/>

    <!-- Small KV -->
    <g transform="translate(700,362)">
      <rect x="0" y="0" width="45" height="30" rx="5" fill="url(#kvGrad)" stroke="#E95420" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="2;3;2" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <text x="22" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#C34113">KV</text>
      <text x="22" y="26" text-anchor="middle" font-size="6" fill="#E95420">tiny</text>
    </g>

    <!-- Cache size bar -->
    <rect x="690" y="326" width="150" height="26" rx="5" fill="#fde8dc" stroke="#E95420" stroke-width="1"/>
    <rect x="690" y="326" width="15" height="26" rx="5" fill="#E95420" opacity="0.25"/>
    <text x="765" y="343" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">Cache = ~10%</text>

    <text x="665" y="430" text-anchor="middle" font-size="8" fill="#94a3b8">Compress KV into low-rank latent</text>
    <text x="665" y="445" text-anchor="middle" font-size="8" fill="#94a3b8">DeepSeek-V2/V3 approach</text>
    <text x="665" y="465" text-anchor="middle" font-size="8" fill="#94a3b8">Near-MQA compression with MHA quality</text>
  </g>
</svg>