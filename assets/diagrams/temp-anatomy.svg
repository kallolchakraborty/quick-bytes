<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');
    :root {
      --bg-subtle: #f8fafc;
      --bg-default: #ffffff;
      --text-default: #0f172a;
      --text-muted: #64748b;
      --border-default: #e2e8f0;
      --brand-default: #e95420;
      --brand-light: rgba(233,84,32,0.06);
      --brand-medium: rgba(233,84,32,0.15);
    }
  </style>
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e95420"/>
      <stop offset="100%" stop-color="#c34113"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="none"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="450" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="var(--text-default, #0f172a)">Temperature Sampling Anatomy</text>
    <line x1="290" y1="32" x2="610" y2="32" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- ==================== THREE COLUMNS: T=0.1, T=1.0, T=2.0 ==================== -->

  <!-- Column headers -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    <rect x="20" y="48" width="280" height="30" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="160" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="var(--brand-default, #e95420)">LOW: T = 0.1 (Deterministic)</text>

    <rect x="310" y="48" width="280" height="30" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="450" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="var(--brand-default, #e95420)">BALANCED: T = 1.0 (Default)</text>

    <rect x="600" y="48" width="280" height="30" rx="6" fill="var(--brand-light, rgba(233,84,32,0.06))"/>
    <text x="740" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="var(--brand-default, #e95420)">HIGH: T = 2.0 (Random)</text>
  </g>

  <!-- Row 1: Logits (raw scores) - same for all three -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.7s" fill="freeze"/>
    <text x="160" y="96" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Step 1: Raw Logits</text>
    <text x="450" y="96" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Step 1: Raw Logits</text>
    <text x="740" y="96" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Step 1: Raw Logits</text>

    <!-- Same logit bars for all three columns (height reflects probability) -->
    <g>
      <!-- Token A: highest -->
      <rect x="30" y="107" width="260" height="18" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
      <rect x="30" y="107" width="195" height="18" rx="3" fill="url(#barGrad)" opacity="0.85">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="34" y="120" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Token A: "the"</text>
      <text x="282" y="120" text-anchor="end" font-size="9" fill="var(--text-muted, #64748b)">5.2</text>

      <!-- Token B -->
      <rect x="30" y="129" width="260" height="18" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
      <rect x="30" y="129" width="130" height="18" rx="3" fill="url(#barGrad)" opacity="0.65"/>
      <text x="34" y="142" font-size="10" font-weight="500" fill="var(--text-default, #0f172a)">Token B: "a"</text>
      <text x="282" y="142" text-anchor="end" font-size="9" fill="var(--text-muted, #64748b)">3.8</text>

      <!-- Token C -->
      <rect x="30" y="151" width="260" height="18" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
      <rect x="30" y="151" width="78" height="18" rx="3" fill="url(#barGrad)" opacity="0.45"/>
      <text x="34" y="164" font-size="10" font-weight="500" fill="var(--text-default, #0f172a)">Token C: "this"</text>
      <text x="282" y="164" text-anchor="end" font-size="9" fill="var(--text-muted, #64748b)">2.1</text>
    </g>

    <g>
      <!-- Same bars column 2 -->
      <rect x="320" y="107" width="260" height="18" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
      <rect x="320" y="107" width="195" height="18" rx="3" fill="url(#barGrad)" opacity="0.85">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="324" y="120" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Token A: "the"</text>
      <text x="572" y="120" text-anchor="end" font-size="9" fill="var(--text-muted, #64748b)">5.2</text>

      <rect x="320" y="129" width="260" height="18" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
      <rect x="320" y="129" width="130" height="18" rx="3" fill="url(#barGrad)" opacity="0.65"/>
      <text x="324" y="142" font-size="10" font-weight="500" fill="var(--text-default, #0f172a)">Token B: "a"</text>
      <text x="572" y="142" text-anchor="end" font-size="9" fill="var(--text-muted, #64748b)">3.8</text>

      <rect x="320" y="151" width="260" height="18" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
      <rect x="320" y="151" width="78" height="18" rx="3" fill="url(#barGrad)" opacity="0.45"/>
      <text x="324" y="164" font-size="10" font-weight="500" fill="var(--text-default, #0f172a)">Token C: "this"</text>
      <text x="572" y="164" text-anchor="end" font-size="9" fill="var(--text-muted, #64748b)">2.1</text>
    </g>

    <g>
      <!-- Same bars column 3 -->
      <rect x="610" y="107" width="260" height="18" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
      <rect x="610" y="107" width="195" height="18" rx="3" fill="url(#barGrad)" opacity="0.85">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="614" y="120" font-size="10" font-weight="600" fill="var(--text-default, #0f172a)">Token A: "the"</text>
      <text x="862" y="120" text-anchor="end" font-size="9" fill="var(--text-muted, #64748b)">5.2</text>

      <rect x="610" y="129" width="260" height="18" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
      <rect x="610" y="129" width="130" height="18" rx="3" fill="url(#barGrad)" opacity="0.65"/>
      <text x="614" y="142" font-size="10" font-weight="500" fill="var(--text-default, #0f172a)">Token B: "a"</text>
      <text x="862" y="142" text-anchor="end" font-size="9" fill="var(--text-muted, #64748b)">3.8</text>

      <rect x="610" y="151" width="260" height="18" rx="3" fill="var(--bg-subtle, #f8fafc)" stroke="var(--border-default, #e2e8f0)" stroke-width="1"/>
      <rect x="610" y="151" width="78" height="18" rx="3" fill="url(#barGrad)" opacity="0.45"/>
      <text x="614" y="164" font-size="10" font-weight="500" fill="var(--text-default, #0f172a)">Token C: "this"</text>
      <text x="862" y="164" text-anchor="end" font-size="9" fill="var(--text-muted, #64748b)">2.1</text>
    </g>
  </g>

  <!-- Row 2: Temperature Scaling (divide by T) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.9s" fill="freeze"/>
    <line x1="20" y1="180" x2="880" y2="180" stroke="var(--border-default, #e2e8f0)" stroke-width="1" stroke-dasharray="4,2" opacity="0.5"/>

    <text x="450" y="195" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-muted, #64748b)">Step 2: Scale logits by temperature ( logits ÷ T )</text>

    <!-- T=0.1: logits × 10 -->
    <rect x="20" y="205" width="280" height="90" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="20" y="205" width="280" height="24" rx="8" fill="#c34113"/>
    <rect x="20" y="223" width="280" height="6" fill="#c34113"/>
    <text x="160" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">÷ 0.1 (logits × 10)</text>
    <text x="34" y="248" font-size="10" fill="var(--text-default, #0f172a)">Token A: 5.2 → 52.0</text>
    <text x="34" y="265" font-size="10" fill="var(--text-default, #0f172a)">Token B: 3.8 → 38.0</text>
    <text x="34" y="282" font-size="10" fill="var(--text-default, #0f172a)">Token C: 2.1 → 21.0</text>

    <!-- T=1.0: unchanged -->
    <rect x="310" y="205" width="280" height="90" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="310" y="205" width="280" height="24" rx="8" fill="var(--brand-default, #e95420)"/>
    <rect x="310" y="223" width="280" height="6" fill="var(--brand-default, #e95420)"/>
    <text x="450" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">÷ 1.0 (unchanged)</text>
    <text x="324" y="248" font-size="10" fill="var(--text-default, #0f172a)">Token A: 5.2 → 5.2</text>
    <text x="324" y="265" font-size="10" fill="var(--text-default, #0f172a)">Token B: 3.8 → 3.8</text>
    <text x="324" y="282" font-size="10" fill="var(--text-default, #0f172a)">Token C: 2.1 → 2.1</text>

    <!-- T=2.0: halved -->
    <rect x="600" y="205" width="280" height="90" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="600" y="205" width="280" height="24" rx="8" fill="#e95420" opacity="0.7"/>
    <rect x="600" y="223" width="280" height="6" fill="#e95420" opacity="0.7"/>
    <text x="740" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">÷ 2.0 (halved)</text>
    <text x="614" y="248" font-size="10" fill="var(--text-default, #0f172a)">Token A: 5.2 → 2.6</text>
    <text x="614" y="265" font-size="10" fill="var(--text-default, #0f172a)">Token B: 3.8 → 1.9</text>
    <text x="614" y="282" font-size="10" fill="var(--text-default, #0f172a)">Token C: 2.1 → 1.05</text>
  </g>

  <!-- Row 3: Softmax (probability distribution) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.1s" fill="freeze"/>
    <line x1="20" y1="305" x2="880" y2="305" stroke="var(--border-default, #e2e8f0)" stroke-width="1" stroke-dasharray="4,2" opacity="0.5"/>

    <text x="450" y="318" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-muted, #64748b)">Step 3: Softmax → Probability Distribution</text>

    <!-- T=0.1: Sharply peaked -->
    <rect x="20" y="328" width="280" height="120" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="20" y="328" width="280" height="24" rx="8" fill="#c34113"/>
    <rect x="20" y="346" width="280" height="6" fill="#c34113"/>
    <text x="160" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Sharp Distribution</text>

    <!-- Token A dominates -->
    <rect x="34" y="362" width="190" height="22" rx="4" fill="#c34113" opacity="0.9">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="38" y="377" font-size="10" font-weight="600" fill="#ffffff">Token A: "the" — 99.9%</text>
    <rect x="34" y="388" width="6" height="22" rx="2" fill="#e95420" opacity="0.5"/>
    <text x="44" y="403" font-size="9" fill="var(--text-muted, #64748b)">Token B + C: &lt; 0.1%</text>
    <text x="160" y="440" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">Always picks "the"</text>

    <!-- T=1.0: Balanced -->
    <rect x="310" y="328" width="280" height="120" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="310" y="328" width="280" height="24" rx="8" fill="var(--brand-default, #e95420)"/>
    <rect x="310" y="346" width="280" height="6" fill="var(--brand-default, #e95420)"/>
    <text x="450" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Balanced Distribution</text>

    <rect x="324" y="362" width="140" height="22" rx="4" fill="url(#barGrad)" opacity="0.85"/>
    <text x="328" y="377" font-size="10" font-weight="600" fill="#ffffff">Token A: 78%</text>
    <rect x="324" y="388" width="50" height="22" rx="4" fill="#e95420" opacity="0.7"/>
    <text x="328" y="403" font-size="10" font-weight="500" fill="#ffffff">Token B: 18%</text>
    <rect x="324" y="414" width="16" height="22" rx="4" fill="#e95420" opacity="0.5"/>
    <text x="328" y="429" font-size="9" font-weight="500" fill="var(--text-default, #0f172a)">C: 4%</text>
    <text x="450" y="440" text-anchor="middle" font-size="9" fill="#2563eb" font-weight="600">Natural variation</text>

    <!-- T=2.0: Flattened -->
    <rect x="600" y="328" width="280" height="120" rx="8" fill="var(--bg-default, #ffffff)" stroke="var(--border-default, #e2e8f0)" stroke-width="1" filter="url(#shadow)"/>
    <rect x="600" y="328" width="280" height="24" rx="8" fill="#e95420" opacity="0.7"/>
    <rect x="600" y="346" width="280" height="6" fill="#e95420" opacity="0.7"/>
    <text x="740" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Flat Distribution</text>

    <rect x="614" y="362" width="90" height="22" rx="4" fill="#e95420" opacity="0.75"/>
    <text x="618" y="377" font-size="10" font-weight="600" fill="#ffffff">Token A: 42%</text>
    <rect x="614" y="388" width="70" height="22" rx="4" fill="#e95420" opacity="0.6"/>
    <text x="618" y="403" font-size="10" font-weight="500" fill="#ffffff">Token B: 32%</text>
    <rect x="614" y="414" width="50" height="22" rx="4" fill="#e95420" opacity="0.45"/>
    <text x="618" y="429" font-size="10" font-weight="500" fill="var(--text-default, #0f172a)">C: 26%</text>
    <text x="740" y="440" text-anchor="middle" font-size="9" fill="#2563eb" font-weight="600">All tokens possible</text>
  </g>

  <!-- Bottom: Sampling result -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
    <line x1="20" y1="460" x2="880" y2="460" stroke="var(--border-default, #e2e8f0)" stroke-width="1" opacity="0.5"/>

    <!-- Column 1 -->
    <rect x="20" y="475" width="280" height="50" rx="8" fill="#fef2f2" stroke="#c34113" stroke-width="1.5"/>
    <text x="160" y="495" text-anchor="middle" font-size="11" font-weight="700" fill="#c34113">Sample: "the" (99.9%)</text>
    <text x="160" y="512" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Deterministic — same every time</text>

    <!-- Column 2 -->
    <rect x="310" y="475" width="280" height="50" rx="8" fill="#fff7ed" stroke="var(--brand-default, #e95420)" stroke-width="1.5"/>
    <text x="450" y="495" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-default, #e95420)">Sample: usually "the", sometimes "a"</text>
    <text x="450" y="512" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Natural diversity in output</text>

    <!-- Column 3 -->
    <rect x="600" y="475" width="280" height="50" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="740" y="495" text-anchor="middle" font-size="11" font-weight="700" fill="#ca8a04">Sample: any token possible</text>
    <text x="740" y="512" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">High diversity, may be incoherent</text>

    <!-- FAANG Rule callout -->
    <rect x="80" y="545" width="740" height="40" rx="8" fill="var(--brand-light, rgba(233,84,32,0.06))" stroke="var(--brand-default, #e95420)" stroke-width="1"/>
    <text x="450" y="562" text-anchor="middle" font-size="10" font-weight="600" fill="var(--brand-default, #e95420)">FAANG Rule: Use T=0.0 for evaluation (eliminate sampling noise).</text>
    <text x="450" y="578" text-anchor="middle" font-size="9" fill="var(--text-muted, #64748b)">Treat temperature as a hyperparameter — sweep 0.0, 0.3, 0.7 per task.</text>
  </g>
</svg>
