<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Ubuntu, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c34113" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#E95420"/>
    </marker>
    <marker id="arrowDn" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#E95420"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="none"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#C34113">Normalization &amp; Residual Connections</text>
  <line x1="240" y1="40" x2="660" y2="40" stroke="#E95420" stroke-width="1" opacity="0.3"/>

  <!-- ==================== SECTION 1: RESIDUAL CONNECTION ==================== -->
  <rect x="50" y="55" width="280" height="26" rx="4" fill="#fde8dc">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="60" y="72" font-size="12" font-weight="700" fill="#C34113">Residual Connection (Skip Connection)</text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>

    <!-- Input -->
    <rect x="80" y="110" width="80" height="40" rx="8" fill="url(#boxGrad)" stroke="#E95420" stroke-width="2" filter="url(#shadow)"/>
    <text x="120" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#C34113">x</text>

    <!-- Skip path (top) -->
    <path d="M 160,120 L 360,120 L 360,158" fill="none" stroke="#E95420" stroke-width="1.5" stroke-dasharray="5,3"/>

    <!-- Sublayer path (bottom) -->
    <line x1="160" y1="150" x2="220" y2="150" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Sublayer box -->
    <rect x="225" y="128" width="100" height="44" rx="8" fill="url(#boxGrad)" stroke="#C34113" stroke-width="2" filter="url(#shadow)">
      <animate attributeName="stroke-width" values="2;3;2" dur="2s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="275" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#C34113">Sublayer</text>
    <text x="275" y="162" text-anchor="middle" font-size="8" fill="#94a3b8">Attn or FFN</text>

    <!-- Arrow to ⊕ -->
    <line x1="325" y1="150" x2="365" y2="150" stroke="#E95420" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- ⊕ node -->
    <circle cx="390" cy="150" r="14" fill="#fff" stroke="#E95420" stroke-width="2"/>
    <text x="390" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#E95420">+</text>

    <!-- Arrow to output -->
    <line x1="404" y1="150" x2="460" y2="150" stroke="#E95420" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Output -->
    <rect x="465" y="110" width="100" height="40" rx="8" fill="#E95420" filter="url(#shadow)"/>
    <text x="515" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">x + sub(x)</text>

    <!-- Animated skip particle -->
    <circle r="2.5" fill="#f0883e" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0.8;0;0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="120;160;360;390;390;515" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="130;120;120;120;150;130" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Animated sublayer particle -->
    <circle r="2.5" fill="#E95420" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0.8;0;0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="120;160;275;275;390;515" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="130;150;150;150;150;130" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Formula box -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2s" fill="freeze"/>
    <rect x="610" y="105" width="240" height="50" rx="8" fill="#fff5eb" stroke="#E95420" stroke-width="1"/>
    <text x="730" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">x ← x + Sublayer(x)</text>
    <text x="730" y="143" text-anchor="middle" font-size="9" fill="#64748b">Gradients flow directly through skip path</text>
  </g>

  <!-- ==================== SECTION DIVIDER ==================== -->
  <line x1="50" y1="185" x2="850" y2="185" stroke="#E95420" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0;0.15" dur="0.3s" begin="2.5s" fill="freeze"/>
  </line>

  <!-- ==================== SECTION 2: NORMALIZATION ==================== -->
  <rect x="50" y="200" width="200" height="26" rx="4" fill="#fde8dc">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.7s" fill="freeze"/>
  </rect>
  <text x="60" y="217" font-size="12" font-weight="700" fill="#C34113">Normalization Variants</text>

  <!-- ==================== LN CARD ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3s" fill="freeze"/>
    <rect x="50" y="240" width="250" height="255" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>

    <rect x="70" y="252" width="100" height="22" rx="4" fill="#E95420"/>
    <text x="120" y="267" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">LayerNorm</text>

    <!-- Formula -->
    <text x="175" y="298" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">μ = mean(x)</text>
    <text x="175" y="316" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">σ = std(x)</text>
    <text x="175" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">y = (x − μ) / σ · γ + β</text>

    <!-- Diagram: distribution before → after -->
    <rect x="75" y="358" width="200" height="55" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="175" y="374" text-anchor="middle" font-size="8" fill="#475569" font-weight="600">Before LN</text>
    <!-- Bell curve before -->
    <path d="M 110,400 Q 130,380 150,400 Q 170,420 195,400" fill="none" stroke="#f0883e" stroke-width="1.5" opacity="0.6"/>
    <text x="175" y="416" text-anchor="middle" font-size="8" fill="#94a3b8">wide variance</text>

    <text x="175" y="440" text-anchor="middle" font-size="8" fill="#475569" font-weight="600">After LN</text>
    <!-- Bell curve after -->
    <path d="M 130,450 Q 140,432 150,430 Q 160,432 170,450" fill="none" stroke="#E95420" stroke-width="1.5"/>
    <text x="175" y="470" text-anchor="middle" font-size="8" fill="#94a3b8">zero mean, unit variance</text>
  </g>

  <!-- ==================== PRE-LN / POST-LN CARD ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.3s" fill="freeze"/>
    <rect x="325" y="240" width="250" height="255" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>

    <rect x="345" y="252" width="130" height="22" rx="4" fill="#E95420"/>
    <text x="410" y="267" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Pre-LN vs Post-LN</text>

    <!-- Pre-LN diagram -->
    <text x="450" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#c34113">Pre-LN (modern)</text>
    <rect x="355" y="302" width="50" height="22" rx="4" fill="#E95420" opacity="0.2"/>
    <text x="380" y="316" text-anchor="middle" font-size="8" fill="#c34113">LN</text>
    <rect x="415" y="302" width="50" height="22" rx="4" fill="#E95420" opacity="0.15"/>
    <text x="440" y="316" text-anchor="middle" font-size="8" fill="#c34113">Sublayer</text>
    <line x1="405" y1="313" x2="415" y2="313" stroke="#E95420" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="495" y="316" text-anchor="middle" font-size="8" fill="#64748b">→ + residual</text>

    <!-- Post-LN diagram -->
    <text x="450" y="345" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">Post-LN (original)</text>
    <rect x="355" y="352" width="50" height="22" rx="4" fill="#E95420" opacity="0.15"/>
    <text x="380" y="366" text-anchor="middle" font-size="8" fill="#c34113">Sublayer</text>
    <rect x="415" y="352" width="50" height="22" rx="4" fill="#E95420" opacity="0.2"/>
    <text x="440" y="366" text-anchor="middle" font-size="8" fill="#c34113">LN</text>
    <line x1="405" y1="363" x2="415" y2="363" stroke="#E95420" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="495" y="366" text-anchor="middle" font-size="8" fill="#64748b">→ + residual</text>

    <rect x="355" y="390" width="195" height="55" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="452" y="408" text-anchor="middle" font-size="9" fill="#475569">Pre-LN: LN applied before sublayer</text>
    <text x="452" y="422" text-anchor="middle" font-size="9" fill="#475569">More stable training, no warmup needed</text>
    <text x="452" y="436" text-anchor="middle" font-size="9" fill="#64748b">Used by: GPT-3, LLaMA, Mistral</text>

    <rect x="355" y="455" width="195" height="22" rx="4" fill="#fde8dc"/>
    <text x="452" y="470" text-anchor="middle" font-size="9" fill="#c34113">Post-LN: BERT, original Transformer</text>
  </g>

  <!-- ==================== RMSNorm CARD ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.6s" fill="freeze"/>
    <rect x="600" y="240" width="250" height="255" rx="10" fill="url(#boxGrad)" stroke="#E95420" stroke-width="1.5" filter="url(#shadow)"/>

    <rect x="620" y="252" width="100" height="22" rx="4" fill="#E95420"/>
    <text x="670" y="267" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">RMSNorm</text>

    <!-- Formula -->
    <text x="725" y="298" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">RMS(x) = √(mean(x²))</text>
    <text x="725" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#C34113">y = x / RMS(x) · γ</text>

    <!-- Comparison -->
    <rect x="625" y="340" width="200" height="70" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="725" y="358" text-anchor="middle" font-size="9" fill="#475569">Skips mean subtraction</text>
    <text x="725" y="374" text-anchor="middle" font-size="9" fill="#475569">~5% faster than LayerNorm</text>
    <text x="725" y="390" text-anchor="middle" font-size="9" fill="#64748b">Equivalent in practice</text>

    <rect x="625" y="425" width="200" height="22" rx="4" fill="#fde8dc"/>
    <text x="725" y="440" text-anchor="middle" font-size="9" fill="#c34113">Used by: LLaMA, Mistral</text>

    <rect x="625" y="455" width="200" height="22" rx="4" fill="#fde8dc"/>
    <text x="725" y="470" text-anchor="middle" font-size="9" fill="#c34113">γ = learned scale parameter</text>
  </g>
</svg>
